          FailureAction: pause
          Monitor: 15000000000
          MaxFailureRatio: 0.15
        RollbackConfig:
          Parallelism: 1
          Delay: 1000000000
          FailureAction: pause
          Monitor: 15000000000
          MaxFailureRatio: 0.15
        EndpointSpec:
          Mode: vip
          Ports:
          - Protocol: tcp
            TargetPort: 6379
            PublishedPort: 30001
      Endpoint:
        Spec:
          Mode: vip
          Ports:
          - Protocol: tcp
            TargetPort: 6379
            PublishedPort: 30001
        Ports:
        - Protocol: tcp
          TargetPort: 6379
          PublishedPort: 30001
        VirtualIPs:
        - NetworkID: 4qvuz4ko70xaltuqbt8956gd1
          Addr: 10.255.0.2/16
        - NetworkID: 4qvuz4ko70xaltuqbt8956gd1
          Addr: 10.255.0.3/16
  ServiceUpdateResponse:
    type: object
    properties:
      Warnings:
        description: Optional warning messages
        type: array
        items:
          type: string
