        type: string
      tags:
      - Container
    get:
      summary: Get an archive of a filesystem resource in a container
      description: Get a tar archive of a resource in the filesystem of container id.
      operationId: ContainerArchive
      produces:
      - application/x-tar
      responses:
        200:
          description: no error
        400:
          description: Bad parameter
          schema:
            $ref: '#/definitions/ErrorResponse'
        404:
          description: Container or path does not exist
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              message: 'No such container: c2ada9df5af8'
        500:
          description: server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        description: ID or name of the container
        type: string
      - name: path
        in: query
        required: true
        description: Resource in the container’s filesystem to archive.
        type: string
      tags:
      - Container
    put:
      summary: Extract an archive of files or folders to a directory in a container
      description: 'Upload a tar archive to be extracted to a path in the filesystem of container id.

        `path` parameter is asserted to be a directory. If it exists as a file, 400 error

        will be returned with message "not a directory".

        '
      operationId: PutContainerArchive
      consumes:
      - application/x-tar
      - application/octet-stream
      responses:
        200:
          description: The content was extracted successfully
        400:
          description: Bad parameter
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              message: not a directory
        403:
          description: Permission denied, the volume or container rootfs is marked as read-only.
          schema:
            $ref: '#/definitions/ErrorResponse'
        404:
          description: No such container or path does not exist inside the container
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              message: 'No such container: c2ada9df5af8'
        500:
          description: Server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        description: ID or name of the container
        type: string
      - name: path
        in: query
        required: true
        description: 'Path to a directory in the container to extract the archive’s contents into. '
        type: string
      - name: noOverwriteDirNonDir
        in: query
        description: 'If `1`, `true`, or `True` then it will be an error if unpacking the

          given content would cause an existing directory to be replaced with

          a non-directory and vice versa.

          '
        type: string
      - name: copyUIDGID
        in: query
        description: 'If `1`, `true`, then it will copy UID/GID maps to the dest file or

          dir

          '
        type: string
      - name: inputStream
        in: body
        required: true
        description: 'The input stream must be a tar archive compressed with one of the

          following algorithms: `identity` (no compression), `gzip`, `bzip2`,

          or `xz`.

          '
        schema:
          type: string
          format: binary
      tags:
      - Container
  /containers/prune:
    post:
      summary: Delete stopped containers
      produces:
      - application/json
      operationId: ContainerPrune
      parameters:
      - name: filters
        in: query
        description: 'Filters to process on the prune list, encoded as JSON (a `map[string][]string`).


          Available filters:

          - `until=<timestamp>` Prune containers created before this timestamp. The `<timestamp>` can be Unix timestamps, date formatted timestamps, or Go duration strings (e.g. `10m`, `1h30m`) computed relative to the daemon machine’s time.

          - `label` (`label=<key>`, `label=<key>=<value>`, `label!=<key>`, or `label!=<key>=<value>`) Prune containers with (or without, in case `label!=...` is used) the specified labels.

          '
        type: string
      responses:
        200:
          description: No error
          schema:
            type: object
            title: ContainerPruneResponse
            properties:
              ContainersDeleted:
                description: Container IDs that were deleted
                type: array
                items:
                  type: string
              SpaceReclaimed:
                description: Disk space reclaimed in bytes
                type: integer
                format: int64
        500:
          description: Server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      tags:
      - Container
definitions:
  NetworkingConfig:
    description: 'NetworkingConfig represents the container''s networking configuration for

      each of its interfaces.

      It is used for the networking configs specified in the `docker create`

      and `docker network connect` commands.

      '
    type: object
    properties:
      EndpointsConfig:
        description: 'A mapping of network name to endpoint configuration for that network.

          The endpoint configuration can be left empty to connect to that

          network with no particular endpoint configuration.

          '
        type: object
        additionalProperties:
          $ref: '#/definitions/EndpointSettings'
    example:
      EndpointsConfig:
        isolated_nw:
          IPAMConfig:
            IPv4Address: 172.20.30.33
            IPv6Address: 2001:db8:abcd::3033
            LinkLocalIPs:
            - 169.254.34.68
            - fe80::3468
          MacAddress: 02:42:ac:12:05:02
          Links:
          - container_1
          - container_2
          Aliases:
          - server_x
          - server_y
        database_nw: {}
  ContainerPidsStats:
    description: 'PidsStats contains Linux-specific stats of a container''s process-IDs (PIDs).


      This type is Linux-specific and omitted for Windows containers.

      '
    type: object
    x-go-name: PidsStats
    x-nullable: true
    properties:
      current:
        description: 'Current is the number of PIDs in the cgroup.

          '
        type: integer
        format: uint64
        x-nullable: true
        example: 5
      limit:
        description: 'Limit is the hard limit on the number of pids in the cgroup.

          A "Limit" of 0 means that there is no limit.

          '
        type: integer
        format: uint64
        x-nullable: true
        example: '18446744073709551615'
  ContainerCPUStats:
    description: 'CPU related info of the container

      '
    type: object
    x-go-name: CPUStats
    x-nullable: true
    properties:
      cpu_usage:
        $ref: '#/definitions/ContainerCPUUsage'
      system_cpu_usage:
        description: 'System Usage.


          This field is Linux-specific and omitted for Windows containers.

          '
        type: integer
        format: uint64
        x-nullable: true
        example: 5
      online_cpus:
        description: 'Number of online CPUs.


          This field is Linux-specific and omitted for Windows containers.

          '
        type: integer
        format: uint32
        x-nullable: true
        example: 5
      throttling_data:
        $ref: '#/definitions/ContainerThrottlingData'
  ContainerUpdateResponse:
    type: object
    title: ContainerUpdateResponse
    x-go-name: UpdateResponse
    description: Response for a successful container-update.
    properties:
      Warnings:
        type: array
        description: Warnings encountered when updating the container.
        items:
          type: string
        example:
        - Published ports are discarded when using host network mode
  PortMap:
    description: 'PortMap describes the mapping of container ports to host ports, using the

      container''s port-number and protocol as key in the format `<port>/<protocol>`,

      for example, `80/udp`.


      If a container''s port is mapped for multiple protocols, separate entries

      are added to the mapping table.

      '
    type: object
    additionalProperties:
      type: array
      x-nullable: true
      items:
        $ref: '#/definitions/PortBinding'
    example:
      443/tcp:
      - HostIp: 127.0.0.1
        HostPort: '4443'
      80/tcp:
      - HostIp: 0.0.0.0
        HostPort: '80'
      - HostIp: 0.0.0.0
        HostPort: '8080'
      80/udp:
      - HostIp: 0.0.0.0
        HostPort: '80'
      53/udp:
      - HostIp: 0.0.0.0
        HostPort: '53'
      2377/tcp: null
  DriverData:
    description: 'Information about the storage driver used to store the container''s and

      image''s filesystem.

      '
    type: object
    required:
    - Name
    - Data
    properties:
      Name:
        description: Name of the storage driver.
        type: string
        x-nullable: false
        example: overlay2
      Data:
        description: 'Low-level storage metadata, provided as key/value pairs.


          This information is driver-specific, and depends on the storage-driver

          in use, and should be used for informational purposes only.

          '
        type: object
        x-nullable: false
        additionalProperties:
          type: string
        example:
          MergedDir: /var/lib/docker/overlay2/ef749362d13333e65fc95c572eb525abbe0052e16e086cb64bc3b98ae9aa6d74/merged
          UpperDir: /var/lib/docker/overlay2/ef749362d13333e65fc95c572eb525abbe0052e16e086cb64bc3b98ae9aa6d74/diff
          WorkDir: /var/lib/docker/overlay2/ef749362d13333e65fc95c572eb525abbe0052e16e086cb64bc3b98ae9aa6d74/work
  ChangeType:
    description: 'Kind of change


      Can be one of:


      - `0`: Modified ("C")

      - `1`: Added ("A")

      - `2`: Deleted ("D")

      '
    type: integer
    format: uint8
    enum:
    - 0
    - 1
    - 2
    x-nullable: false
  ContainerCPUUsage:
    description: 'All CPU stats aggregated since container inception.

      '
    type: object
    x-go-name: CPUUsage
    x-nullable: true
    properties:
      total_usage:
        description: 'Total CPU time consumed in nanoseconds (Linux) or 100''s of nanoseconds (Windows).

          '
        type: integer
        format: uint64
        example: 29912000
      percpu_usage:
        description: 'Total CPU time (in nanoseconds) consumed per core (Linux).


          This field is Linux-specific when using cgroups v1. It is omitted

          when using cgroups v2 and Windows containers.

          '
        type: array
        x-nullable: true
        items:
          type: integer
          format: uint64
          example: 29912000
      usage_in_kernelmode:
        description: 'Time (in nanoseconds) spent by tasks of the cgroup in kernel mode (Linux),

          or time spent (in 100''s of nanoseconds) by all container processes in

          kernel mode (Windows).


          Not populated for Windows containers using Hyper-V isolation.

          '
        type: integer
        format: uint64
        example: 21994000
      usage_in_usermode:
        description: 'Time (in nanoseconds) spent by tasks of the cgroup in user mode (Linux),

          or time spent (in 100''s of nanoseconds) by all container processes in

          kernel mode (Windows).


          Not populated for Windows containers using Hyper-V isolation.

          '
        type: integer
        format: uint64
        example: 7918000
  HealthConfig:
    description: 'A test to perform to check that the container is healthy.

      Healthcheck commands should be side-effect free.

      '
    type: object
    properties:
      Test:
        description: 'The test to perform. Possible values are:


          - `[]` inherit healthcheck from image or parent image

          - `["NONE"]` disable healthcheck

          - `["CMD", args...]` exec arguments directly

          - `["CMD-SHELL", command]` run command with system''s default shell


          A non-zero exit code indicates a failed healthcheck:

          - `0` healthy

          - `1` unhealthy

          - `2` reserved (treated as unhealthy)

          - other values: error running probe

          '
        type: array
        items:
          type: string
      Interval:
        description: 'The time to wait between checks in nanoseconds. It should be 0 or at

          least 1000000 (1 ms). 0 means inherit.

          '
        type: integer
        format: int64
      Timeout:
        description: 'The time to wait before considering the check to have hung. It should

          be 0 or at least 1000000 (1 ms). 0 means inherit.


          If the health check command does not complete within this timeout,

          the check is considered failed and the health check process is

          forcibly terminated without a graceful shutdown.

          '
        type: integer
        format: int64
      Retries:
        description: 'The number of consecutive failures needed to consider a container as

          unhealthy. 0 means inherit.

          '
        type: integer
      StartPeriod:
        description: 'Start period for the container to initialize before starting

          health-retries countdown in nanoseconds. It should be 0 or at least

          1000000 (1 ms). 0 means inherit.

          '
        type: integer
        format: int64
      StartInterval:
        description: 'The time to wait between checks in nanoseconds during the start period.

          It should be 0 or at least 1000000 (1 ms). 0 means inherit.

          '
        type: integer
        format: int64
  OCIDescriptor:
    type: object
    x-go-name: Descriptor
    description: 'A descriptor struct containing digest, media type, and size, as defined in

      the [OCI Content Descriptors Specification](https://github.com/opencontainers/image-spec/blob/v1.0.1/descriptor.md).

      '
    properties:
      mediaType:
        description: 'The media type of the object this schema refers to.

          '
        type: string
        example: application/vnd.oci.image.manifest.v1+json
      digest:
