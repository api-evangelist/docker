        Settings:
          allOf:
            - $ref: '#/components/schemas/Settings'
            - description: user-configurable settings for the plugin.
        PluginReference:
          type: string
          description: plugin remote reference used to push/pull the plugin
          examples:
            - localhost:5000/tiborvass/sample-volume-plugin:latest
        Config:
          allOf:
            - $ref: '#/components/schemas/Config3'
            - description: The config of a plugin.
      description: A plugin for the Engine API
    ObjectVersion:
      title: ObjectVersion
      type: object
      properties:
        Index:
          type: integer
          contentEncoding: int32
          examples:
            - 373531
      description: >-
        The version number of the object such as node, service, etc. This is
        needed

        to avoid conflicting writes. The client must send the version number
        along

        with the modified specification when updating these objects.


        This approach ensures safe concurrency and determinism in that the
        change

        on the object may not be applied if the version number has changed from
        the

        last read. In other words, if two update requests specify the same base

        version, only one of the requests can succeed. As a result, two separate

        update requests that happen at the same time will not unintentionally

        overwrite each other.
    NodeSpec:
      title: NodeSpec
      type: object
      properties:
        Name:
          type: string
          description: Name for the node.
          examples:
            - my-node
        Labels:
          type: object
          additionalProperties:
            type: string
          description: User-defined key/value metadata.
        Role:
          allOf:
            - $ref: '#/components/schemas/Role'
            - description: Role of the node.
              examples:
                - manager
        Availability:
          allOf:
            - $ref: '#/components/schemas/Availability1'
            - description: Availability of the node.
              examples:
                - active
      examples:
        - Availability: active
          Name: node-name
          Role: manager
          Labels:
            foo: bar
    Node:
      title: Node
      type: object
      properties:
        ID:
          type: string
          examples:
            - 24ifsmvkjbyhk
