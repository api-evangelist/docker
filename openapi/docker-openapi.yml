          $ref: '#/components/schemas/ProgressDetail'
    PushImageInfo:
      title: PushImageInfo
      type: object
      properties:
        errorDetail:
          $ref: '#/components/schemas/ErrorDetail'
        status:
          type: string
        progressDetail:
          $ref: '#/components/schemas/ProgressDetail'
    DeviceInfo:
      title: DeviceInfo
      type: object
      properties:
        Source:
          type: string
          description: The origin device driver.
          examples:
            - cdi
        ID:
          type: string
          description: |-
            The unique identifier for the device within its source driver.
            For CDI devices, this would be an FQDN like "vendor.com/gpu=0".
          examples:
            - vendor.com/gpu=0
      description: DeviceInfo represents a device that can be used by a container.
    ErrorDetail:
      title: ErrorDetail
      type: object
