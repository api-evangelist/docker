        Name:
          type: string
          examples:
            - network
        Description:
          type: string
        Value:
          type: array
          items:
            type: string
          description: ''
          examples:
            - - host
      description: |-
        Describes a permission the user has to accept upon installing
        the plugin.
    Plugin:
      title: Plugin
      required:
        - Name
        - Enabled
        - Settings
        - Config
      type: object
      properties:
        Id:
          type: string
          examples:
            - 5724e2c8652da337ab2eedd19fc6fc0ec908e4bd907c7421bf6a8dfc70c4c078
        Name:
          type: string
          examples:
            - tiborvass/sample-volume-plugin
        Enabled:
          type: boolean
          description: >-
            True if the plugin is running. False if the plugin is not running,
