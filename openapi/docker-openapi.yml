          contentEncoding: int64
        Binds:
          type: array
          items:
            type: string
          description: >-
            A list of volume bindings for this container. Each volume binding

            is a string in one of these forms:


            - `host-src:container-dest[:options]` to bind-mount a host path
              into the container. Both `host-src`, and `container-dest` must
              be an _absolute_ path.
            - `volume-name:container-dest[:options]` to bind-mount a volume
              managed by a volume driver into the container. `container-dest`
              must be an _absolute_ path.

            `options` is an optional, comma-delimited list of:


            - `nocopy` disables automatic copying of data from the container
              path to the volume. The `nocopy` flag only applies to named volumes.
            - `[ro|rw]` mounts a volume read-only or read-write, respectively.
              If omitted or set to `rw`, volumes are mounted read-write.
            - `[z|Z]` applies SELinux labels to allow or deny multiple
            containers
              to read and write to the same volume.
                - `z`: a _shared_ content label is applied to the content. This
                  label indicates that multiple containers can share the volume
                  content, for both reading and writing.
                - `Z`: a _private unshared_ label is applied to the content.
                  This label indicates that only the current container can use
                  a private volume. Labeling systems such as SELinux require
                  proper labels to be placed on volume content that is mounted
                  into a container. Without a label, the security system can
                  prevent a container's processes from using the content. By
                  default, the labels set by the host operating system are not
                  modified.
            - `[[r]shared|[r]slave|[r]private]` specifies mount
              [propagation behavior](https://www.kernel.org/doc/Documentation/filesystems/sharedsubtree.txt).
              This only applies to bind-mounted volumes, not internal volumes
              or named volumes. Mount propagation requires the source mount
              point (the location where the source directory is mounted in the
              host operating system) to have the correct propagation properties.
              For shared volumes, the source mount point must be set to `shared`.
              For slave volumes, the mount must be set to either `shared` or
              `slave`.
        ContainerIDFile:
          type: string
          description: Path to a file where the container ID is written
        LogConfig:
          allOf:
            - $ref: '#/components/schemas/LogConfig'
            - description: The logging configuration for this container
        NetworkMode:
          type: string
          description: |-
            Network mode to use for this container. Supported standard values
            are: `bridge`, `host`, `none`, and `container:<name|id>`. Any
            other value is taken as a custom network's name to which this
            container should connect to.
        PortBindings:
          type: object
          additionalProperties:
            type: object
          description: >-
            PortMap describes the mapping of container ports to host ports,
            using the

            container's port-number and protocol as key in the format
            `<port>/<protocol>`,

            for example, `80/udp`.


            If a container's port is mapped for multiple protocols, separate
            entries

            are added to the mapping table.
          examples:
            - 443/tcp:
                - HostIp: 127.0.0.1
                  HostPort: '4443'
              80/tcp:
                - HostIp: 0.0.0.0
                  HostPort: '80'
                - HostIp: 0.0.0.0
                  HostPort: '8080'
              80/udp:
                - HostIp: 0.0.0.0
                  HostPort: '80'
              53/udp:
                - HostIp: 0.0.0.0
                  HostPort: '53'
              2377/tcp: null
        RestartPolicy:
          allOf:
            - $ref: '#/components/schemas/RestartPolicy'
            - description: >-
                The behavior to apply when the container exits. The default is
                not to

                restart.


                An ever increasing delay (double the previous delay, starting at
                100ms) is

                added before each restart to prevent flooding the server.
        AutoRemove:
          type: boolean
          description: |-
            Automatically remove the container when the container's process
            exits. This has no effect if `RestartPolicy` is set.
        VolumeDriver:
          type: string
          description: Driver that this container uses to mount volumes.
        VolumesFrom:
          type: array
          items:
            type: string
          description: |-
            A list of volumes to inherit from another container, specified in
            the form `<container name>[:<ro|rw>]`.
        Mounts:
          type: array
          items:
            $ref: '#/components/schemas/Mount'
          description: Specification for mounts to be added to the container.
        ConsoleSize:
          maxItems: 2
          minItems: 2
          type: array
          items:
            minimum: 0
            type: integer
            contentEncoding: int32
          description: Initial console size, as an `[height, width]` array.
          examples:
            - - 80
              - 64
        Annotations:
          type: object
          additionalProperties:
            type: string
          description: |-
            Arbitrary non-identifying metadata attached to container and
            provided to the runtime when the container is started.
        CapAdd:
          type: array
          items:
            type: string
          description: |-
            A list of kernel capabilities to add to the container. Conflicts
            with option 'Capabilities'.
        CapDrop:
          type: array
          items:
            type: string
          description: |-
            A list of kernel capabilities to drop from the container. Conflicts
            with option 'Capabilities'.
        CgroupnsMode:
          allOf:
            - $ref: '#/components/schemas/CgroupnsMode'
            - description: >-
                cgroup namespace mode for the container. Possible values are:


                - `"private"`: the container runs in its own private cgroup
                namespace

                - `"host"`: use the host system's cgroup namespace


                If not specified, the daemon default is used, which can either
                be `"private"`

                or `"host"`, depending on daemon version, kernel support and
                configuration.
        Dns:
          type: array
          items:
            type: string
          description: A list of DNS servers for the container to use.
        DnsOptions:
          type: array
          items:
            type: string
          description: A list of DNS options.
        DnsSearch:
          type: array
          items:
            type: string
          description: A list of DNS search domains.
        ExtraHosts:
          type: array
          items:
            type: string
          description: >-
            A list of hostnames/IP mappings to add to the container's
            `/etc/hosts`

            file. Specified in the form `["hostname:IP"]`.
        GroupAdd:
          type: array
          items:
            type: string
          description: A list of additional groups that the container process will run as.
        IpcMode:
          type: string
          description: >-
            IPC sharing mode for the container. Possible values are:


            - `"none"`: own private IPC namespace, with /dev/shm not mounted

            - `"private"`: own private IPC namespace

            - `"shareable"`: own private IPC namespace, with a possibility to
            share it with other containers

            - `"container:<name|id>"`: join another (shareable) container's IPC
            namespace

            - `"host"`: use the host system's IPC namespace


            If not specified, daemon default is used, which can either be
            `"private"`

            or `"shareable"`, depending on daemon version and configuration.
        Cgroup:
          type: string
          description: Cgroup to use for the container.
        Links:
          type: array
          items:
            type: string
          description: >-
            A list of links for the container in the form
            `container_name:alias`.
        OomScoreAdj:
          type: integer
          description: |-
            An integer value containing the score given to the container in
            order to tune OOM killer preferences.
          contentEncoding: int32
          examples:
            - 500
        PidMode:
          type: string
          description: |-
            Set the PID (Process) Namespace mode for the container. It can be
            either:

            - `"container:<name|id>"`: joins another container's PID namespace
            - `"host"`: use the host's PID namespace inside the container
        Privileged:
          type: boolean
          description: Gives the container full access to the host.
        PublishAllPorts:
          type: boolean
          description: |-
            Allocates an ephemeral host port for all of a container's
            exposed ports.

            Ports are de-allocated when the container stops and allocated when
            the container starts. The allocated port might be changed when
            restarting the container.

            The port is selected from the ephemeral port range that depends on
            the kernel. For example, on Linux the range is defined by
            `/proc/sys/net/ipv4/ip_local_port_range`.
        ReadonlyRootfs:
          type: boolean
          description: Mount the container's root filesystem as read only.
        SecurityOpt:
          type: array
          items:
            type: string
          description: |-
            A list of string values to customize labels for MLS systems, such
            as SELinux.
        StorageOpt:
          type: object
          additionalProperties:
            type: string
          description: >-
            Storage driver options for this container, in the form `{"size":
            "120G"}`.
        Tmpfs:
          type: object
          additionalProperties:
            type: string
          description: |-
            A map of container directories which should be replaced by tmpfs
            mounts, and their corresponding mount options. For example:

            ```
            { "/run": "rw,noexec,nosuid,size=65536k" }
            ```
        UTSMode:
          type: string
          description: UTS namespace to use for the container.
        UsernsMode:
          type: string
          description: |-
            Sets the usernamespace mode for the container when usernamespace
            remapping option is enabled.
        ShmSize:
          minimum: 0
          type: integer
          description: Size of `/dev/shm` in bytes. If omitted, the system uses 64MB.
          contentEncoding: int64
        Sysctls:
          type: object
          additionalProperties:
            type: string
          description: |-
            A list of kernel parameters (sysctls) to set in the container.

            This field is omitted if not set.
          examples:
            - net.ipv4.ip_forward: '1'
        Runtime:
          type: string
          description: Runtime to use with this container.
        Isolation:
          allOf:
            - $ref: '#/components/schemas/Isolation'
            - description: Isolation technology of the container. (Windows only)
        MaskedPaths:
          type: array
          items:
            type: string
          description: |-
            The list of paths to be masked inside the container (this overrides
            the default set of paths).
          examples:
            - - /proc/asound
              - /proc/acpi
              - /proc/kcore
              - /proc/keys
              - /proc/latency_stats
              - /proc/timer_list
              - /proc/timer_stats
              - /proc/sched_debug
              - /proc/scsi
              - /sys/firmware
              - /sys/devices/virtual/powercap
        ReadonlyPaths:
          type: array
          items:
            type: string
          description: |-
            The list of paths to be set as read-only inside the container
            (this overrides the default set of paths).
          examples:
            - - /proc/bus
              - /proc/fs
              - /proc/irq
              - /proc/sys
              - /proc/sysrq-trigger
      description: Container configuration that depends on the host we are running on
    ContainerConfig:
      title: ContainerConfig
      type: object
      properties:
        Hostname:
          type: string
          description: The hostname to use for the container, as a valid RFC 1123 hostname.
          examples:
            - 439f4e91bd1d
        Domainname:
          type: string
          description: The domain name to use for the container.
        User:
          type: string
          description: >-
            Commands run as this user inside the container. If omitted, commands

            run as the user specified in the image the container was started
            from.


            Can be either user-name or UID, and optional group-name or GID,

            separated by a colon (`<user-name|UID>[<:group-name|GID>]`).
          examples:
            - '123:456'
        AttachStdin:
          type: boolean
          description: Whether to attach to `stdin`.
          default: false
        AttachStdout:
          type: boolean
          description: Whether to attach to `stdout`.
          default: true
        AttachStderr:
          type: boolean
          description: Whether to attach to `stderr`.
          default: true
        ExposedPorts:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ExposedPorts'
          description: |-
            An object mapping ports to an empty object in the form:

            `{"<port>/<tcp|udp|sctp>": {}}`
          examples:
            - 80/tcp: {}
              443/tcp: {}
        Tty:
          type: boolean
          description: >-
            Attach standard streams to a TTY, including `stdin` if it is not
            closed.
          default: false
        OpenStdin:
          type: boolean
          description: Open `stdin`
          default: false
        StdinOnce:
          type: boolean
          description: Close `stdin` after one attached client disconnects
          default: false
        Env:
          type: array
          items:
            type: string
          description: >-
            A list of environment variables to set inside the container in the

            form `["VAR=value", ...]`. A variable without `=` is removed from
            the

            environment, rather than to have an empty value.
          examples:
            - - >-
                PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        Cmd:
          type: array
          items:
            type: string
          description: Command to run specified as a string or an array of strings.
          examples:
            - - /bin/sh
        Healthcheck:
          allOf:
            - $ref: '#/components/schemas/HealthConfig'
            - description: A test to perform to check that the container is healthy.
        ArgsEscaped:
          type: boolean
          description: Command is already escaped (Windows only)
          default: false
          examples:
            - false
        Image:
          type: string
          description: >-
            The name (or reference) of the image to use when creating the
            container,

            or which was used when the container was created.
          examples:
            - example-image:1.0
        Volumes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Volumes'
          description: |-
            An object mapping mount point paths inside the container to empty
            objects.
        WorkingDir:
          type: string
          description: The working directory for commands to run in.
          examples:
            - /public/
        Entrypoint:
          type: array
          items:
            type: string
          description: >-
            The entry point for the container as a string or an array of
            strings.


            If the array consists of exactly one empty string (`[""]`) then the

            entry point is reset to system default (i.e., the entry point used
            by

            docker when there is no `ENTRYPOINT` instruction in the
            `Dockerfile`).
          examples:
            - []
        NetworkDisabled:
          type: boolean
          description: Disable networking for the container.
        OnBuild:
          type: array
          items:
            type: string
          description: '`ONBUILD` metadata that were defined in the image''s `Dockerfile`.'
          examples:
            - []
        Labels:
          type: object
          additionalProperties:
            type: string
          description: User-defined key/value metadata.
          examples:
            - com.example.some-label: some-value
              com.example.some-other-label: some-other-value
        StopSignal:
          type: string
          description: Signal to stop a container as a string or unsigned integer.
          examples:
            - SIGTERM
        StopTimeout:
          type: integer
          description: Timeout to stop a container in seconds.
          contentEncoding: int32
          default: 10
        Shell:
          type: array
          items:
            type: string
          description: Shell for when `RUN`, `CMD`, and `ENTRYPOINT` uses a shell.
          examples:
            - - /bin/sh
              - '-c'
      description: Configuration for a container that is portable between hosts.
    ImageConfig:
      title: ImageConfig
      type: object
      properties:
        User:
          type: string
          description: The user that commands are run as inside the container.
          examples:
            - web:web
        ExposedPorts:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ExposedPorts'
          description: |-
            An object mapping ports to an empty object in the form:

            `{"<port>/<tcp|udp|sctp>": {}}`
          examples:
            - 80/tcp: {}
              443/tcp: {}
        Env:
          type: array
          items:
            type: string
          description: >-
            A list of environment variables to set inside the container in the

            form `["VAR=value", ...]`. A variable without `=` is removed from
            the

            environment, rather than to have an empty value.
          examples:
            - - >-
                PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        Cmd:
          type: array
          items:
            type: string
          description: Command to run specified as a string or an array of strings.
          examples:
            - - /bin/sh
        Healthcheck:
          allOf:
            - $ref: '#/components/schemas/HealthConfig'
            - description: A test to perform to check that the container is healthy.
        ArgsEscaped:
          type: boolean
          description: Command is already escaped (Windows only)
          default: false
          examples:
            - false
        Volumes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Volumes'
          description: |-
            An object mapping mount point paths inside the container to empty
            objects.
          examples:
            - /app/data: {}
              /app/config: {}
        WorkingDir:
          type: string
          description: The working directory for commands to run in.
          examples:
            - /public/
        Entrypoint:
          type: array
          items:
            type: string
          description: >-
            The entry point for the container as a string or an array of
            strings.


            If the array consists of exactly one empty string (`[""]`) then the

            entry point is reset to system default (i.e., the entry point used
            by

            docker when there is no `ENTRYPOINT` instruction in the
            `Dockerfile`).
          examples:
            - []
        OnBuild:
          type: array
          items:
            type: string
          description: '`ONBUILD` metadata that were defined in the image''s `Dockerfile`.'
          examples:
            - []
        Labels:
          type: object
          additionalProperties:
            type: string
          description: User-defined key/value metadata.
          examples:
            - com.example.some-label: some-value
              com.example.some-other-label: some-other-value
        StopSignal:
          type: string
          description: Signal to stop a container as a string or unsigned integer.
          examples:
            - SIGTERM
        Shell:
          type: array
          items:
            type: string
          description: Shell for when `RUN`, `CMD`, and `ENTRYPOINT` uses a shell.
          examples:
            - - /bin/sh
              - '-c'
      description: |-
        Configuration of the image. These fields are used as defaults
        when starting a container from the image.
    NetworkingConfig:
      title: NetworkingConfig
      type: object
      properties:
        EndpointsConfig:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EndpointSettings'
          description: >-
            A mapping of network name to endpoint configuration for that
            network.

            The endpoint configuration can be left empty to connect to that

            network with no particular endpoint configuration.
      description: |-
        NetworkingConfig represents the container's networking configuration for
        each of its interfaces.
        It is used for the networking configs specified in the `docker create`
        and `docker network connect` commands.
      examples:
        - EndpointsConfig:
            isolated_nw:
              IPAMConfig:
                IPv4Address: 172.20.30.33
                IPv6Address: 2001:db8:abcd::3033
                LinkLocalIPs:
                  - 169.254.34.68
                  - fe80::3468
              MacAddress: 02:42:ac:12:05:02
              Links:
                - container_1
                - container_2
              Aliases:
                - server_x
                - server_y
            database_nw: {}
    NetworkSettings:
      title: NetworkSettings
      type: object
      properties:
        SandboxID:
          type: string
          description: SandboxID uniquely represents a container's network stack.
          examples:
            - 9d12daf2c33f5959c8bf90aa513e4f65b561738661003029ec84830cd503a0c3
        SandboxKey:
          type: string
          description: SandboxKey is the full path of the netns handle
          examples:
            - /var/run/docker/netns/8ab54b426c38
        Ports:
          type: object
          additionalProperties:
            type: object
          description: >-
            PortMap describes the mapping of container ports to host ports,
            using the

            container's port-number and protocol as key in the format
            `<port>/<protocol>`,

            for example, `80/udp`.


            If a container's port is mapped for multiple protocols, separate
            entries

            are added to the mapping table.
          examples:
            - 443/tcp:
                - HostIp: 127.0.0.1
                  HostPort: '4443'
              80/tcp:
                - HostIp: 0.0.0.0
                  HostPort: '80'
                - HostIp: 0.0.0.0
                  HostPort: '8080'
              80/udp:
                - HostIp: 0.0.0.0
                  HostPort: '80'
              53/udp:
                - HostIp: 0.0.0.0
                  HostPort: '53'
              2377/tcp: null
        Networks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EndpointSettings'
          description: Information about all networks that the container is connected to.
      description: NetworkSettings exposes the network settings in the API
    Address:
      title: Address
      type: object
      properties:
        Addr:
          type: string
          description: IP address.
        PrefixLen:
          type: integer
          description: Mask length of the IP address.
          contentEncoding: int32
      description: Address represents an IPv4 or IPv6 IP address.
    PortBinding:
      title: PortBinding
      type: object
      properties:
        HostIp:
          type: string
          description: Host IP address that the container's port is mapped to.
          examples:
            - 127.0.0.1
        HostPort:
          type: string
          description: Host port number that the container's port is mapped to.
          examples:
            - '4443'
      description: |-
        PortBinding represents a binding between a host IP address and a host
        port.
    DriverData:
      title: DriverData
      required:
        - Name
        - Data
      type: object
      properties:
        Name:
          type: string
          description: Name of the storage driver.
          examples:
            - overlay2
        Data:
          type: object
          additionalProperties:
            type: string
          description: >-
            Low-level storage metadata, provided as key/value pairs.


            This information is driver-specific, and depends on the
            storage-driver

            in use, and should be used for informational purposes only.
          examples:
            - MergedDir: >-
                /var/lib/docker/overlay2/ef749362d13333e65fc95c572eb525abbe0052e16e086cb64bc3b98ae9aa6d74/merged
              UpperDir: >-
                /var/lib/docker/overlay2/ef749362d13333e65fc95c572eb525abbe0052e16e086cb64bc3b98ae9aa6d74/diff
              WorkDir: >-
                /var/lib/docker/overlay2/ef749362d13333e65fc95c572eb525abbe0052e16e086cb64bc3b98ae9aa6d74/work
      description: |-
        Information about the storage driver used to store the container's and
        image's filesystem.
    Storage:
      title: Storage
      type: object
      properties:
        RootFS:
          allOf:
            - $ref: '#/components/schemas/RootFSStorage'
            - description: >-
                Information about the storage used for the container's root
                filesystem.
      description: Information about the storage used by the container.
    RootFSStorage:
      title: RootFSStorage
      type: object
      properties:
        Snapshot:
          allOf:
            - $ref: '#/components/schemas/RootFSStorageSnapshot'
            - description: >-
                Information about a snapshot backend of the container's root
                filesystem.
      description: Information about the storage used for the container's root filesystem.
    RootFSStorageSnapshot:
      title: RootFSStorageSnapshot
      type: object
      properties:
        Name:
          type: string
          description: Name of the snapshotter.
      description: Information about a snapshot backend of the container's root filesystem.
    FilesystemChange:
      title: FilesystemChange
      required:
        - Path
        - Kind
      type: object
      properties:
        Path:
          type: string
          description: Path to file or directory that has changed.
        Kind:
          allOf:
            - $ref: '#/components/schemas/ChangeType'
            - description: |-
                Kind of change

                Can be one of:

                - `0`: Modified ("C")
                - `1`: Added ("A")
                - `2`: Deleted ("D")
      description: Change in the container's filesystem.
    ChangeType:
      title: ChangeType
      enum:
        - 0
        - 1
        - 2
      type: integer
      description: |-
        Kind of change

        Can be one of:

        - `0`: Modified ("C")
        - `1`: Added ("A")
        - `2`: Deleted ("D")
    ImageInspect:
      title: ImageInspect
      type: object
      properties:
        Id:
          type: string
          description: |-
            ID is the content-addressable ID of an image.

            This identifier is a content-addressable digest calculated from the
            image's configuration (which includes the digests of layers used by
            the image).

            Note that this digest differs from the `RepoDigests` below, which
            holds digests of image manifests that reference the image.
          examples:
            - >-
              sha256:ec3f0931a6e6b6855d76b2d7b0be30e81860baccd891b2e243280bf1cd8ad710
        Descriptor:
          allOf:
            - $ref: '#/components/schemas/OCIDescriptor'
            - description: >-
                A descriptor struct containing digest, media type, and size, as
                defined in

                the [OCI Content Descriptors
                Specification](https://github.com/opencontainers/image-spec/blob/v1.0.1/descriptor.md).
        Manifests:
          type: array
          items:
            $ref: '#/components/schemas/ImageManifestSummary'
          description: >-
            Manifests is a list of image manifests available in this image. It

            provides a more detailed view of the platform-specific image
            manifests or

            other image-attached data like build attestations.


            Only available if the daemon provides a multi-platform image store

            and the `manifests` option is set in the inspect request.


            WARNING: This is experimental and may change at any time without any
            backward

            compatibility.
        RepoTags:
          type: array
          items:
            type: string
          description: >-
            List of image names/tags in the local image cache that reference
            this

            image.


            Multiple image tags can refer to the same image, and this list may
            be

            empty if no tags reference the image, in which case the image is

            "untagged", in which case it can still be referenced by its ID.
          examples:
            - - example:1.0
              - example:latest
              - example:stable
              - internal.registry.example.com:5000/example:1.0
        RepoDigests:
          type: array
          items:
            type: string
          description: >-
            List of content-addressable digests of locally available image
            manifests

            that the image is referenced from. Multiple manifests can refer to
            the

            same image.


            These digests are usually only available if the image was either
            pulled

            from a registry, or if the image was pushed to a registry, which is
            when

            the manifest is generated and its digest calculated.
          examples:
            - - >-
                example@sha256:afcc7f1ac1b49db317a7196c902e61c6c3c4607d63599ee1a82d702d249a0ccb
              - >-
                internal.registry.example.com:5000/example@sha256:b69959407d21e8a062e0416bf13405bb2b71ed7a84dde4158ebafacfa06f5578
        Comment:
          type: string
          description: >-
            Optional message that was set when committing or importing the
            image.
        Created:
          type: string
          description: >-
            Date and time at which the image was created, formatted in

            [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format with
            nano-seconds.


            This information is only available if present in the image,

            and omitted otherwise.
          examples:
            - '2022-02-04T21:20:12.497Z'
        Author:
          type: string
          description: >-
            Name of the author that was specified when committing the image, or
            as

            specified through MAINTAINER (deprecated) in the Dockerfile.
        Config:
          allOf:
            - $ref: '#/components/schemas/ImageConfig'
            - description: |-
                Configuration of the image. These fields are used as defaults
                when starting a container from the image.
        Architecture:
          type: string
          description: Hardware CPU architecture that the image runs on.
          examples:
            - arm
        Variant:
          type: string
          description: CPU architecture variant (presently ARM-only).
          examples:
            - v7
        Os:
          type: string
          description: Operating System the image is built to run on.
          examples:
            - linux
        OsVersion:
          type: string
          description: |-
            Operating System version the image is built to run on (especially
            for Windows).
        Size:
          type: integer
          description: Total size of the image including all layers it is composed of.
          contentEncoding: int64
          examples:
            - 1239828
        GraphDriver:
          allOf:
            - $ref: '#/components/schemas/DriverData'
            - description: >-
                Information about the storage driver used to store the
                container's and

                image's filesystem.
        RootFS:
          allOf:
            - $ref: '#/components/schemas/RootFS'
            - description: Information about the image's RootFS, including the layer IDs.
        Metadata:
          allOf:
            - $ref: '#/components/schemas/Metadata'
            - description: >-
                Additional metadata of the image in the local cache. This
                information

                is local to the daemon, and not part of the image itself.
      description: Information about an image in the local image cache.
    ImageSummary:
      title: ImageSummary
      required:
        - Id
        - ParentId
        - RepoTags
        - RepoDigests
        - Created
        - Size
        - SharedSize
        - Labels
        - Containers
      type: object
      properties:
        Id:
          type: string
          description: |-
            ID is the content-addressable ID of an image.

            This identifier is a content-addressable digest calculated from the
            image's configuration (which includes the digests of layers used by
            the image).

            Note that this digest differs from the `RepoDigests` below, which
            holds digests of image manifests that reference the image.
          examples:
            - >-
              sha256:ec3f0931a6e6b6855d76b2d7b0be30e81860baccd891b2e243280bf1cd8ad710
        ParentId:
          type: string
          description: |-
            ID of the parent image.

            Depending on how the image was created, this field may be empty and
            is only set for images that were built/created locally. This field
            is empty if the image was pulled from an image registry.
        RepoTags:
          type: array
          items:
            type: string
          description: >-
            List of image names/tags in the local image cache that reference
            this

            image.


            Multiple image tags can refer to the same image, and this list may
            be

            empty if no tags reference the image, in which case the image is

            "untagged", in which case it can still be referenced by its ID.
          examples:
            - - example:1.0
              - example:latest
              - example:stable
              - internal.registry.example.com:5000/example:1.0
        RepoDigests:
          type: array
          items:
            type: string
          description: >-
            List of content-addressable digests of locally available image
            manifests

            that the image is referenced from. Multiple manifests can refer to
            the

            same image.


            These digests are usually only available if the image was either
            pulled

            from a registry, or if the image was pushed to a registry, which is
            when

            the manifest is generated and its digest calculated.
          examples:
            - - >-
                example@sha256:afcc7f1ac1b49db317a7196c902e61c6c3c4607d63599ee1a82d702d249a0ccb
              - >-
                internal.registry.example.com:5000/example@sha256:b69959407d21e8a062e0416bf13405bb2b71ed7a84dde4158ebafacfa06f5578
        Created:
          type: integer
          description: |-
            Date and time at which the image was created as a Unix timestamp
            (number of seconds since EPOCH).
          contentEncoding: int32
          examples:
            - 1644009612
        Size:
          type: integer
          description: Total size of the image including all layers it is composed of.
          contentEncoding: int64
          examples:
            - 172064416
        SharedSize:
          type: integer
          description: >-
            Total size of image layers that are shared between this image and
            other

            images.


            This size is not calculated by default. `-1` indicates that the
            value

            has not been set / calculated.
          contentEncoding: int64
          examples:
            - 1239828
        Labels:
          type: object
          additionalProperties:
            type: string
          description: User-defined key/value metadata.
          examples:
            - com.example.some-label: some-value
              com.example.some-other-label: some-other-value
        Containers:
          type: integer
          description: >-
            Number of containers using this image. Includes both stopped and
            running

            containers.


            `-1` indicates that the value has not been set / calculated.
          contentEncoding: int32
          examples:
            - 2
        Manifests:
          type: array
          items:
            $ref: '#/components/schemas/ImageManifestSummary'
          description: >-
            Manifests is a list of manifests available in this image.

            It provides a more detailed view of the platform-specific image
            manifests

            or other image-attached data like build attestations.


            WARNING: This is experimental and may change at any time without any
            backward

            compatibility.
        Descriptor:
          allOf:
            - $ref: '#/components/schemas/OCIDescriptor'
            - description: >-
                A descriptor struct containing digest, media type, and size, as
                defined in

                the [OCI Content Descriptors
                Specification](https://github.com/opencontainers/image-spec/blob/v1.0.1/descriptor.md).
    ImagesDiskUsage:
      title: ImagesDiskUsage
      type: object
      properties:
        ActiveCount:
          type: integer
          description: Count of active images.
          contentEncoding: int64
          examples:
            - 1
        TotalCount:
          type: integer
          description: Count of all images.
          contentEncoding: int64
          examples:
            - 4
        Reclaimable:
          type: integer
          description: Disk space that can be reclaimed by removing unused images.
          contentEncoding: int64
          examples:
            - 12345678
        TotalSize:
          type: integer
          description: Disk space in use by images.
          contentEncoding: int64
          examples:
            - 98765432
        Items:
          type: array
          items: {}
          description: List of image summaries.
      description: represents system data usage for image resources.
    AuthConfig:
      title: AuthConfig
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        serveraddress:
          type: string
      examples:
        - username: hannibal
          password: xxxx
          serveraddress: https://index.docker.io/v1/
    AuthResponse:
      title: AuthResponse
      required:
        - Status
      type: object
      properties:
        Status:
          type: string
          description: The status of the authentication
          examples:
            - Login Succeeded
        IdentityToken:
          type: string
          description: An opaque token used to authenticate a user after a successful login
          examples:
            - 9cbaf023786cd7...
      description: An identity token was generated successfully.
    ProcessConfig:
      title: ProcessConfig
      type: object
      properties:
        privileged:
          type: boolean
        user:
          type: string
        tty:
          type: boolean
        entrypoint:
          type: string
        arguments:
          type: array
          items:
            type: string
          description: ''
    Volume:
      title: Volume
      required:
        - Name
        - Driver
        - Mountpoint
        - Labels
        - Scope
        - Options
      type: object
      properties:
        Name:
          type: string
          description: Name of the volume.
          examples:
            - tardis
        Driver:
          type: string
          description: Name of the volume driver used by the volume.
          examples:
            - custom
        Mountpoint:
          type: string
          description: Mount path of the volume on the host.
          examples:
            - /var/lib/docker/volumes/tardis
        CreatedAt:
          type: string
          description: Date/Time the volume was created.
          examples:
            - '2016-06-07T20:31:11.853Z'
        Status:
          type: object
          additionalProperties:
            type: object
          description: |-
            Low-level details about the volume, provided by the volume driver.
            Details are returned as a map with key/value pairs:
            `{"key":"value","key2":"value2"}`.

            The `Status` field is optional, and is omitted if the volume driver
            does not support this feature.
          examples:
            - hello: world
        Labels:
          type: object
          additionalProperties:
            type: string
          description: User-defined key/value metadata.
          examples:
            - com.example.some-label: some-value
              com.example.some-other-label: some-other-value
        Scope:
          allOf:
            - $ref: '#/components/schemas/Scope'
            - description: >-
                The level at which the volume exists. Either `global` for
                cluster-wide,

                or `local` for machine level.
              examples:
                - local
        ClusterVolume:
          allOf:
            - $ref: '#/components/schemas/ClusterVolume'
            - description: >-
                Options and information specific to, and only present on, Swarm
                CSI

                cluster volumes.
        Options:
          type: object
          additionalProperties:
            type: string
          description: The driver specific options used when creating the volume.
          examples:
            - device: tmpfs
              o: size=100m,uid=1000
              type: tmpfs
        UsageData:
          allOf:
            - $ref: '#/components/schemas/UsageData'
            - description: |-
                Usage details about the volume. This information is used by the
                `GET /system/df` endpoint, and omitted in other endpoints.
    VolumesDiskUsage:
      title: VolumesDiskUsage
      type: object
      properties:
        ActiveCount:
          type: integer
          description: Count of active volumes.
          contentEncoding: int64
          examples:
            - 1
        TotalCount:
          type: integer
          description: Count of all volumes.
          contentEncoding: int64
          examples:
            - 4
        Reclaimable:
          type: integer
          description: Disk space that can be reclaimed by removing inactive volumes.
          contentEncoding: int64
          examples:
            - 12345678
        TotalSize:
          type: integer
          description: Disk space in use by volumes.
          contentEncoding: int64
          examples:
            - 98765432
        Items:
          type: array
          items: {}
          description: List of volumes.
      description: represents system data usage for volume resources.
    VolumeConfig:
      title: VolumeConfig
      type: object
      properties:
        Name:
          type: string
          description: The new volume's name. If not specified, Docker generates a name.
          examples:
            - tardis
        Driver:
          type: string
          description: Name of the volume driver to use.
          default: local
          examples:
            - custom
        DriverOpts:
          type: object
          additionalProperties:
            type: string
          description: |-
            A mapping of driver options and values. These options are
            passed directly to the driver and are driver specific.
          examples:
            - device: tmpfs
              o: size=100m,uid=1000
              type: tmpfs
        Labels:
          type: object
          additionalProperties:
            type: string
          description: User-defined key/value metadata.
          examples:
            - com.example.some-label: some-value
              com.example.some-other-label: some-other-value
        ClusterVolumeSpec:
          allOf:
            - $ref: '#/components/schemas/ClusterVolumeSpec'
            - description: Cluster-specific options used to create the volume.
      description: Volume configuration
    VolumeListResponse:
      title: VolumeListResponse
      type: object
      properties:
        Volumes:
          type: array
          items:
            $ref: '#/components/schemas/Volume'
          description: List of volumes
        Warnings:
          type: array
          items:
            type: string
          description: Warnings that occurred when fetching the list of volumes.
          examples:
            - []
      description: Volume list response
    Network:
      title: Network
      type: object
      properties:
        Name:
          type: string
          description: Name of the network.
          examples:
            - my_network
        Id:
          type: string
          description: ID that uniquely identifies a network on a single machine.
          examples:
            - 7d86d31b1478e7cca9ebed7e73aa0fdeec46c5ca29497431d3007d2d9e15ed99
        Created:
          type: string
          description: >-
            Date and time at which the network was created in

            [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format with
            nano-seconds.
          examples:
            - '2016-10-19T04:33:30.360Z'
        Scope:
          type: string
          description: |-
            The level at which the network exists (e.g. `swarm` for cluster-wide
            or `local` for machine level)
          examples:
            - local
        Driver:
          type: string
          description: |-
            The name of the driver used to create the network (e.g. `bridge`,
            `overlay`).
          examples:
            - overlay
        EnableIPv4:
          type: boolean
          description: Whether the network was created with IPv4 enabled.
          examples:
            - true
        EnableIPv6:
          type: boolean
          description: Whether the network was created with IPv6 enabled.
          examples:
            - false
        IPAM:
          $ref: '#/components/schemas/IPAM'
        Internal:
          type: boolean
          description: |-
            Whether the network is created to only allow internal networking
            connectivity.
          default: false
          examples:
            - false
        Attachable:
          type: boolean
          description: >-
            Whether a global / swarm scope network is manually attachable by
            regular

            containers from workers in swarm mode.
          default: false
          examples:
            - false
        Ingress:
          type: boolean
          description: >-
            Whether the network is providing the routing-mesh for the swarm
            cluster.
          default: false
          examples:
            - false
        ConfigFrom:
          allOf:
            - $ref: '#/components/schemas/ConfigReference'
            - description: |-
                The config-only network source to provide the configuration for
                this network.
        ConfigOnly:
          type: boolean
          description: >-
            Whether the network is a config-only network. Config-only networks
            are

            placeholder networks for network configurations to be used by other

            networks. Config-only networks cannot be used directly to run
            containers

            or services.
          default: false
        Options:
          type: object
          additionalProperties:
            type: string
          description: Network-specific options uses when creating the network.
          examples:
            - com.docker.network.bridge.default_bridge: 'true'
              com.docker.network.bridge.enable_icc: 'true'
              com.docker.network.bridge.enable_ip_masquerade: 'true'
              com.docker.network.bridge.host_binding_ipv4: 0.0.0.0
              com.docker.network.bridge.name: docker0
              com.docker.network.driver.mtu: '1500'
        Labels:
          type: object
          additionalProperties:
            type: string
          description: Metadata specific to the network being created.
          examples:
            - com.example.some-label: some-value
              com.example.some-other-label: some-other-value
        Peers:
          type: array
          items:
            $ref: '#/components/schemas/PeerInfo'
          description: >-
            List of peer nodes for an overlay network. This field is only
            present

            for overlay networks, and omitted for other network types.
    NetworkInspect:
      title: NetworkInspect
      allOf:
        - $ref: '#/components/schemas/Network'
        - type: object
          properties:
            Containers:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/EndpointResource'
              description: Contains endpoints attached to the network.
              examples:
                - 19a4d5d687db25203351ed79d478946f861258f018fe384f229f2efa4b23513c:
                    Name: test
                    EndpointID: >-
                      628cadb8bcb92de107b2a1e516cbffe463e321f548feb37697cce00ad694f21a
                    MacAddress: 02:42:ac:13:00:02
                    IPv4Address: 172.19.0.2/16
                    IPv6Address: ''
            Services:
              type: object
              additionalProperties: {}
              description: >-
                List of services using the network. This field is only present
                for

                swarm scope networks, and omitted for local scope networks.
            Status:
              allOf:
                - $ref: '#/components/schemas/NetworkStatus'
                - description: >-
                    provides runtime information about the network such as the
                    number of allocated IPs.
      description: The body of the "get network" http response message.
    NetworkStatus:
      title: NetworkStatus
      type: object
      properties:
        IPAM:
          $ref: '#/components/schemas/IPAMStatus'
      description: >-
        provides runtime information about the network such as the number of
        allocated IPs.
    ServiceInfo:
      title: ServiceInfo
      type: object
      properties:
        VIP:
          type: string
        Ports:
          type: array
          items:
            type: string
          description: ''
        LocalLBIndex:
          type: integer
          contentEncoding: int32
        Tasks:
          type: array
          items:
            $ref: '#/components/schemas/NetworkTaskInfo'
          description: ''
      description: represents service parameters with the list of service's tasks
    NetworkTaskInfo:
      title: NetworkTaskInfo
      type: object
      properties:
        Name:
          type: string
        EndpointID:
          type: string
        EndpointIP:
          type: string
        Info:
          type: object
          additionalProperties:
            type: string
      description: carries the information about one backend task
    ConfigReference:
      title: ConfigReference
      type: object
      properties:
        Network:
          type: string
          description: |-
            The name of the config-only network that provides the network's
            configuration. The specified network must be an existing config-only
            network. Only network names are allowed, not network IDs.
          examples:
            - config_only_network_01
      description: |-
        The config-only network source to provide the configuration for
        this network.
    IPAM:
      title: IPAM
      type: object
      properties:
        Driver:
          type: string
          description: Name of the IPAM driver to use.
          default: default
          examples:
            - default
        Config:
          type: array
          items:
            $ref: '#/components/schemas/IPAMConfig'
          description: >-
            List of IPAM configuration options, specified as a map:


            ```

            {"Subnet": <CIDR>, "IPRange": <CIDR>, "Gateway": <IP address>,
            "AuxAddress": <device_name:IP address>}

            ```
        Options:
          type: object
          additionalProperties:
            type: string
          description: Driver-specific options, specified as a map.
          examples:
            - foo: bar
    IPAMConfig:
      title: IPAMConfig
      type: object
      properties:
        Subnet:
          type: string
          examples:
            - 172.20.0.0/16
        IPRange:
          type: string
          examples:
            - 172.20.10.0/24
        Gateway:
          type: string
          examples:
            - 172.20.10.11
        AuxiliaryAddresses:
          type: object
          additionalProperties:
            type: string
    IPAMStatus:
      title: IPAMStatus
      type: object
      properties:
        Subnets:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SubnetStatus'
          examples:
            - 172.16.0.0/16:
                IPsInUse: 3
                DynamicIPsAvailable: 65533
              2001:db8:abcd:0012::0/96:
                IPsInUse: 5
                DynamicIPsAvailable: 4294967291
    SubnetStatus:
      title: SubnetStatus
      type: object
      properties:
        IPsInUse:
          type: integer
          description: >-
            Number of IP addresses in the subnet that are in use or reserved and
            are therefore unavailable for allocation, saturating at
            2<sup>64</sup> - 1.
          contentEncoding: int32
        DynamicIPsAvailable:
          type: integer
          description: >-
            Number of IP addresses within the network's IPRange for the subnet
            that are available for allocation, saturating at 2<sup>64</sup> - 1.
          contentEncoding: int32
    EndpointResource:
      title: EndpointResource
      type: object
      properties:
        Name:
          type: string
          examples:
            - container_1
        EndpointID:
          type: string
          examples:
            - 628cadb8bcb92de107b2a1e516cbffe463e321f548feb37697cce00ad694f21a
        MacAddress:
          type: string
          examples:
            - 02:42:ac:13:00:02
        IPv4Address:
          type: string
          examples:
            - 172.19.0.2/16
        IPv6Address:
          type: string
      description: >-
        contains network resources allocated and used for a container in a
        network.
    PeerInfo:
      title: PeerInfo
      type: object
      properties:
        Name:
          type: string
          description: ID of the peer-node in the Swarm cluster.
          examples:
            - 6869d7c1732b
        IP:
          type: string
          description: IP-address of the peer-node in the Swarm cluster.
          examples:
            - 10.133.77.91
      description: represents one peer of an overlay network.
    NetworkCreateResponse:
      title: NetworkCreateResponse
      required:
        - Id
        - Warning
      type: object
      properties:
        Id:
          type: string
          description: The ID of the created network.
          examples:
            - b5c4fc71e8022147cd25de22b22173de4e3b170134117172eb595cb91b4e7e5d
        Warning:
          type: string
          description: Warnings encountered when creating the container
      description: OK response to NetworkCreate operation
    BuildInfo:
      title: BuildInfo
      type: object
      properties:
        id:
          type: string
        stream:
          type: string
        errorDetail:
          $ref: '#/components/schemas/ErrorDetail'
        status:
          type: string
        progressDetail:
          $ref: '#/components/schemas/ProgressDetail'
        aux:
          allOf:
            - $ref: '#/components/schemas/ImageID'
            - description: Image ID or Digest
              examples:
                - ID: >-
                    sha256:85f05633ddc1c50679be2b16a0479ab6f7637f8884e0cfe0f4d20e1ebb3d6e7c
    BuildCache:
      title: BuildCache
      type: object
      properties:
        ID:
          type: string
          description: Unique ID of the build cache record.
          examples:
            - ndlpt0hhvkqcdfkputsk4cq9c
        Parents:
          type: array
          items:
            type: string
          description: List of parent build cache record IDs.
          examples:
            - - hw53o5aio51xtltp5xjp8v7fx
        Type:
          allOf:
            - $ref: '#/components/schemas/Type4'
            - description: Cache record type.
              examples:
                - regular
        Description:
          type: string
          description: Description of the build-step that produced the build cache.
          examples:
            - >-
              mount / from exec /bin/sh -c echo
              'Binary::apt::APT::Keep-Downloaded-Packages "true";' >
              /etc/apt/apt.conf.d/keep-cache
        InUse:
          type: boolean
          description: Indicates if the build cache is in use.
          examples:
            - false
        Shared:
          type: boolean
          description: Indicates if the build cache is shared.
          examples:
            - true
        Size:
          type: integer
          description: Amount of disk space used by the build cache (in bytes).
          contentEncoding: int32
          examples:
            - 51
        CreatedAt:
          type: string
          description: >-
            Date and time at which the build cache was created in

            [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format with
            nano-seconds.
          examples:
            - '2016-08-18T10:44:24.496Z'
        LastUsedAt:
          type: string
          description: >-
            Date and time at which the build cache was last used in

            [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format with
            nano-seconds.
          examples:
            - '2017-08-09T07:09:37.632Z'
        UsageCount:
          type: integer
          contentEncoding: int32
          examples:
            - 26
      description: BuildCache contains information about a build cache record.
    BuildCacheDiskUsage:
      title: BuildCacheDiskUsage
      type: object
      properties:
        ActiveCount:
          type: integer
          description: Count of active build cache records.
          contentEncoding: int64
          examples:
            - 1
        TotalCount:
          type: integer
          description: Count of all build cache records.
          contentEncoding: int64
          examples:
            - 4
        Reclaimable:
          type: integer
          description: >-
            Disk space that can be reclaimed by removing inactive build cache
            records.
          contentEncoding: int64
          examples:
            - 12345678
        TotalSize:
          type: integer
          description: Disk space in use by build cache records.
          contentEncoding: int64
          examples:
            - 98765432
        Items:
          type: array
          items: {}
          description: List of build cache records.
      description: represents system data usage for build cache resources.
    ImageID:
      title: ImageID
      type: object
      properties:
        ID:
          type: string
      description: Image ID or Digest
      examples:
        - ID: >-
            sha256:85f05633ddc1c50679be2b16a0479ab6f7637f8884e0cfe0f4d20e1ebb3d6e7c
    CreateImageInfo:
      title: CreateImageInfo
