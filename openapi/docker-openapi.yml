          type: string
          description: >-
            Location of the `/etc/resolv.conf` generated for the container on
            the

            host.


            This file is managed through the docker daemon, and should not be

            accessed or modified by other tools.
          examples:
            - >-
              /var/lib/docker/containers/aa86eacfb3b3ed4cd362c1e88fc89a53908ad05fb3a4103bca3f9b28292d14bf/resolv.conf
        HostnamePath:
          type: string
          description: |-
            Location of the `/etc/hostname` generated for the container on the
            host.

            This file is managed through the docker daemon, and should not be
            accessed or modified by other tools.
          examples:
            - >-
              /var/lib/docker/containers/aa86eacfb3b3ed4cd362c1e88fc89a53908ad05fb3a4103bca3f9b28292d14bf/hostname
        HostsPath:
          type: string
          description: |-
            Location of the `/etc/hosts` generated for the container on the
            host.

            This file is managed through the docker daemon, and should not be
            accessed or modified by other tools.
          examples:
            - >-
              /var/lib/docker/containers/aa86eacfb3b3ed4cd362c1e88fc89a53908ad05fb3a4103bca3f9b28292d14bf/hosts
        LogPath:
          type: string
          description: >-
            Location of the file used to buffer the container's logs. Depending
            on

            the logging-driver used for the container, this field may be
            omitted.


            This file is managed through the docker daemon, and should not be

            accessed or modified by other tools.
          examples:
            - >-
              /var/lib/docker/containers/5b7c7e2b992aa426584ce6c47452756066be0e503a08b4516a433a54d2f69e59/5b7c7e2b992aa426584ce6c47452756066be0e503a08b4516a433a54d2f69e59-json.log
        Name:
          type: string
          description: >-
            The name associated with this container.


            For historic reasons, the name may be prefixed with a forward-slash
            (`/`).
          examples:
            - /funny_chatelet
        RestartCount:
          type: integer
          description: |-
            Number of times the container was restarted since it was created,
            or since daemon was started.
          contentEncoding: int32
          examples:
            - 0
        Driver:
          type: string
          description: |-
            The storage-driver used for the container's filesystem (graph-driver
            or snapshotter).
          examples:
            - overlayfs
        Platform:
          type: string
          description: >-
            The platform (operating system) for which the container was created.


            This field was introduced for the experimental "LCOW" (Linux
            Containers

            On Windows) features, which has been removed. In most cases, this
            field

            is equal to the host's operating system (`linux` or `windows`).
          examples:
            - linux
        ImageManifestDescriptor:
          allOf:
            - $ref: '#/components/schemas/OCIDescriptor'
            - description: >-
                A descriptor struct containing digest, media type, and size, as
                defined in

                the [OCI Content Descriptors
                Specification](https://github.com/opencontainers/image-spec/blob/v1.0.1/descriptor.md).
        MountLabel:
          type: string
          description: SELinux mount label set for the container.
        ProcessLabel:
          type: string
          description: SELinux process label set for the container.
        AppArmorProfile:
          type: string
          description: The AppArmor profile set for the container.
        ExecIDs:
          type: array
          items:
            type: string
          description: IDs of exec instances that are running in the container.
          examples:
            - - b35395de42bc8abd327f9dd65d913b9ba28c74d2f0734eeeae84fa1c616a0fca
              - 3fc1232e5cd20c8de182ed81178503dc6437f4e7ef12b52cc5e8de020652f1c4
        HostConfig:
          allOf:
            - $ref: '#/components/schemas/HostConfig'
            - description: >-
                Container configuration that depends on the host we are running
                on
        GraphDriver:
          allOf:
            - $ref: '#/components/schemas/DriverData'
            - description: >-
                Information about the storage driver used to store the
                container's and

                image's filesystem.
        Storage:
          allOf:
            - $ref: '#/components/schemas/Storage'
            - description: Information about the storage used by the container.
        SizeRw:
          type: integer
          description: >-
            The size of files that have been created or changed by this
            container.


            This field is omitted by default, and only set when size is
            requested

            in the API request.
          contentEncoding: int64
          examples:
            - 122880
        SizeRootFs:
          type: integer
          description: >-
            The total size of all files in the read-only layers from the image

            that the container uses. These layers can be shared between
            containers.


            This field is omitted by default, and only set when size is
            requested

            in the API request.
          contentEncoding: int64
          examples:
            - 1653948416
        Mounts:
          type: array
          items:
            $ref: '#/components/schemas/MountPoint'
          description: List of mounts used by the container.
        Config:
          allOf:
            - $ref: '#/components/schemas/ContainerConfig'
            - description: Configuration for a container that is portable between hosts.
        NetworkSettings:
          allOf:
            - $ref: '#/components/schemas/NetworkSettings'
            - description: NetworkSettings exposes the network settings in the API
    ContainerSummary:
      title: ContainerSummary
      type: object
      properties:
        Id:
          maxLength: 64
          minLength: 64
          pattern: ^[0-9a-fA-F]{64}$
          type: string
          description: >-
            The ID of this container as a 128-bit (64-character) hexadecimal
            string (32 bytes).
          examples:
            - aa86eacfb3b3ed4cd362c1e88fc89a53908ad05fb3a4103bca3f9b28292d14bf
        Names:
          type: array
          items:
            type: string
          description: >-
            The names associated with this container. Most containers have a
            single

            name, but when using legacy "links", the container can have multiple

            names.


            For historic reasons, names are prefixed with a forward-slash (`/`).
          examples:
            - - /funny_chatelet
        Image:
          type: string
          description: >-
            The name or ID of the image used to create the container.


            This field shows the image reference as was specified when creating
            the container,

            which can be in its canonical form (e.g.,
            `docker.io/library/ubuntu:latest`

            or
            `docker.io/library/ubuntu@sha256:72297848456d5d37d1262630108ab308d3e9ec7ed1c3286a32fe09856619a782`),

            short form (e.g., `ubuntu:latest`)), or the ID(-prefix) of the image
            (e.g., `72297848456d`).


            The content of this field can be updated at runtime if the image
            used to

            create the container is untagged, in which case the field is updated
            to

            contain the the image ID (digest) it was resolved to in its
            canonical,

            non-truncated form (e.g.,
            `sha256:72297848456d5d37d1262630108ab308d3e9ec7ed1c3286a32fe09856619a782`).
          examples:
            - docker.io/library/ubuntu:latest
        ImageID:
          type: string
          description: The ID (digest) of the image that this container was created from.
          examples:
            - >-
              sha256:72297848456d5d37d1262630108ab308d3e9ec7ed1c3286a32fe09856619a782
        ImageManifestDescriptor:
          allOf:
            - $ref: '#/components/schemas/OCIDescriptor'
            - description: >-
                A descriptor struct containing digest, media type, and size, as
                defined in

                the [OCI Content Descriptors
                Specification](https://github.com/opencontainers/image-spec/blob/v1.0.1/descriptor.md).
        Command:
          type: string
          description: Command to run when starting the container
          examples:
            - /bin/bash
        Created:
          type: integer
          description: |-
            Date and time at which the container was created as a Unix timestamp
            (number of seconds since EPOCH).
          contentEncoding: int64
          examples:
            - 1739811096
        Ports:
          type: array
          items:
            $ref: '#/components/schemas/PortSummary'
          description: Port-mappings for the container.
        SizeRw:
          type: integer
          description: >-
            The size of files that have been created or changed by this
            container.


            This field is omitted by default, and only set when size is
            requested

            in the API request.
          contentEncoding: int64
          examples:
            - 122880
        SizeRootFs:
          type: integer
          description: >-
            The total size of all files in the read-only layers from the image

            that the container uses. These layers can be shared between
            containers.


            This field is omitted by default, and only set when size is
            requested

            in the API request.
          contentEncoding: int64
          examples:
            - 1653948416
        Labels:
          type: object
          additionalProperties:
            type: string
          description: User-defined key/value metadata.
          examples:
            - com.example.vendor: Acme
              com.example.license: GPL
              com.example.version: '1.0'
        State:
          allOf:
            - $ref: '#/components/schemas/State2'
            - description: The state of this container.
              examples:
                - running
        Status:
          type: string
          description: Additional human-readable status of this container (e.g. `Exit 0`)
          examples:
            - Up 4 days
        HostConfig:
          allOf:
            - $ref: '#/components/schemas/HostConfig1'
            - description: >-
                Summary of host-specific runtime information of the container.
                This

                is a reduced set of information in the container's "HostConfig"
                as

                available in the container "inspect" response.
        NetworkSettings:
          allOf:
            - $ref: '#/components/schemas/NetworkSettings1'
            - description: Summary of the container's network settings
        Mounts:
          type: array
          items:
            $ref: '#/components/schemas/MountPoint'
          description: List of mounts used by the container.
        Health:
          allOf:
            - $ref: '#/components/schemas/Health1'
            - description: >-
                Summary of health status


                Added in v1.52, before that version all container summary not
                include Health.

                After this attribute introduced, it includes containers with no
                health checks configured,

                or containers that are not running with none
    ContainersDiskUsage:
      title: ContainersDiskUsage
      type: object
      properties:
        ActiveCount:
          type: integer
          description: Count of active containers.
          contentEncoding: int64
          examples:
            - 1
        TotalCount:
          type: integer
          description: Count of all containers.
          contentEncoding: int64
          examples:
            - 4
        Reclaimable:
          type: integer
          description: Disk space that can be reclaimed by removing inactive containers.
          contentEncoding: int64
          examples:
            - 12345678
        TotalSize:
          type: integer
          description: Disk space in use by containers.
          contentEncoding: int64
          examples:
            - 98765432
        Items:
          type: array
          items: {}
          description: List of container summaries.
      description: represents system data usage information for container resources.
    Driver:
      title: Driver
      required:
        - Name
      type: object
      properties:
        Name:
          type: string
          description: Name of the driver.
          examples:
            - some-driver
        Options:
          type: object
          additionalProperties:
            type: string
          description: Key/value map of driver-specific options.
          examples:
            - OptionA: value for driver-specific option A
              OptionB: value for driver-specific option B
      description: Driver represents a driver (network, logging, secrets).
    SecretSpec:
      title: SecretSpec
      type: object
      properties:
        Name:
          type: string
          description: User-defined name of the secret.
        Labels:
          type: object
          additionalProperties:
            type: string
          description: User-defined key/value metadata.
          examples:
            - com.example.some-label: some-value
              com.example.some-other-label: some-other-value
        Data:
          type: string
          description: >-
            Data is the data to store as a secret, formatted as a
            Base64-url-safe-encoded

            ([RFC 4648](https://tools.ietf.org/html/rfc4648#section-5)) string.

            It must be empty if the Driver field is set, in which case the data
            is

            loaded from an external secret store. The maximum allowed size is
            500KB,

            as defined in
            [MaxSecretSize](https://pkg.go.dev/github.com/moby/swarmkit/v2@v2.0.0/api/validation#MaxSecretSize).


            This field is only used to _create_ a secret, and is not returned by

            other endpoints.
        Driver:
          allOf:
            - $ref: '#/components/schemas/Driver'
            - description: Driver represents a driver (network, logging, secrets).
        Templating:
          allOf:
            - $ref: '#/components/schemas/Driver'
            - description: Driver represents a driver (network, logging, secrets).
    Secret:
      title: Secret
      type: object
      properties:
        ID:
          type: string
          examples:
            - blt1owaxmitz71s9v5zh81zun
        Version:
          allOf:
            - $ref: '#/components/schemas/ObjectVersion'
            - description: >-
                The version number of the object such as node, service, etc.
                This is needed

                to avoid conflicting writes. The client must send the version
                number along

                with the modified specification when updating these objects.


                This approach ensures safe concurrency and determinism in that
                the change

                on the object may not be applied if the version number has
                changed from the

                last read. In other words, if two update requests specify the
                same base

                version, only one of the requests can succeed. As a result, two
                separate

                update requests that happen at the same time will not
                unintentionally

                overwrite each other.
        CreatedAt:
          type: string
          examples:
            - '2017-07-20T13:55:28.678Z'
        UpdatedAt:
          type: string
          examples:
            - '2017-07-20T13:55:28.678Z'
        Spec:
          $ref: '#/components/schemas/SecretSpec'
    ConfigSpec:
      title: ConfigSpec
      type: object
      properties:
        Name:
          type: string
          description: User-defined name of the config.
        Labels:
          type: object
          additionalProperties:
            type: string
          description: User-defined key/value metadata.
        Data:
          type: string
          description: >-
            Data is the data to store as a config, formatted as a
            Base64-url-safe-encoded

            ([RFC 4648](https://tools.ietf.org/html/rfc4648#section-5)) string.

            The maximum allowed size is 1000KB, as defined in
            [MaxConfigSize](https://pkg.go.dev/github.com/moby/swarmkit/v2@v2.0.0-20250103191802-8c1959736554/manager/controlapi#MaxConfigSize).
        Templating:
          allOf:
            - $ref: '#/components/schemas/Driver'
            - description: Driver represents a driver (network, logging, secrets).
    Config:
      title: Config
      type: object
      properties:
        ID:
          type: string
        Version:
          allOf:
            - $ref: '#/components/schemas/ObjectVersion'
            - description: >-
                The version number of the object such as node, service, etc.
                This is needed

                to avoid conflicting writes. The client must send the version
                number along

                with the modified specification when updating these objects.


                This approach ensures safe concurrency and determinism in that
                the change

                on the object may not be applied if the version number has
                changed from the

                last read. In other words, if two update requests specify the
                same base

                version, only one of the requests can succeed. As a result, two
                separate

                update requests that happen at the same time will not
                unintentionally

                overwrite each other.
        CreatedAt:
          type: string
        UpdatedAt:
          type: string
        Spec:
          $ref: '#/components/schemas/ConfigSpec'
    ContainerState:
      title: ContainerState
      type: object
      properties:
        Status:
          allOf:
            - $ref: '#/components/schemas/Status1'
            - description: >-
                String representation of the container state. Can be one of
                "created",

                "running", "paused", "restarting", "removing", "exited", or
                "dead".
              examples:
                - running
        Running:
          type: boolean
          description: >-
            Whether this container is running.


            Note that a running container can be _paused_. The `Running` and
            `Paused`

            booleans are not mutually exclusive:


            When pausing a container (on Linux), the freezer cgroup is used to
            suspend

            all processes in the container. Freezing the process requires the
            process to

            be running. As a result, paused containers are both `Running` _and_
            `Paused`.


            Use the `Status` field instead to determine if a container's state
            is "running".
          examples:
            - true
        Paused:
          type: boolean
          description: Whether this container is paused.
          examples:
            - false
        Restarting:
          type: boolean
          description: Whether this container is restarting.
          examples:
            - false
        OOMKilled:
          type: boolean
          description: >-
            Whether a process within this container has been killed because it
            ran

            out of memory since the container was last started.
          examples:
            - false
        Dead:
          type: boolean
          examples:
            - false
        Pid:
          type: integer
          description: The process ID of this container
          contentEncoding: int32
          examples:
            - 1234
        ExitCode:
          type: integer
          description: The last exit code of this container
          contentEncoding: int32
          examples:
            - 0
        Error:
          type: string
        StartedAt:
          type: string
          description: The time when this container was last started.
          examples:
            - '2020-01-06T09:06:59.461Z'
        FinishedAt:
          type: string
          description: The time when this container last exited.
          examples:
            - '2020-01-06T09:07:59.461Z'
        Health:
          allOf:
            - $ref: '#/components/schemas/Health'
            - description: >-
                Health stores information about the container's healthcheck
                results.
      description: >-
        ContainerState stores container's running state. It's part of
        ContainerJSONBase

        and will be returned by the "inspect" command.
    ContainerCreateResponse:
      title: ContainerCreateResponse
      required:
        - Id
        - Warnings
      type: object
      properties:
        Id:
          type: string
          description: The ID of the created container
          examples:
            - ede54ee1afda366ab42f824e8a5ffd195155d853ceaec74a927f249ea270c743
        Warnings:
          type: array
          items:
            type: string
          description: Warnings encountered when creating the container
          examples:
            - []
      description: OK response to ContainerCreate operation
    ContainerUpdateResponse:
      title: ContainerUpdateResponse
      type: object
      properties:
        Warnings:
          type: array
          items:
            type: string
          description: Warnings encountered when updating the container.
          examples:
            - - Published ports are discarded when using host network mode
      description: Response for a successful container-update.
    ContainerStatsResponse:
      title: ContainerStatsResponse
      type: object
      properties:
        id:
          type: string
          description: ID of the container for which the stats were collected.
          examples:
            - ede54ee1afda366ab42f824e8a5ffd195155d853ceaec74a927f249ea270c743
        name:
          type: string
          description: Name of the container for which the stats were collected.
          examples:
            - boring_wozniak
        os_type:
          type: string
          description: |-
            OSType is the OS of the container ("linux" or "windows") to allow
            platform-specific handling of stats.
          examples:
            - linux
        read:
          type: string
          description: >-
            Date and time at which this sample was collected.

            The value is formatted as [RFC
            3339](https://www.ietf.org/rfc/rfc3339.txt)

            with nano-seconds.
          contentEncoding: date-time
          examples:
            - '2025-01-16T13:55:22.165Z'
        cpu_stats:
          allOf:
            - $ref: '#/components/schemas/ContainerCPUStats'
            - description: CPU related info of the container
        memory_stats:
          allOf:
            - $ref: '#/components/schemas/ContainerMemoryStats'
            - description: |-
                Aggregates all memory stats since container inception on Linux.
                Windows returns stats for commit and private working set only.
        networks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ContainerNetworkStats'
          description: |-
            Network statistics for the container per interface.

            This field is omitted if the container has no networking enabled.
          examples:
            - eth0:
                rx_bytes: 5338
                rx_dropped: 0
                rx_errors: 0
                rx_packets: 36
                tx_bytes: 648
                tx_dropped: 0
                tx_errors: 0
                tx_packets: 8
              eth5:
                rx_bytes: 4641
                rx_dropped: 0
                rx_errors: 0
                rx_packets: 26
                tx_bytes: 690
                tx_dropped: 0
                tx_errors: 0
                tx_packets: 9
        pids_stats:
          allOf:
            - $ref: '#/components/schemas/ContainerPidsStats'
            - description: >-
                PidsStats contains Linux-specific stats of a container's
                process-IDs (PIDs).


                This type is Linux-specific and omitted for Windows containers.
        blkio_stats:
          allOf:
            - $ref: '#/components/schemas/ContainerBlkioStats'
            - description: >-
                BlkioStats stores all IO service stats for data read and write.


                This type is Linux-specific and holds many fields that are
                specific to cgroups v1.

                On a cgroup v2 host, all fields other than
                `io_service_bytes_recursive`

                are omitted or `null`.


                This type is only populated on Linux and omitted for Windows
                containers.
        num_procs:
          type: integer
          description: |-
            The number of processors on the system.

            This field is Windows-specific and always zero for Linux containers.
          contentEncoding: int32
          examples:
            - 16
        storage_stats:
          allOf:
            - $ref: '#/components/schemas/ContainerStorageStats'
            - description: |-
                StorageStats is the disk I/O stats for read/write on Windows.

                This type is Windows-specific and omitted for Linux containers.
        preread:
          type: string
          description: >-
            Date and time at which this first sample was collected. This field

            is not propagated if the "one-shot" option is set. If the "one-shot"

            option is set, this field may be omitted, empty, or set to a default

            date (`0001-01-01T00:00:00Z`).


            The value is formatted as [RFC
            3339](https://www.ietf.org/rfc/rfc3339.txt)

            with nano-seconds.
          contentEncoding: date-time
          examples:
            - '2025-01-16T13:55:21.160Z'
        precpu_stats:
          allOf:
            - $ref: '#/components/schemas/ContainerCPUStats'
            - description: CPU related info of the container
      description: Statistics sample for a container.
    ContainerBlkioStats:
      title: ContainerBlkioStats
      type: object
      properties:
        io_service_bytes_recursive:
          type: array
          items:
            $ref: '#/components/schemas/ContainerBlkioStatEntry'
          description: ''
        io_serviced_recursive:
          type: array
          items:
            $ref: '#/components/schemas/ContainerBlkioStatEntry'
          description: |-
            This field is only available when using Linux containers with
            cgroups v1. It is omitted or `null` when using cgroups v2.
        io_queue_recursive:
          type: array
          items:
            $ref: '#/components/schemas/ContainerBlkioStatEntry'
          description: |-
            This field is only available when using Linux containers with
            cgroups v1. It is omitted or `null` when using cgroups v2.
        io_service_time_recursive:
          type: array
          items:
            $ref: '#/components/schemas/ContainerBlkioStatEntry'
          description: |-
            This field is only available when using Linux containers with
            cgroups v1. It is omitted or `null` when using cgroups v2.
        io_wait_time_recursive:
          type: array
          items:
            $ref: '#/components/schemas/ContainerBlkioStatEntry'
          description: |-
            This field is only available when using Linux containers with
            cgroups v1. It is omitted or `null` when using cgroups v2.
        io_merged_recursive:
          type: array
          items:
            $ref: '#/components/schemas/ContainerBlkioStatEntry'
          description: |-
            This field is only available when using Linux containers with
            cgroups v1. It is omitted or `null` when using cgroups v2.
        io_time_recursive:
          type: array
          items:
            $ref: '#/components/schemas/ContainerBlkioStatEntry'
          description: |-
            This field is only available when using Linux containers with
            cgroups v1. It is omitted or `null` when using cgroups v2.
        sectors_recursive:
          type: array
          items:
            $ref: '#/components/schemas/ContainerBlkioStatEntry'
          description: |-
            This field is only available when using Linux containers with
            cgroups v1. It is omitted or `null` when using cgroups v2.
      description: >-
        BlkioStats stores all IO service stats for data read and write.


        This type is Linux-specific and holds many fields that are specific to
        cgroups v1.

        On a cgroup v2 host, all fields other than `io_service_bytes_recursive`

        are omitted or `null`.


        This type is only populated on Linux and omitted for Windows containers.
    ContainerBlkioStatEntry:
      title: ContainerBlkioStatEntry
      type: object
      properties:
        major:
          type: integer
          contentEncoding: int32
          examples:
            - 254
        minor:
          type: integer
          contentEncoding: int32
          examples:
            - 0
        op:
          type: string
          examples:
            - read
        value:
          type: integer
          contentEncoding: int32
          examples:
            - 7593984
      description: |-
        Blkio stats entry.

        This type is Linux-specific and omitted for Windows containers.
    ContainerCPUStats:
      title: ContainerCPUStats
      type: object
      properties:
        cpu_usage:
          allOf:
            - $ref: '#/components/schemas/ContainerCPUUsage'
            - description: All CPU stats aggregated since container inception.
        system_cpu_usage:
          type: integer
          description: |-
            System Usage.

            This field is Linux-specific and omitted for Windows containers.
          contentEncoding: int32
          examples:
            - 5
        online_cpus:
          type: integer
          description: |-
            Number of online CPUs.

            This field is Linux-specific and omitted for Windows containers.
          contentEncoding: int32
          examples:
            - 5
        throttling_data:
          allOf:
            - $ref: '#/components/schemas/ContainerThrottlingData'
            - description: |-
                CPU throttling stats of the container.

                This type is Linux-specific and omitted for Windows containers.
      description: CPU related info of the container
    ContainerCPUUsage:
      title: ContainerCPUUsage
      type: object
      properties:
        total_usage:
          type: integer
          description: >-
            Total CPU time consumed in nanoseconds (Linux) or 100's of
            nanoseconds (Windows).
          contentEncoding: int32
          examples:
            - 29912000
        percpu_usage:
          type: array
          items:
            type: integer
            contentEncoding: int32
          description: |-
            Total CPU time (in nanoseconds) consumed per core (Linux).

            This field is Linux-specific when using cgroups v1. It is omitted
            when using cgroups v2 and Windows containers.
        usage_in_kernelmode:
          type: integer
          description: >-
            Time (in nanoseconds) spent by tasks of the cgroup in kernel mode
            (Linux),

            or time spent (in 100's of nanoseconds) by all container processes
            in

            kernel mode (Windows).


            Not populated for Windows containers using Hyper-V isolation.
          contentEncoding: int32
          examples:
            - 21994000
        usage_in_usermode:
          type: integer
          description: >-
            Time (in nanoseconds) spent by tasks of the cgroup in user mode
            (Linux),

            or time spent (in 100's of nanoseconds) by all container processes
            in

            kernel mode (Windows).


            Not populated for Windows containers using Hyper-V isolation.
          contentEncoding: int32
          examples:
            - 7918000
      description: All CPU stats aggregated since container inception.
    ContainerPidsStats:
      title: ContainerPidsStats
      type: object
      properties:
        current:
          type: integer
          description: Current is the number of PIDs in the cgroup.
          contentEncoding: int32
          examples:
            - 5
        limit:
          type: integer
          description: |-
            Limit is the hard limit on the number of pids in the cgroup.
            A "Limit" of 0 means that there is no limit.
          contentEncoding: int32
      description: >-
        PidsStats contains Linux-specific stats of a container's process-IDs
        (PIDs).


        This type is Linux-specific and omitted for Windows containers.
    ContainerThrottlingData:
      title: ContainerThrottlingData
      type: object
      properties:
        periods:
          type: integer
          description: Number of periods with throttling active.
          contentEncoding: int32
          examples:
            - 0
        throttled_periods:
          type: integer
          description: Number of periods when the container hit its throttling limit.
          contentEncoding: int32
          examples:
            - 0
        throttled_time:
          type: integer
          description: Aggregated time (in nanoseconds) the container was throttled for.
          contentEncoding: int32
          examples:
            - 0
      description: |-
        CPU throttling stats of the container.

        This type is Linux-specific and omitted for Windows containers.
    ContainerMemoryStats:
      title: ContainerMemoryStats
      type: object
      properties:
        usage:
          type: integer
          description: |-
            Current `res_counter` usage for memory.

            This field is Linux-specific and omitted for Windows containers.
          contentEncoding: int32
          examples:
            - 0
        max_usage:
          type: integer
          description: |-
            Maximum usage ever recorded.

            This field is Linux-specific and only supported on cgroups v1.
            It is omitted when using cgroups v2 and for Windows containers.
          contentEncoding: int32
          examples:
            - 0
        stats:
          type: object
          additionalProperties:
            type: integer
            format: int32
          description: |-
            All the stats exported via memory.stat. when using cgroups v2.

            This field is Linux-specific and omitted for Windows containers.
          examples:
            - active_anon: 1572864
              active_file: 5115904
              anon: 1572864
              anon_thp: 0
              file: 7626752
              file_dirty: 0
              file_mapped: 2723840
              file_writeback: 0
              inactive_anon: 0
              inactive_file: 2510848
              kernel_stack: 16384
              pgactivate: 0
              pgdeactivate: 0
              pgfault: 2042
              pglazyfree: 0
              pglazyfreed: 0
              pgmajfault: 45
              pgrefill: 0
              pgscan: 0
              pgsteal: 0
              shmem: 0
              slab: 1180928
              slab_reclaimable: 725576
              slab_unreclaimable: 455352
              sock: 0
              thp_collapse_alloc: 0
              thp_fault_alloc: 1
              unevictable: 0
              workingset_activate: 0
              workingset_nodereclaim: 0
              workingset_refault: 0
        failcnt:
          type: integer
          description: |-
            Number of times memory usage hits limits.

            This field is Linux-specific and only supported on cgroups v1.
            It is omitted when using cgroups v2 and for Windows containers.
          contentEncoding: int32
          examples:
            - 0
        limit:
          type: integer
          description: This field is Linux-specific and omitted for Windows containers.
          contentEncoding: int32
        commitbytes:
          type: integer
          description: |-
            Committed bytes.

            This field is Windows-specific and omitted for Linux containers.
          contentEncoding: int32
          examples:
            - 0
        commitpeakbytes:
          type: integer
          description: |-
            Peak committed bytes.

            This field is Windows-specific and omitted for Linux containers.
          contentEncoding: int32
          examples:
            - 0
        privateworkingset:
          type: integer
          description: |-
            Private working set.

            This field is Windows-specific and omitted for Linux containers.
          contentEncoding: int32
          examples:
            - 0
      description: |-
        Aggregates all memory stats since container inception on Linux.
        Windows returns stats for commit and private working set only.
    ContainerNetworkStats:
      title: ContainerNetworkStats
      type: object
      properties:
        rx_bytes:
          type: integer
          description: Bytes received. Windows and Linux.
          contentEncoding: int32
          examples:
            - 5338
        rx_packets:
          type: integer
          description: Packets received. Windows and Linux.
          contentEncoding: int32
          examples:
            - 36
        rx_errors:
          type: integer
          description: |-
            Received errors. Not used on Windows.

            This field is Linux-specific and always zero for Windows containers.
          contentEncoding: int32
          examples:
            - 0
        rx_dropped:
          type: integer
          description: Incoming packets dropped. Windows and Linux.
          contentEncoding: int32
          examples:
            - 0
        tx_bytes:
          type: integer
          description: Bytes sent. Windows and Linux.
          contentEncoding: int32
          examples:
            - 1200
        tx_packets:
          type: integer
          description: Packets sent. Windows and Linux.
          contentEncoding: int32
          examples:
            - 12
        tx_errors:
          type: integer
          description: |-
            Sent errors. Not used on Windows.

            This field is Linux-specific and always zero for Windows containers.
          contentEncoding: int32
          examples:
            - 0
        tx_dropped:
          type: integer
          description: Outgoing packets dropped. Windows and Linux.
          contentEncoding: int32
          examples:
            - 0
        endpoint_id:
          type: string
          description: |-
            Endpoint ID. Not used on Linux.

            This field is Windows-specific and omitted for Linux containers.
        instance_id:
          type: string
          description: |-
            Instance ID. Not used on Linux.

            This field is Windows-specific and omitted for Linux containers.
      description: Aggregates the network stats of one container
    ContainerStorageStats:
      title: ContainerStorageStats
      type: object
      properties:
        read_count_normalized:
          type: integer
          contentEncoding: int32
          examples:
            - 7593984
        read_size_bytes:
          type: integer
          contentEncoding: int32
          examples:
            - 7593984
        write_count_normalized:
          type: integer
          contentEncoding: int32
          examples:
            - 7593984
        write_size_bytes:
          type: integer
          contentEncoding: int32
          examples:
            - 7593984
      description: |-
        StorageStats is the disk I/O stats for read/write on Windows.

        This type is Windows-specific and omitted for Linux containers.
    ContainerTopResponse:
      title: ContainerTopResponse
      type: object
      properties:
        Titles:
          type: array
          items:
            type: string
          description: The ps column titles
        Processes:
          type: array
          items:
            type: array
            items:
              type: string
          description: |-
            Each process running in the container, where each process
            is an array of values corresponding to the titles.
      description: Container "top" response.
    ContainerWaitResponse:
      title: ContainerWaitResponse
      required:
        - StatusCode
      type: object
      properties:
        StatusCode:
          type: integer
          description: Exit code of the container
          contentEncoding: int64
        Error:
          allOf:
            - $ref: '#/components/schemas/ContainerWaitExitError'
            - description: container waiting error, if any
      description: OK response to ContainerWait operation
    ContainerWaitExitError:
      title: ContainerWaitExitError
      type: object
      properties:
        Message:
          type: string
          description: Details of an error
      description: container waiting error, if any
    SystemVersion:
      title: SystemVersion
      type: object
      properties:
        Platform:
          $ref: '#/components/schemas/Platform1'
        Components:
          type: array
          items:
            $ref: '#/components/schemas/Component'
          description: Information about system components
        Version:
          type: string
          description: The version of the daemon
          examples:
            - 27.0.1
        ApiVersion:
          type: string
          description: >-
            The default (and highest) API version that is supported by the
            daemon
          examples:
            - '1.47'
        MinAPIVersion:
          type: string
          description: The minimum API version that is supported by the daemon
          examples:
            - '1.24'
        GitCommit:
          type: string
          description: The Git commit of the source code that was used to build the daemon
          examples:
            - 48a66213fe
        GoVersion:
          type: string
          description: |-
            The version Go used to compile the daemon, and the version of the Go
            runtime in use.
          examples:
            - go1.22.7
        Os:
          type: string
          description: >-
            The operating system that the daemon is running on ("linux" or
            "windows")
          examples:
            - linux
        Arch:
          type: string
          description: The architecture that the daemon is running on
          examples:
            - amd64
        KernelVersion:
          type: string
          description: |-
            The kernel version (`uname -r`) that the daemon is running on.

            This field is omitted when empty.
          examples:
            - 6.8.0-31-generic
        Experimental:
          type: boolean
          description: >-
            Indicates if the daemon is started with experimental features
            enabled.


            This field is omitted when empty / false.
          examples:
            - true
        BuildTime:
          type: string
          description: The date and time that the daemon was compiled.
          examples:
            - '2020-06-22T15:49:27.000Z'
      description: 'Response of Engine API: GET "/version"'
    SystemInfo:
      title: SystemInfo
      type: object
      properties:
        ID:
          type: string
          description: |-
            Unique identifier of the daemon.

            <p><br /></p>

            > **Note**: The format of the ID itself is not part of the API, and
            > should not be considered stable.
          examples:
            - 7TRN:IPZB:QYBB:VPBQ:UMPP:KARE:6ZNR:XE6T:7EWV:PKF4:ZOJD:TPYS
        Containers:
          type: integer
          description: Total number of containers on the host.
          contentEncoding: int32
          examples:
            - 14
        ContainersRunning:
          type: integer
          description: Number of containers with status `"running"`.
          contentEncoding: int32
          examples:
            - 3
        ContainersPaused:
          type: integer
          description: Number of containers with status `"paused"`.
          contentEncoding: int32
          examples:
            - 1
        ContainersStopped:
          type: integer
          description: Number of containers with status `"stopped"`.
          contentEncoding: int32
          examples:
            - 10
        Images:
          type: integer
          description: |-
            Total number of images on the host.

            Both _tagged_ and _untagged_ (dangling) images are counted.
          contentEncoding: int32
          examples:
            - 508
        Driver:
          type: string
          description: Name of the storage driver in use.
          examples:
            - overlay2
        DriverStatus:
          type: array
          items:
            type: array
            items:
              type: string
          description: |-
            Information specific to the storage driver, provided as
            "label" / "value" pairs.

            This information is provided by the storage driver, and formatted
            in a way consistent with the output of `docker info` on the command
            line.

            <p><br /></p>

            > **Note**: The information returned in this field, including the
            > formatting of values and labels, should not be considered stable,
            > and may change without notice.
          examples:
            - - - Backing Filesystem
                - extfs
              - - Supports d_type
                - 'true'
              - - Native Overlay Diff
                - 'true'
        DockerRootDir:
          type: string
          description: |-
            Root directory of persistent Docker state.

            Defaults to `/var/lib/docker` on Linux, and `C:\ProgramData\docker`
            on Windows.
          examples:
            - /var/lib/docker
        Plugins:
          allOf:
            - $ref: '#/components/schemas/PluginsInfo'
            - description: >-
                Available plugins per type.


                <p><br /></p>


                > **Note**: Only unmanaged (V1) plugins are included in this
                list.

                > V1 plugins are "lazily" loaded, and are not returned in this
                list

                > if there is no resource using the plugin.
        MemoryLimit:
          type: boolean
          description: Indicates if the host has memory limit support enabled.
          examples:
            - true
        SwapLimit:
          type: boolean
          description: Indicates if the host has memory swap limit support enabled.
          examples:
            - true
        CpuCfsPeriod:
          type: boolean
          description: >-
            Indicates if CPU CFS(Completely Fair Scheduler) period is supported
            by

            the host.
          examples:
            - true
        CpuCfsQuota:
          type: boolean
          description: >-
            Indicates if CPU CFS(Completely Fair Scheduler) quota is supported
            by

            the host.
          examples:
            - true
        CPUShares:
          type: boolean
          description: Indicates if CPU Shares limiting is supported by the host.
          examples:
            - true
        CPUSet:
          type: boolean
          description: >-
            Indicates if CPUsets (cpuset.cpus, cpuset.mems) are supported by the
            host.


            See
            [cpuset(7)](https://www.kernel.org/doc/Documentation/cgroup-v1/cpusets.txt)
          examples:
            - true
        PidsLimit:
          type: boolean
          description: Indicates if the host kernel has PID limit support enabled.
          examples:
            - true
        OomKillDisable:
          type: boolean
          description: Indicates if OOM killer disable is supported on the host.
        IPv4Forwarding:
          type: boolean
          description: Indicates IPv4 forwarding is enabled.
          examples:
            - true
        Debug:
          type: boolean
          description: |-
            Indicates if the daemon is running in debug-mode / with debug-level
            logging enabled.
          examples:
            - true
        NFd:
          type: integer
          description: |-
            The total number of file Descriptors in use by the daemon process.

            This information is only returned if debug-mode is enabled.
          contentEncoding: int32
          examples:
            - 64
        NGoroutines:
          type: integer
          description: |-
            The  number of goroutines that currently exist.

            This information is only returned if debug-mode is enabled.
          contentEncoding: int32
          examples:
            - 174
        SystemTime:
          type: string
          description: >-
            Current system-time in [RFC
            3339](https://www.ietf.org/rfc/rfc3339.txt)

            format with nano-seconds.
          examples:
            - '2017-08-08T20:28:29.062Z'
        LoggingDriver:
          type: string
          description: The logging driver to use as a default for new containers.
        CgroupDriver:
          allOf:
            - $ref: '#/components/schemas/CgroupDriver'
            - description: The driver to use for managing cgroups.
              examples:
                - cgroupfs
        CgroupVersion:
          allOf:
            - $ref: '#/components/schemas/CgroupVersion'
            - description: The version of the cgroup.
              examples:
                - '1'
        NEventsListener:
          type: integer
          description: Number of event listeners subscribed.
          contentEncoding: int32
          examples:
            - 30
        KernelVersion:
          type: string
          description: >-
            Kernel version of the host.


            On Linux, this information obtained from `uname`. On Windows this

            information is queried from the
            <kbd>HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows
            NT\\CurrentVersion\\</kbd>

            registry value, for example _"10.0 14393
            (14393.1198.amd64fre.rs1_release_sec.170427-1353)"_.
          examples:
            - 6.8.0-31-generic
        OperatingSystem:
          type: string
          description: |-
            Name of the host's operating system, for example: "Ubuntu 24.04 LTS"
            or "Windows Server 2016 Datacenter"
          examples:
            - Ubuntu 24.04 LTS
        OSVersion:
          type: string
          description: >-
            Version of the host's operating system


            <p><br /></p>


            > **Note**: The information returned in this field, including its

            > very existence, and the formatting of values, should not be
            considered

            > stable, and may change without notice.
          examples:
            - '24.04'
        OSType:
          type: string
          description: >-
            Generic type of the operating system of the host, as returned by the

            Go runtime (`GOOS`).


            Currently returned values are "linux" and "windows". A full list of

            possible values can be found in the [Go
            documentation](https://go.dev/doc/install/source#environment).
          examples:
            - linux
        Architecture:
          type: string
          description: >-
            Hardware architecture of the host, as returned by the Go runtime

            (`GOARCH`).


            A full list of possible values can be found in the [Go
            documentation](https://go.dev/doc/install/source#environment).
          examples:
            - x86_64
        NCPU:
          type: integer
          description: |-
            The number of logical CPUs usable by the daemon.

            The number of available CPUs is checked by querying the operating
            system when the daemon starts. Changes to operating system CPU
            allocation after the daemon is started are not reflected.
          contentEncoding: int32
          examples:
            - 4
        MemTotal:
          type: integer
          description: Total amount of physical memory available on the host, in bytes.
          contentEncoding: int64
          examples:
            - 2095882240
        IndexServerAddress:
          type: string
          description: >-
            Address / URL of the index server that is used for image search,

            and as a default for user authentication for Docker Hub and Docker
            Cloud.
          default: https://index.docker.io/v1/
          examples:
            - https://index.docker.io/v1/
        RegistryConfig:
          allOf:
            - $ref: '#/components/schemas/RegistryServiceConfig'
            - description: >-
                RegistryServiceConfig stores daemon registry services
                configuration.
        GenericResources:
          type: array
          items:
            $ref: '#/components/schemas/GenericResource'
          description: >-
            User-defined resources can be either Integer resources (e.g,
            `SSD=3`) or

            String resources (e.g, `GPU=UUID1`).
          examples:
            - - DiscreteResourceSpec:
                  Kind: SSD
                  Value: 3
              - NamedResourceSpec:
                  Kind: GPU
                  Value: UUID1
              - NamedResourceSpec:
                  Kind: GPU
                  Value: UUID2
        HttpProxy:
          type: string
          description: >-
            HTTP-proxy configured for the daemon. This value is obtained from
            the

            [`HTTP_PROXY`](https://www.gnu.org/software/wget/manual/html_node/Proxies.html)
            environment variable.

            Credentials ([user info
            component](https://tools.ietf.org/html/rfc3986#section-3.2.1)) in
            the proxy URL

            are masked in the API response.


            Containers do not automatically inherit this configuration.
          examples:
            - http://xxxxx:xxxxx@proxy.corp.example.com:8080
        HttpsProxy:
          type: string
          description: >-
            HTTPS-proxy configured for the daemon. This value is obtained from
            the

            [`HTTPS_PROXY`](https://www.gnu.org/software/wget/manual/html_node/Proxies.html)
            environment variable.

            Credentials ([user info
            component](https://tools.ietf.org/html/rfc3986#section-3.2.1)) in
            the proxy URL

            are masked in the API response.


            Containers do not automatically inherit this configuration.
          examples:
            - https://xxxxx:xxxxx@proxy.corp.example.com:4443
        NoProxy:
          type: string
          description: >-
            Comma-separated list of domain extensions for which no proxy should
            be

            used. This value is obtained from the
            [`NO_PROXY`](https://www.gnu.org/software/wget/manual/html_node/Proxies.html)

            environment variable.


            Containers do not automatically inherit this configuration.
          examples:
            - '*.local, 169.254/16'
        Name:
          type: string
          description: Hostname of the host.
          examples:
            - node5.corp.example.com
        Labels:
          type: array
          items:
            type: string
          description: >-
            User-defined labels (key/value metadata) as set on the daemon.


            <p><br /></p>


            > **Note**: When part of a Swarm, nodes can both have _daemon_
            labels,

            > set through the daemon configuration, and _node_ labels, set from
            a

            > manager node in the Swarm. Node labels are not included in this

            > field. Node labels can be retrieved using the `/nodes/(id)`
            endpoint

            > on a manager node in the Swarm.
          examples:
            - - storage=ssd
              - production
        ExperimentalBuild:
          type: boolean
          description: Indicates if experimental features are enabled on the daemon.
          examples:
            - true
        ServerVersion:
          type: string
          description: Version string of the daemon.
          examples:
            - 27.0.1
        Runtimes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Runtime'
          description: >-
            List of [OCI
            compliant](https://github.com/opencontainers/runtime-spec)

            runtimes configured on the daemon. Keys hold the "name" used to

            reference the runtime.


            The Docker daemon relies on an OCI compliant runtime (invoked via
            the

            `containerd` daemon) as its interface to the Linux kernel
            namespaces,

            cgroups, and SELinux.


            The default runtime is `runc`, and automatically configured.
            Additional

            runtimes can be configured by the user and will be listed here.
          examples:
            - runc:
                path: runc
              runc-master:
                path: /go/bin/runc
              custom:
                path: /usr/local/bin/my-oci-runtime
                runtimeArgs:
                  - '--debug'
                  - '--systemd-cgroup=false'
        DefaultRuntime:
          type: string
          description: >-
            Name of the default OCI runtime that is used when starting
            containers.


            The default can be overridden per-container at create time.
          default: runc
          examples:
            - runc
        Swarm:
          allOf:
            - $ref: '#/components/schemas/SwarmInfo'
            - description: Represents generic information about swarm.
        LiveRestoreEnabled:
          type: boolean
          description: |-
            Indicates if live restore is enabled.

            If enabled, containers are kept running when the daemon is shutdown
            or upon daemon start if running containers are detected.
          default: false
          examples:
            - false
        Isolation:
          allOf:
            - $ref: '#/components/schemas/Isolation2'
            - description: >-
                Represents the isolation technology to use as a default for
                containers.

                The supported values are platform-specific.


                If no isolation value is specified on daemon start, on Windows
                client,

                the default is `hyperv`, and on Windows server, the default is
                `process`.


                This option is currently not used on other platforms.
        InitBinary:
          type: string
          description: >-
            Name and, optional, path of the `docker-init` binary.


            If the path is omitted, the daemon searches the host's `$PATH` for
            the

            binary and uses the first result.
          examples:
            - docker-init
        ContainerdCommit:
          allOf:
            - $ref: '#/components/schemas/Commit'
            - description: >-
                Commit holds the Git-commit (SHA1) that a binary was built from,
                as

                reported in the version-string of external tools, such as
                `containerd`,

                or `runC`.
        RuncCommit:
          allOf:
            - $ref: '#/components/schemas/Commit'
            - description: >-
                Commit holds the Git-commit (SHA1) that a binary was built from,
                as

                reported in the version-string of external tools, such as
                `containerd`,

                or `runC`.
        InitCommit:
          allOf:
            - $ref: '#/components/schemas/Commit'
            - description: >-
                Commit holds the Git-commit (SHA1) that a binary was built from,
                as

                reported in the version-string of external tools, such as
                `containerd`,

                or `runC`.
        SecurityOptions:
          type: array
          items:
            type: string
          description: |-
            List of security features that are enabled on the daemon, such as
            apparmor, seccomp, SELinux, user-namespaces (userns), rootless and
            no-new-privileges.

            Additional configuration options for each security feature may
            be present, and are included as a comma-separated list of key/value
            pairs.
          examples:
            - - name=apparmor
              - name=seccomp,profile=default
              - name=selinux
              - name=userns
              - name=rootless
        ProductLicense:
          type: string
          description: |-
            Reports a summary of the product license on the daemon.

            If a commercial license has been applied to the daemon, information
            such as number of nodes, and expiration are included.
          examples:
            - Community Engine
        DefaultAddressPools:
          type: array
          items:
            $ref: '#/components/schemas/DefaultAddressPool'
          description: >-
            List of custom default address pools for local networks, which can
            be

            specified in the daemon.json file or dockerd option.


            Example: a Base "10.10.0.0/16" with Size 24 will define the set of
            256

            10.10.[0-255].0/24 address pools.
        FirewallBackend:
          allOf:
            - $ref: '#/components/schemas/FirewallInfo'
            - description: >-
                Information about the daemon's firewalling configuration.


                This field is currently only used on Linux, and omitted on other
                platforms.
        DiscoveredDevices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceInfo'
          description: >-
            List of devices discovered by device drivers.


            Each device includes information about its source driver, kind,
            name,

            and additional driver-specific attributes.
        Warnings:
          type: array
          items:
            type: string
          description: >-
            List of warnings / informational messages about missing features, or

            issues related to the daemon configuration.


            These messages can be printed by the client as information to the
            user.
          examples:
            - - 'WARNING: No memory limit support'
        CDISpecDirs:
          type: array
          items:
            type: string
          description: >-
            List of directories where (Container Device Interface) CDI

            specifications are located.


            These specifications define vendor-specific modifications to an OCI

            runtime specification for a container being created.


            An empty list indicates that CDI device injection is disabled.


            Note that since using CDI device injection requires the daemon to
            have

            experimental enabled. For non-experimental daemons an empty list
            will

            always be returned.
          examples:
            - - /etc/cdi
              - /var/run/cdi
        Containerd:
          allOf:
            - $ref: '#/components/schemas/ContainerdInfo'
            - description: >-
                Information for connecting to the containerd instance that is
                used by the daemon.

                This is included for debugging purposes only.
    ContainerdInfo:
      title: ContainerdInfo
      type: object
      properties:
        Address:
          type: string
          description: The address of the containerd socket.
          examples:
            - /run/containerd/containerd.sock
        Namespaces:
          allOf:
            - $ref: '#/components/schemas/Namespaces'
            - description: |-
                The namespaces that the daemon uses for running containers and
                plugins in containerd. These namespaces can be configured in the
                daemon configuration, and are considered to be used exclusively
                by the daemon, Tampering with the containerd instance may cause
                unexpected behavior.

                As these namespaces are considered to be exclusively accessed
                by the daemon, it is not recommended to change these values,
                or to change them to a value that is used by other systems,
                such as cri-containerd.
      description: >-
        Information for connecting to the containerd instance that is used by
        the daemon.

        This is included for debugging purposes only.
    FirewallInfo:
      title: FirewallInfo
      type: object
      properties:
        Driver:
          type: string
          description: The name of the firewall backend driver.
          examples:
            - nftables
        Info:
          type: array
          items:
            type: array
            items:
              type: string
          description: |-
            Information about the firewall backend, provided as
            "label" / "value" pairs.

            <p><br /></p>

            > **Note**: The information returned in this field, including the
            > formatting of values and labels, should not be considered stable,
            > and may change without notice.
          examples:
            - - - ReloadedAt
                - '2025-01-01T00:00:00.000Z'
      description: >-
        Information about the daemon's firewalling configuration.


        This field is currently only used on Linux, and omitted on other
        platforms.
    PluginsInfo:
      title: PluginsInfo
      type: object
      properties:
        Volume:
          type: array
          items:
            type: string
          description: Names of available volume-drivers, and network-driver plugins.
          examples:
            - - local
        Network:
          type: array
          items:
            type: string
          description: Names of available network-drivers, and network-driver plugins.
          examples:
            - - bridge
              - host
              - ipvlan
              - macvlan
              - 'null'
              - overlay
        Authorization:
          type: array
          items:
            type: string
          description: Names of available authorization plugins.
          examples:
            - - img-authz-plugin
              - hbm
        Log:
          type: array
          items:
            type: string
          description: Names of available logging-drivers, and logging-driver plugins.
          examples:
            - - awslogs
              - fluentd
              - gcplogs
              - gelf
              - journald
              - json-file
              - splunk
              - syslog
      description: |-
        Available plugins per type.

        <p><br /></p>

        > **Note**: Only unmanaged (V1) plugins are included in this list.
        > V1 plugins are "lazily" loaded, and are not returned in this list
        > if there is no resource using the plugin.
    RegistryServiceConfig:
      title: RegistryServiceConfig
      type: object
      properties:
        InsecureRegistryCIDRs:
          type: array
          items:
            type: string
          description: >-
            List of IP ranges of insecure registries, using the CIDR syntax

            ([RFC 4632](https://tools.ietf.org/html/4632)). Insecure registries

            accept un-encrypted (HTTP) and/or untrusted (HTTPS with certificates

            from unknown CAs) communication.


            By default, local registries (`::1/128` and `127.0.0.0/8`) are
            configured as

            insecure. All other registries are secure. Communicating with an

            insecure registry is not possible if the daemon assumes that
            registry

            is secure.


            This configuration override this behavior, insecure communication
            with

            registries whose resolved IP address is within the subnet described
            by

            the CIDR syntax.


            Registries can also be marked insecure by hostname. Those registries

            are listed under `IndexConfigs` and have their `Secure` field set to

            `false`.


            > **Warning**: Using this option can be useful when running a local

            > registry, but introduces security vulnerabilities. This option

            > should therefore ONLY be used for testing purposes. For increased

            > security, users should add their CA to their system's list of
            trusted

            > CAs instead of enabling this option.
          examples:
            - - '::1/128'
              - 127.0.0.0/8
        IndexConfigs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/IndexInfo'
          examples:
            - 127.0.0.1:5000:
                Name: 127.0.0.1:5000
                Mirrors: []
                Secure: false
                Official: false
              '[2001:db8:a0b:12f0::1]:80':
                Name: '[2001:db8:a0b:12f0::1]:80'
                Mirrors: []
                Secure: false
                Official: false
              docker.io:
                Name: docker.io
                Mirrors:
                  - https://hub-mirror.corp.example.com:5000/
                Secure: true
                Official: true
              registry.internal.corp.example.com:3000:
                Name: registry.internal.corp.example.com:3000
                Mirrors: []
                Secure: false
                Official: false
        Mirrors:
          type: array
          items:
            type: string
          description: |-
            List of registry URLs that act as a mirror for the official
            (`docker.io`) registry.
          examples:
            - - https://hub-mirror.corp.example.com:5000/
              - https://[2001:db8:a0b:12f0::1]/
      description: RegistryServiceConfig stores daemon registry services configuration.
    IndexInfo:
      title: IndexInfo
      type: object
      properties:
        Name:
          type: string
          description: Name of the registry, such as "docker.io".
          examples:
            - docker.io
        Mirrors:
          type: array
          items:
            type: string
          description: List of mirrors, expressed as URIs.
          examples:
            - - https://hub-mirror.corp.example.com:5000/
              - https://registry-2.docker.io/
              - https://registry-3.docker.io/
        Secure:
          type: boolean
          description: >-
            Indicates if the registry is part of the list of insecure

            registries.


            If `false`, the registry is insecure. Insecure registries accept

            un-encrypted (HTTP) and/or untrusted (HTTPS with certificates from

            unknown CAs) communication.


            > **Warning**: Insecure registries can be useful when running a
            local

            > registry. However, because its use creates security
            vulnerabilities

            > it should ONLY be enabled for testing purposes. For increased

            > security, users should add their CA to their system's list of

            > trusted CAs instead of enabling this option.
          examples:
            - true
        Official:
          type: boolean
          description: >-
            Indicates whether this is an official registry (i.e., Docker Hub /
            docker.io)
          examples:
            - true
      description: IndexInfo contains information about a registry.
    Runtime:
      title: Runtime
      type: object
      properties:
        path:
          type: string
          description: >-
            Name and, optional, path, of the OCI executable binary.


            If the path is omitted, the daemon searches the host's `$PATH` for
            the

            binary and uses the first result.
          examples:
            - /usr/local/bin/my-oci-runtime
        runtimeArgs:
          type: array
          items:
            type: string
          description: List of command-line arguments to pass to the runtime when invoked.
          examples:
            - - '--debug'
              - '--systemd-cgroup=false'
        status:
          type: object
          additionalProperties:
            type: string
          description: >-
            Information specific to the runtime.


            While this API specification does not define data provided by
            runtimes,

            the following well-known properties may be provided by runtimes:


            `org.opencontainers.runtime-spec.features`: features structure as
            defined

            in the [OCI Runtime
            Specification](https://github.com/opencontainers/runtime-spec/blob/main/features.md),

            in a JSON string representation.


            <p><br /></p>


            > **Note**: The information returned in this field, including the

            > formatting of values and labels, should not be considered stable,

            > and may change without notice.
          examples:
            - org.opencontainers.runtime-spec.features: '{"ociVersionMin":"1.0.0","ociVersionMax":"1.1.0","...":"..."}'
      description: >-
        Runtime describes an [OCI
        compliant](https://github.com/opencontainers/runtime-spec)

        runtime.


        The runtime is invoked by the daemon via the `containerd` daemon. OCI

        runtimes act as an interface to the Linux kernel namespaces, cgroups,

        and SELinux.
    Commit:
      title: Commit
      type: object
      properties:
        ID:
          type: string
          description: Actual commit ID of external tool.
          examples:
            - cfb82a876ecc11b5ca0977d1733adbe58599088a
      description: |-
        Commit holds the Git-commit (SHA1) that a binary was built from, as
        reported in the version-string of external tools, such as `containerd`,
        or `runC`.
    SwarmInfo:
      title: SwarmInfo
      type: object
      properties:
        NodeID:
          type: string
          description: Unique identifier of for this node in the swarm.
          examples:
            - k67qz4598weg5unwwffg6z1m1
        NodeAddr:
          type: string
          description: |-
            IP address at which this node can be reached by other nodes in the
            swarm.
          examples:
            - 10.0.0.46
        LocalNodeState:
          allOf:
            - $ref: '#/components/schemas/LocalNodeState'
            - description: Current local status of this node.
              examples:
                - active
        ControlAvailable:
          type: boolean
          default: false
          examples:
            - true
        Error:
          type: string
        RemoteManagers:
          type: array
          items:
            $ref: '#/components/schemas/PeerNode'
          description: List of ID's and addresses of other managers in the swarm.
          examples:
            - - NodeID: 71izy0goik036k48jg985xnds
                Addr: 10.0.0.158:2377
              - NodeID: 79y6h1o4gv8n120drcprv5nmc
                Addr: 10.0.0.159:2377
              - NodeID: k67qz4598weg5unwwffg6z1m1
                Addr: 10.0.0.46:2377
        Nodes:
          type: integer
          description: Total number of nodes in the swarm.
          contentEncoding: int32
          examples:
            - 4
        Managers:
          type: integer
          description: Total number of managers in the swarm.
          contentEncoding: int32
          examples:
            - 3
        Cluster:
          allOf:
            - $ref: '#/components/schemas/ClusterInfo'
            - description: >-
                ClusterInfo represents information about the swarm as is
                returned by the

                "/info" endpoint. Join-tokens are not included.
      description: Represents generic information about swarm.
    LocalNodeState:
      title: LocalNodeState
      enum:
        - inactive
        - pending
        - active
        - error
        - locked
      type: string
      description: Current local status of this node.
      examples:
        - active
    PeerNode:
      title: PeerNode
      type: object
      properties:
        NodeID:
          type: string
          description: Unique identifier of for this node in the swarm.
        Addr:
          type: string
          description: IP address and ports at which this node can be reached.
      description: Represents a peer-node in the swarm
    NetworkAttachmentConfig:
      title: NetworkAttachmentConfig
      type: object
      properties:
        Target:
          type: string
          description: The target network for attachment. Must be a network name or ID.
        Aliases:
          type: array
          items:
            type: string
          description: Discoverable alternate names for the service on this network.
        DriverOpts:
          type: object
          additionalProperties:
            type: string
          description: Driver attachment options for the network target.
      description: Specifies how a service should be attached to a particular network.
    EventActor:
      title: EventActor
      type: object
      properties:
        ID:
          type: string
          description: The ID of the object emitting the event
          examples:
            - ede54ee1afda366ab42f824e8a5ffd195155d853ceaec74a927f249ea270c743
        Attributes:
          type: object
          additionalProperties:
            type: string
          description: Various key/value attributes of the object, depending on its type.
          examples:
            - com.example.some-label: some-label-value
              image: alpine:latest
              name: my-container
      description: >-
        Actor describes something that generates events, like a container,
        network,

        or a volume.
    SystemEventsResponse:
      title: SystemEventsResponse
      type: object
      properties:
        Type:
          allOf:
            - $ref: '#/components/schemas/Type5'
            - description: The type of object emitting the event
              examples:
                - container
        Action:
          type: string
          description: The type of event
          examples:
            - create
        Actor:
          allOf:
            - $ref: '#/components/schemas/EventActor'
            - description: >-
                Actor describes something that generates events, like a
                container, network,

                or a volume.
        scope:
          allOf:
            - $ref: '#/components/schemas/Scope2'
            - description: >-
                Scope of the event. Engine events are `local` scope. Cluster
                (Swarm)

                events are `swarm` scope.
        time:
          type: integer
          description: Timestamp of event
          contentEncoding: int64
          examples:
            - 1629574695
        timeNano:
          type: integer
          description: Timestamp of event, with nanosecond accuracy
          contentEncoding: int64
          examples:
            - 1629574695515050000
      description: EventMessage represents the information an event contains.
    OCIDescriptor:
      title: OCIDescriptor
      type: object
      properties:
        mediaType:
          type: string
          description: The media type of the object this schema refers to.
          examples:
            - application/vnd.oci.image.manifest.v1+json
        digest:
          type: string
          description: The digest of the targeted content.
          examples:
            - >-
              sha256:c0537ff6a5218ef531ece93d4984efc99bbf3f7497c0a7726c88e2bb7584dc96
        size:
          type: integer
          description: The size in bytes of the blob.
          contentEncoding: int64
          examples:
            - 424
        urls:
          type: array
          items:
            type: string
          description: List of URLs from which this object MAY be downloaded.
        annotations:
          type: object
          additionalProperties:
            type: string
          description: Arbitrary metadata relating to the targeted content.
          examples:
            - com.docker.official-images.bashbrew.arch: amd64
              org.opencontainers.image.base.digest: >-
                sha256:0d0ef5c914d3ea700147da1bd050c59edb8bb12ca312f3800b29d7c8087eabd8
              org.opencontainers.image.base.name: scratch
              org.opencontainers.image.created: '2025-01-27T00:00:00.000Z'
              org.opencontainers.image.revision: 9fabb4bad5138435b01857e2fe9363e2dc5f6a79
              org.opencontainers.image.source: https://git.launchpad.net/cloud-images/+oci/ubuntu-base
              org.opencontainers.image.url: https://hub.docker.com/_/ubuntu
              org.opencontainers.image.version: '24.04'
        data:
          type: string
          description: >-
            Data is an embedding of the targeted content. This is encoded as a
            base64

            string when marshalled to JSON (automatically, by encoding/json). If

            present, Data can be used directly to avoid fetching the targeted
            content.
        platform:
          allOf:
            - $ref: '#/components/schemas/OCIPlatform'
            - description: >-
                Describes the platform which the image in the manifest runs on,
                as defined

                in the [OCI Image Index
                Specification](https://github.com/opencontainers/image-spec/blob/v1.0.1/image-index.md).
        artifactType:
          type: string
          description: ArtifactType is the IANA media type of this artifact.
      description: >-
        A descriptor struct containing digest, media type, and size, as defined
        in

        the [OCI Content Descriptors
        Specification](https://github.com/opencontainers/image-spec/blob/v1.0.1/descriptor.md).
    OCIPlatform:
      title: OCIPlatform
      type: object
      properties:
        architecture:
          type: string
          description: The CPU architecture, for example `amd64` or `ppc64`.
          examples:
            - arm
        os:
          type: string
          description: The operating system, for example `linux` or `windows`.
          examples:
            - windows
        os.version:
          type: string
          description: >-
            Optional field specifying the operating system version, for example
            on

            Windows `10.0.19041.1165`.
          examples:
            - 10.0.19041.1165
        os.features:
          type: array
          items:
            type: string
          description: >-
            Optional field specifying an array of strings, each listing a
            required

            OS feature (for example on Windows `win32k`).
          examples:
            - - win32k
        variant:
          type: string
          description: |-
            Optional field specifying a variant of the CPU, for example `v7` to
            specify ARMv7 when architecture is `arm`.
          examples:
            - v7
      description: >-
        Describes the platform which the image in the manifest runs on, as
        defined

        in the [OCI Image Index
        Specification](https://github.com/opencontainers/image-spec/blob/v1.0.1/image-index.md).
    DistributionInspectResponse:
      title: DistributionInspectResponse
      required:
        - Descriptor
        - Platforms
      type: object
      properties:
        Descriptor:
          allOf:
            - $ref: '#/components/schemas/OCIDescriptor'
            - description: >-
                A descriptor struct containing digest, media type, and size, as
                defined in

                the [OCI Content Descriptors
                Specification](https://github.com/opencontainers/image-spec/blob/v1.0.1/descriptor.md).
        Platforms:
          type: array
          items:
            $ref: '#/components/schemas/OCIPlatform'
          description: An array containing all platforms supported by the image.
      description: |-
        Describes the result obtained from contacting the registry to retrieve
        image metadata.
    ClusterVolume:
      title: ClusterVolume
      type: object
      properties:
        ID:
          type: string
          description: |-
            The Swarm ID of this volume. Because cluster volumes are Swarm
            objects, they have an ID, unlike non-cluster volumes. This ID can
            be used to refer to the Volume instead of the name.
        Version:
          allOf:
            - $ref: '#/components/schemas/ObjectVersion'
            - description: >-
                The version number of the object such as node, service, etc.
                This is needed

                to avoid conflicting writes. The client must send the version
                number along

                with the modified specification when updating these objects.


                This approach ensures safe concurrency and determinism in that
                the change

                on the object may not be applied if the version number has
                changed from the

                last read. In other words, if two update requests specify the
                same base

                version, only one of the requests can succeed. As a result, two
                separate

                update requests that happen at the same time will not
                unintentionally

                overwrite each other.
        CreatedAt:
          type: string
        UpdatedAt:
          type: string
        Spec:
          allOf:
            - $ref: '#/components/schemas/ClusterVolumeSpec'
            - description: Cluster-specific options used to create the volume.
        Info:
          allOf:
            - $ref: '#/components/schemas/Info'
            - description: Information about the global status of the volume.
        PublishStatus:
          type: array
          items:
            $ref: '#/components/schemas/PublishStatus'
          description: |-
            The status of the volume as it pertains to its publishing and use on
            specific nodes
      description: |-
        Options and information specific to, and only present on, Swarm CSI
        cluster volumes.
    ClusterVolumeSpec:
      title: ClusterVolumeSpec
      type: object
      properties:
        Group:
          type: string
          description: |-
            Group defines the volume group of this volume. Volumes belonging to
            the same group can be referred to by group name when creating
            Services.  Referring to a volume by group instructs Swarm to treat
            volumes in that group interchangeably for the purpose of scheduling.
            Volumes with an empty string for a group technically all belong to
            the same, emptystring group.
        AccessMode:
          allOf:
            - $ref: '#/components/schemas/AccessMode'
            - description: Defines how the volume is used by tasks.
      description: Cluster-specific options used to create the volume.
    ImageManifestSummary:
      title: ImageManifestSummary
      required:
        - ID
        - Descriptor
        - Available
        - Size
        - Kind
      type: object
      properties:
        ID:
          type: string
          description: |-
            ID is the content-addressable ID of an image and is the same as the
            digest of the image manifest.
          examples:
            - >-
              sha256:95869fbcf224d947ace8d61d0e931d49e31bb7fc67fffbbe9c3198c33aa8e93f
        Descriptor:
          allOf:
            - $ref: '#/components/schemas/OCIDescriptor'
            - description: >-
                A descriptor struct containing digest, media type, and size, as
                defined in

                the [OCI Content Descriptors
                Specification](https://github.com/opencontainers/image-spec/blob/v1.0.1/descriptor.md).
        Available:
          type: boolean
          description: >-
            Indicates whether all the child content (image config, layers) is
            fully available locally.
          examples:
            - true
        Size:
          $ref: '#/components/schemas/Size'
        Kind:
          allOf:
            - $ref: '#/components/schemas/Kind'
            - description: >-
                The kind of the manifest.


                kind         | description

                -------------|-----------------------------------------------------------

                image        | Image manifest that can be used to start a
                container.

                attestation  | Attestation manifest produced by the Buildkit
                builder for a specific image manifest.
              examples:
                - image
        ImageData:
          allOf:
            - $ref: '#/components/schemas/ImageData'
            - description: |-
                The image data for the image manifest.
                This field is only populated when Kind is "image".
        AttestationData:
          allOf:
            - $ref: '#/components/schemas/AttestationData'
            - description: |-
                The image data for the attestation manifest.
                This field is only populated when Kind is "attestation".
      description: ImageManifestSummary represents a summary of an image manifest.
    AccessibilityRequirements:
      title: AccessibilityRequirements
      type: object
      properties:
        Requisite:
          type: array
          items:
            type: string
          description: |-
            A list of required topologies, at least one of which the
            volume must be accessible from.
        Preferred:
          type: array
          items:
            type: string
          description: |-
            A list of topologies that the volume should attempt to be
            provisioned in.
      description: |-
        Requirements for the accessible topology of the volume. These
        fields are optional. For an in-depth description of what these
        fields mean, see the CSI specification.
    AccessMode:
      title: AccessMode
      type: object
      properties:
        Scope:
          allOf:
            - $ref: '#/components/schemas/Scope1'
            - description: >-
                The set of nodes this volume can be used on at one time.

                - `single` The volume may only be scheduled to one node at a
                time.

                - `multi` the volume may be scheduled to any supported number of
                nodes at a time.
        Sharing:
          allOf:
            - $ref: '#/components/schemas/Sharing'
            - description: >-
                The number and way that different tasks can use this volume

                at one time.

                - `none` The volume may only be used by one task at a time.

                - `readonly` The volume may be used by any number of tasks, but
                they all must mount the volume as readonly

                - `onewriter` The volume may be used by any number of tasks, but
                only one may mount it as read/write.

                - `all` The volume may have any number of readers and writers.
        MountVolume:
          type: object
          description: |-
            Options for using this volume as a Mount-type volume.

                Either MountVolume or BlockVolume, but not both, must be
                present.
              properties:
                FsType:
                  type: "string"
                  description: |
                    Specifies the filesystem type for the mount volume.
                    Optional.
                MountFlags:
                  type: "array"
                  description: |
                    Flags to pass when mounting the volume. Optional.
                  items:
                    type: "string"
            BlockVolume:
              type: "object"
              description: |
                Options for using this volume as a Block-type volume.
                Intentionally empty.
        Secrets:
          type: array
          items:
            $ref: '#/components/schemas/Secret3'
          description: |-
            Swarm Secrets that are passed to the CSI storage plugin when
            operating on this volume.
        AccessibilityRequirements:
          allOf:
            - $ref: '#/components/schemas/AccessibilityRequirements'
            - description: |-
                Requirements for the accessible topology of the volume. These
                fields are optional. For an in-depth description of what these
                fields mean, see the CSI specification.
        CapacityRange:
          allOf:
            - $ref: '#/components/schemas/CapacityRange'
            - description: |-
                The desired capacity that the volume should be created with. If
                empty, the plugin will decide the capacity.
        Availability:
          allOf:
            - $ref: '#/components/schemas/Availability'
            - description: >-
                The availability of the volume for use in tasks.

                - `active` The volume is fully available for scheduling on the
                cluster

                - `pause` No new workloads should use the volume, but existing
                workloads are not stopped.

                - `drain` All workloads using this volume should be stopped and
                rescheduled, and no new ones should be started.
      description: Defines how the volume is used by tasks.
    AppArmor:
      title: AppArmor
      type: object
      properties:
        Mode:
          $ref: '#/components/schemas/Mode1'
      description: Options for configuring AppArmor on the container
    Args:
      title: Args
      required:
        - Name
        - Description
        - Settable
        - Value
      type: object
      properties:
        Name:
          type: string
          examples:
            - args
        Description:
          type: string
          examples:
            - command line arguments
        Settable:
          type: array
          items:
            type: string
          description: ''
        Value:
          type: array
          items:
            type: string
          description: ''
    AttestationData:
      title: AttestationData
      required:
        - For
      type: object
      properties:
        For:
          type: string
          description: The digest of the image manifest that this attestation is for.
          examples:
            - >-
              sha256:95869fbcf224d947ace8d61d0e931d49e31bb7fc67fffbbe9c3198c33aa8e93f
      description: |-
        The image data for the attestation manifest.
        This field is only populated when Kind is "attestation".
    Availability:
      title: Availability
      enum:
        - active
        - pause
        - drain
      type: string
      description: >-
        The availability of the volume for use in tasks.

        - `active` The volume is fully available for scheduling on the cluster

        - `pause` No new workloads should use the volume, but existing workloads
        are not stopped.

        - `drain` All workloads using this volume should be stopped and
        rescheduled, and no new ones should be started.
    Availability1:
      title: Availability1
      enum:
        - active
        - pause
        - drain
      type: string
      description: Availability of the node.
      examples:
        - active
    BindOptions:
      title: BindOptions
      type: object
      properties:
        Propagation:
          allOf:
            - $ref: '#/components/schemas/Propagation'
            - description: >-
                A propagation mode with the value `[r]private`, `[r]shared`, or
                `[r]slave`.
        NonRecursive:
          type: boolean
          description: Disable recursive bind mount.
          default: false
        CreateMountpoint:
          type: boolean
          description: Create mount point on host if missing
          default: false
        ReadOnlyNonRecursive:
          type: boolean
          description: >-
            Make the mount non-recursively read-only, but still leave the mount
            recursive

            (unless NonRecursive is set to `true` in conjunction).


            Added in v1.44, before that version all read-only mounts were

            non-recursive by default. To match the previous behaviour this

            will default to `true` for clients on versions prior to v1.44.
          default: false
        ReadOnlyForceRecursive:
          type: boolean
          description: Raise an error if the mount cannot be made recursively read-only.
          default: false
      description: Optional configuration for the `bind` type.
    BlkioWeightDevice:
      title: BlkioWeightDevice
      type: object
      properties:
        Path:
          type: string
        Weight:
          minimum: 0
          type: integer
          contentEncoding: int32
    body:
      title: body
      type: object
      properties:
        Hostname:
          type: string
          description: The hostname to use for the container, as a valid RFC 1123 hostname.
          examples:
            - 439f4e91bd1d
        Domainname:
          type: string
          description: The domain name to use for the container.
        User:
          type: string
          description: >-
            Commands run as this user inside the container. If omitted, commands

            run as the user specified in the image the container was started
            from.


            Can be either user-name or UID, and optional group-name or GID,

            separated by a colon (`<user-name|UID>[<:group-name|GID>]`).
          examples:
            - '123:456'
        AttachStdin:
          type: boolean
          description: Whether to attach to `stdin`.
          default: false
        AttachStdout:
          type: boolean
          description: Whether to attach to `stdout`.
          default: true
        AttachStderr:
          type: boolean
          description: Whether to attach to `stderr`.
          default: true
        ExposedPorts:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ExposedPorts'
          description: |-
            An object mapping ports to an empty object in the form:

            `{"<port>/<tcp|udp|sctp>": {}}`
          examples:
            - 80/tcp: {}
              443/tcp: {}
        Tty:
          type: boolean
          description: >-
            Attach standard streams to a TTY, including `stdin` if it is not
            closed.
          default: false
        OpenStdin:
          type: boolean
          description: Open `stdin`
          default: false
        StdinOnce:
          type: boolean
          description: Close `stdin` after one attached client disconnects
          default: false
        Env:
          type: array
          items:
            type: string
          description: >-
            A list of environment variables to set inside the container in the

            form `["VAR=value", ...]`. A variable without `=` is removed from
            the

            environment, rather than to have an empty value.
          examples:
            - - >-
                PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        Cmd:
          type: array
          items:
            type: string
          description: Command to run specified as a string or an array of strings.
          examples:
            - - /bin/sh
        Healthcheck:
          allOf:
            - $ref: '#/components/schemas/HealthConfig'
            - description: A test to perform to check that the container is healthy.
        ArgsEscaped:
          type: boolean
          description: Command is already escaped (Windows only)
          default: false
          examples:
            - false
        Image:
          type: string
          description: >-
            The name (or reference) of the image to use when creating the
            container,

            or which was used when the container was created.
          examples:
            - example-image:1.0
        Volumes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Volumes'
          description: |-
            An object mapping mount point paths inside the container to empty
            objects.
        WorkingDir:
          type: string
          description: The working directory for commands to run in.
          examples:
            - /public/
        Entrypoint:
          type: array
          items:
            type: string
          description: >-
            The entry point for the container as a string or an array of
            strings.


            If the array consists of exactly one empty string (`[""]`) then the

            entry point is reset to system default (i.e., the entry point used
            by

            docker when there is no `ENTRYPOINT` instruction in the
            `Dockerfile`).
          examples:
            - []
        NetworkDisabled:
          type: boolean
          description: Disable networking for the container.
        OnBuild:
          type: array
          items:
            type: string
          description: '`ONBUILD` metadata that were defined in the image''s `Dockerfile`.'
          examples:
            - []
        Labels:
          type: object
          additionalProperties:
            type: string
          description: User-defined key/value metadata.
          examples:
            - com.example.some-label: some-value
              com.example.some-other-label: some-other-value
        StopSignal:
          type: string
          description: Signal to stop a container as a string or unsigned integer.
          examples:
            - SIGTERM
        StopTimeout:
          type: integer
          description: Timeout to stop a container in seconds.
          contentEncoding: int32
          default: 10
        Shell:
          type: array
          items:
            type: string
          description: Shell for when `RUN`, `CMD`, and `ENTRYPOINT` uses a shell.
          examples:
            - - /bin/sh
              - '-c'
        HostConfig:
          allOf:
            - $ref: '#/components/schemas/HostConfig'
            - description: >-
                Container configuration that depends on the host we are running
                on
        NetworkingConfig:
          allOf:
            - $ref: '#/components/schemas/NetworkingConfig'
            - description: >-
                NetworkingConfig represents the container's networking
                configuration for

                each of its interfaces.

                It is used for the networking configs specified in the `docker
                create`

                and `docker network connect` commands.
              examples:
                - EndpointsConfig:
                    isolated_nw:
                      IPAMConfig:
                        IPv4Address: 172.20.30.33
                        IPv6Address: 2001:db8:abcd::3033
                        LinkLocalIPs:
                          - 169.254.34.68
                          - fe80::3468
                      MacAddress: 02:42:ac:12:05:02
                      Links:
                        - container_1
                        - container_2
                      Aliases:
                        - server_x
                        - server_y
                    database_nw: {}
    body1:
      title: body1
      type: object
      properties:
        Spec:
          allOf:
            - $ref: '#/components/schemas/ClusterVolumeSpec'
            - description: Cluster-specific options used to create the volume.
      description: Volume configuration
    body2:
      title: body2
      type: object
      properties:
        Name:
          type: string
          description: Name of the service.
        Labels:
          type: object
          additionalProperties:
            type: string
          description: User-defined key/value metadata.
        TaskTemplate:
          allOf:
            - $ref: '#/components/schemas/TaskSpec'
            - description: User modifiable task configuration.
        Mode:
          allOf:
            - $ref: '#/components/schemas/Mode2'
            - description: Scheduling mode for the service.
        UpdateConfig:
          allOf:
            - $ref: '#/components/schemas/UpdateConfig'
            - description: Specification for the update strategy of the service.
        RollbackConfig:
          allOf:
            - $ref: '#/components/schemas/RollbackConfig'
            - description: Specification for the rollback strategy of the service.
        Networks:
          type: array
          items:
            $ref: '#/components/schemas/NetworkAttachmentConfig'
          description: >-
            Specifies which networks the service should attach to.


            Deprecated: This field is deprecated since v1.44. The Networks field
            in TaskSpec should be used instead.
        EndpointSpec:
          allOf:
            - $ref: '#/components/schemas/EndpointSpec'
            - description: >-
                Properties that can be configured to access and load balance a
                service.
    BuildPruneResponse:
      title: BuildPruneResponse
      type: object
      properties:
        CachesDeleted:
          type: array
          items:
            type: string
          description: ''
        SpaceReclaimed:
          type: integer
          description: Disk space reclaimed in bytes
          contentEncoding: int64
    CAConfig:
      title: CAConfig
      type: object
      properties:
        NodeCertExpiry:
          type: integer
          description: The duration node certificates are issued for.
          contentEncoding: int64
          examples:
            - 7776000000000000
        ExternalCAs:
          type: array
          items:
            $ref: '#/components/schemas/ExternalCA'
          description: |-
            Configuration for forwarding signing requests to an external
            certificate authority.
        SigningCACert:
          type: string
          description: |-
            The desired signing CA certificate for all swarm node TLS leaf
            certificates, in PEM format.
        SigningCAKey:
          type: string
          description: |-
            The desired signing CA key for all swarm node TLS leaf certificates,
            in PEM format.
        ForceRotate:
          type: integer
          description: |-
            An integer whose purpose is to force swarm to generate a new
            signing CA certificate and key, if none have been specified in
            `SigningCACert` and `SigningCAKey`
          contentEncoding: int32
      description: CA configuration.
    CapacityRange:
      title: CapacityRange
      type: object
      properties:
        RequiredBytes:
          type: integer
          description: |-
            The volume must be at least this big. The value of 0
            indicates an unspecified minimum
          contentEncoding: int64
        LimitBytes:
          type: integer
          description: |-
            The volume must not be bigger than this. The value of 0
            indicates an unspecified maximum.
          contentEncoding: int64
      description: |-
        The desired capacity that the volume should be created with. If
        empty, the plugin will decide the capacity.
    CgroupDriver:
      title: CgroupDriver
      enum:
        - cgroupfs
        - systemd
        - none
      type: string
      description: The driver to use for managing cgroups.
      examples:
        - cgroupfs
    CgroupnsMode:
      title: CgroupnsMode
      enum:
        - private
        - host
      type: string
      description: >-
        cgroup namespace mode for the container. Possible values are:


        - `"private"`: the container runs in its own private cgroup namespace

        - `"host"`: use the host system's cgroup namespace


        If not specified, the daemon default is used, which can either be
        `"private"`

        or `"host"`, depending on daemon version, kernel support and
        configuration.
    CgroupVersion:
      title: CgroupVersion
      enum:
        - '1'
        - '2'
      type: string
      description: The version of the cgroup.
      examples:
        - '1'
    Component:
      title: Component
      required:
        - Name
        - Version
      type: object
      properties:
        Name:
          type: string
          description: Name of the component
          examples:
            - Engine
        Version:
          type: string
          description: Version of the component
          examples:
            - 27.0.1
        Details:
          type: object
          description: >-
            Key/value pairs of strings with additional information about the

            component. These values are intended for informational purposes

            only, and their content is not defined, and not part of the API

            specification.


            These messages can be printed by the client as information to the
            user.
    Condition:
      title: Condition
      enum:
        - none
        - on-failure
        - any
      type: string
      description: Condition for restart.
    condition1:
      title: condition1
      enum:
        - not-running
        - next-exit
        - removed
      type: string
    Config1:
      title: Config1
      type: object
      properties:
        File:
          allOf:
            - $ref: '#/components/schemas/File1'
            - description: >-
                File represents a specific target that is backed by a file.


                <p><br /><p>


                > **Note**: `Configs.File` and `Configs.Runtime` are mutually
                exclusive
        Runtime:
          type: object
          description: |-
            Runtime represents a target that is not mounted into the
            container but is used by the task

            <p><br /><p>

            > **Note**: `Configs.File` and `Configs.Runtime` are mutually
            > exclusive
        ConfigID:
          type: string
          description: |-
            ConfigID represents the ID of the specific config that we're
            referencing.
        ConfigName:
          type: string
          description: |-
            ConfigName is the name of the config that this references,
            but this is just provided for lookup/display purposes. The
            config in the reference will be identified by its ID.
    Config3:
      title: Config3
      required:
        - Description
        - Documentation
        - Interface
        - Entrypoint
        - WorkDir
        - Network
        - Linux
        - PropagatedMount
        - IpcHost
        - PidHost
        - Mounts
        - Env
        - Args
      type: object
      properties:
        Description:
          type: string
          examples:
            - A sample volume plugin for Docker
        Documentation:
          type: string
          examples:
            - https://docs.docker.com/engine/extend/plugins/
        Interface:
          allOf:
            - $ref: '#/components/schemas/Interface'
            - description: The interface between Docker and the plugin
        Entrypoint:
          type: array
          items:
            type: string
          description: ''
          examples:
            - - /usr/bin/sample-volume-plugin
              - /data
        WorkDir:
          type: string
          examples:
            - /bin/
        User:
          $ref: '#/components/schemas/User'
        Network:
          $ref: '#/components/schemas/Network1'
        Linux:
          $ref: '#/components/schemas/Linux'
        PropagatedMount:
          type: string
          examples:
            - /mnt/volumes
        IpcHost:
          type: boolean
          examples:
            - false
        PidHost:
          type: boolean
          examples:
            - false
        Mounts:
          type: array
          items:
            $ref: '#/components/schemas/PluginMount'
          description: ''
        Env:
          type: array
          items:
            $ref: '#/components/schemas/PluginEnv'
          description: ''
        Args:
          $ref: '#/components/schemas/Args'
        rootfs:
          $ref: '#/components/schemas/Rootfs1'
      description: The config of a plugin.
    ContainerPruneResponse:
      title: ContainerPruneResponse
      type: object
      properties:
        ContainersDeleted:
          type: array
          items:
            type: string
          description: Container IDs that were deleted
        SpaceReclaimed:
          type: integer
          description: Disk space reclaimed in bytes
          contentEncoding: int64
    ContainerSpec:
      title: ContainerSpec
      type: object
      properties:
        Image:
          type: string
          description: The image name to use for the container
        Labels:
          type: object
          additionalProperties:
            type: string
          description: User-defined key/value data.
        Command:
          type: array
          items:
            type: string
          description: The command to be run in the image.
        Args:
          type: array
          items:
            type: string
          description: Arguments to the command.
        Hostname:
          type: string
          description: |-
            The hostname to use for the container, as a valid
            [RFC 1123](https://tools.ietf.org/html/rfc1123) hostname.
        Env:
          type: array
          items:
            type: string
          description: A list of environment variables in the form `VAR=value`.
        Dir:
          type: string
          description: The working directory for commands to run in.
        User:
          type: string
          description: The user inside the container.
        Groups:
          type: array
          items:
            type: string
          description: A list of additional groups that the container process will run as.
        Privileges:
          allOf:
            - $ref: '#/components/schemas/Privileges'
            - description: Security options for the container
        TTY:
          type: boolean
          description: Whether a pseudo-TTY should be allocated.
        OpenStdin:
          type: boolean
          description: Open `stdin`
        ReadOnly:
          type: boolean
          description: Mount the container's root filesystem as read only.
        Mounts:
          type: array
          items:
            $ref: '#/components/schemas/Mount'
          description: |-
            Specification for mounts to be added to containers created as part
            of the service.
        StopSignal:
          type: string
          description: Signal to stop the container.
        StopGracePeriod:
          type: integer
          description: |-
            Amount of time to wait for the container to terminate before
            forcefully killing it.
          contentEncoding: int64
        HealthCheck:
          allOf:
            - $ref: '#/components/schemas/HealthConfig'
            - description: A test to perform to check that the container is healthy.
        Hosts:
          type: array
          items:
            type: string
          description: |-
            A list of hostname/IP mappings to add to the container's `hosts`
            file. The format of extra hosts is specified in the
            [hosts(5)](http://man7.org/linux/man-pages/man5/hosts.5.html)
            man page:

                IP_address canonical_hostname [aliases...]
        DNSConfig:
          allOf:
            - $ref: '#/components/schemas/DNSConfig'
            - description: >-
                Specification for DNS related configurations in resolver
                configuration

                file (`resolv.conf`).
        Secrets:
          type: array
          items:
            $ref: '#/components/schemas/Secret1'
          description: |-
            Secrets contains references to zero or more secrets that will be
            exposed to the service.
        OomScoreAdj:
          type: integer
          description: |-
            An integer value containing the score given to the container in
            order to tune OOM killer preferences.
          contentEncoding: int64
          examples:
            - 0
        Configs:
          type: array
          items:
            $ref: '#/components/schemas/Config1'
          description: |-
            Configs contains references to zero or more configs that will be
            exposed to the service.
        Isolation:
          allOf:
            - $ref: '#/components/schemas/Isolation1'
            - description: |-
                Isolation technology of the containers running the service.
                (Windows only)
        Init:
          type: boolean
          description: |-
            Run an init inside the container that forwards signals and reaps
            processes. This field is omitted if empty, and the default (as
            configured on the daemon) is used.
        Sysctls:
          type: object
          additionalProperties:
            type: string
          description: |-
            Set kernel namedspaced parameters (sysctls) in the container.
            The Sysctls option on services accepts the same sysctls as the
            are supported on containers. Note that while the same sysctls are
            supported, no guarantees or checks are made about their
            suitability for a clustered environment, and it's up to the user
            to determine whether a given sysctl will work properly in a
            Service.
        CapabilityAdd:
          type: array
          items:
            type: string
          description: |-
            A list of kernel capabilities to add to the default set
            for the container.
          examples:
            - - CAP_NET_RAW
              - CAP_SYS_ADMIN
              - CAP_SYS_CHROOT
              - CAP_SYSLOG
        CapabilityDrop:
          type: array
          items:
            type: string
          description: |-
            A list of kernel capabilities to drop from the default set
            for the container.
          examples:
            - - CAP_NET_RAW
        Ulimits:
          type: array
          items:
            $ref: '#/components/schemas/Ulimit'
          description: >-
            A list of resource limits to set in the container. For example:
            `{"Name": "nofile", "Soft": 1024, "Hard": 2048}`"
      description: |-
        Container spec for the service.

        <p><br /></p>

        > **Note**: ContainerSpec, NetworkAttachmentSpec, and PluginSpec are
        > mutually exclusive. PluginSpec is only used when the Runtime field
        > is set to `plugin`. NetworkAttachmentSpec is used when the Runtime
        > field is set to `attachment`.
    Content-type:
      title: Content-type
      const: application/x-tar
      type: string
    CredentialSpec:
      title: CredentialSpec
      type: object
      properties:
        Config:
          type: string
          description: |-
            Load credential spec from a Swarm Config with the given ID.
            The specified config must also be present in the Configs
            field with the Runtime property set.

            <p><br /></p>


            > **Note**: `CredentialSpec.File`, `CredentialSpec.Registry`,
            > and `CredentialSpec.Config` are mutually exclusive.
          examples:
            - 0bt9dmxjvjiqermk6xrop3ekq
        File:
          type: string
          description: |-
            Load credential spec from this file. The file is read by
            the daemon, and must be present in the `CredentialSpecs`
            subdirectory in the docker data directory, which defaults
            to `C:\ProgramData\Docker\` on Windows.

            For example, specifying `spec.json` loads
            `C:\ProgramData\Docker\CredentialSpecs\spec.json`.

            <p><br /></p>

            > **Note**: `CredentialSpec.File`, `CredentialSpec.Registry`,
            > and `CredentialSpec.Config` are mutually exclusive.
          examples:
            - spec.json
        Registry:
          type: string
          description: >-
            Load credential spec from this value in the Windows

            registry. The specified registry value must be located in:


            `HKLM\SOFTWARE\Microsoft\Windows
            NT\CurrentVersion\Virtualization\Containers\CredentialSpecs`


            <p><br /></p>



            > **Note**: `CredentialSpec.File`, `CredentialSpec.Registry`,

            > and `CredentialSpec.Config` are mutually exclusive.
      description: CredentialSpec for managed service account (Windows only)
    DefaultAddressPool:
      title: DefaultAddressPool
      type: object
      properties:
        Base:
          type: string
          description: The network address in CIDR format
          examples:
            - 10.10.0.0/16
        Size:
          type: integer
          description: The network pool size
          contentEncoding: int32
          examples:
            - 24
    DiscreteResourceSpec:
      title: DiscreteResourceSpec
      type: object
      properties:
        Kind:
          type: string
        Value:
          type: integer
          contentEncoding: int64
    Dispatcher:
      title: Dispatcher
      type: object
      properties:
        HeartbeatPeriod:
          type: integer
          description: The delay for an agent to send a heartbeat to the dispatcher.
          contentEncoding: int64
          examples:
            - 5000000000
      description: Dispatcher configuration.
    DNSConfig:
      title: DNSConfig
      type: object
      properties:
        Nameservers:
          type: array
          items:
            type: string
          description: The IP addresses of the name servers.
        Search:
          type: array
          items:
            type: string
          description: A search list for host-name lookup.
        Options:
          type: array
          items:
            type: string
          description: |-
            A list of internal resolver variables to be modified (e.g.,
            `debug`, `ndots:3`, etc.).
      description: |-
        Specification for DNS related configurations in resolver configuration
        file (`resolv.conf`).
    DriverConfig:
      title: DriverConfig
      type: object
      properties:
        Name:
          type: string
          description: Name of the driver to use to create the volume.
        Options:
          type: object
          additionalProperties:
            type: string
          description: key/value map of driver specific options.
      description: Map of driver specific options
    EncryptionConfig:
      title: EncryptionConfig
      type: object
      properties:
        AutoLockManagers:
          type: boolean
          description: |-
            If set, generate a key and use it to lock data stored on the
            managers.
          examples:
            - false
      description: Parameters related to encryption-at-rest.
    Endpoint:
      title: Endpoint
      type: object
      properties:
        Spec:
          allOf:
            - $ref: '#/components/schemas/EndpointSpec'
            - description: >-
                Properties that can be configured to access and load balance a
                service.
        Ports:
          type: array
          items:
            $ref: '#/components/schemas/EndpointPortConfig'
          description: ''
        VirtualIPs:
          type: array
          items:
            $ref: '#/components/schemas/VirtualIP'
          description: ''
    ExecConfig:
      title: ExecConfig
      type: object
      properties:
        AttachStdin:
          type: boolean
          description: Attach to `stdin` of the exec command.
        AttachStdout:
          type: boolean
          description: Attach to `stdout` of the exec command.
        AttachStderr:
          type: boolean
          description: Attach to `stderr` of the exec command.
        ConsoleSize:
          maxItems: 2
          minItems: 2
          type: array
          items:
            minimum: 0
            type: integer
            contentEncoding: int32
          description: Initial console size, as an `[height, width]` array.
          examples:
            - - 80
              - 64
        DetachKeys:
          type: string
          description: |-
            Override the key sequence for detaching a container. Format is
            a single character `[a-Z]` or `ctrl-<value>` where `<value>`
            is one of: `a-z`, `@`, `^`, `[`, `,` or `_`.
        Tty:
          type: boolean
          description: Allocate a pseudo-TTY.
        Env:
          type: array
          items:
            type: string
          description: A list of environment variables in the form `["VAR=value", ...]`.
        Cmd:
          type: array
          items:
            type: string
          description: Command to run, as a string or array of strings.
        Privileged:
          type: boolean
          description: Runs the exec process with extended privileges.
          default: false
        User:
          type: string
          description: |-
            The user, and optionally, group to run the exec process inside
            the container. Format is one of: `user`, `user:group`, `uid`,
            or `uid:gid`.
        WorkingDir:
          type: string
          description: The working directory for the exec process inside the container.
      examples:
        - AttachStdin: false
          AttachStdout: true
          AttachStderr: true
          DetachKeys: ctrl-p,ctrl-q
          Tty: false
          Cmd:
            - date
          Env:
            - FOO=bar
            - BAZ=quux
    ExecInspectResponse:
      title: ExecInspectResponse
      type: object
      properties:
        CanRemove:
          type: boolean
        DetachKeys:
          type: string
        ID:
          type: string
        Running:
          type: boolean
        ExitCode:
          type: integer
          contentEncoding: int32
        ProcessConfig:
          $ref: '#/components/schemas/ProcessConfig'
        OpenStdin:
          type: boolean
        OpenStderr:
          type: boolean
        OpenStdout:
          type: boolean
        ContainerID:
          type: string
        Pid:
          type: integer
          description: The system process ID for the exec process.
          contentEncoding: int32
    ExecStartConfig:
      title: ExecStartConfig
      type: object
      properties:
        Detach:
          type: boolean
          description: Detach from the command.
          examples:
            - false
        Tty:
          type: boolean
          description: Allocate a pseudo-TTY.
          examples:
            - true
        ConsoleSize:
          maxItems: 2
          minItems: 2
          type: array
          items:
            minimum: 0
            type: integer
            contentEncoding: int32
          description: Initial console size, as an `[height, width]` array.
          examples:
            - - 80
              - 64
    ExposedPorts:
      title: ExposedPorts
      const: '{}'
      type: string
    ExternalCA:
      title: ExternalCA
      type: object
      properties:
        Protocol:
          allOf:
            - $ref: '#/components/schemas/Protocol'
            - description: |-
                Protocol for communication with the external CA (currently
                only `cfssl` is supported).
        URL:
          type: string
          description: URL where certificate signing requests should be sent.
        Options:
          type: object
          additionalProperties:
            type: string
          description: |-
            An object with key/value pairs that are interpreted as
            protocol-specific options for the external CA driver.
        CACert:
          type: string
          description: |-
            The root CA certificate (in PEM format) this external CA uses
            to issue TLS certificates (assumed to be to the current swarm
            root CA certificate if not provided).
    FailureAction:
      title: FailureAction
      enum:
        - continue
        - pause
        - rollback
      type: string
      description: |-
        Action to take if an updated task fails to run, or stops running
        during the update.
    FailureAction1:
      title: FailureAction1
      enum:
        - continue
        - pause
      type: string
      description: |-
        Action to take if an rolled back task fails to run, or stops
        running during the rollback.
    File:
      title: File
      type: object
      properties:
        Name:
          type: string
          description: Name represents the final filename in the filesystem.
        UID:
          type: string
          description: UID represents the file UID.
        GID:
          type: string
          description: GID represents the file GID.
        Mode:
          type: integer
          description: Mode represents the FileMode of the file.
          contentEncoding: int32
      description: File represents a specific target that is backed by a file.
    File1:
      title: File1
      type: object
      properties:
        Name:
          type: string
          description: Name represents the final filename in the filesystem.
        UID:
          type: string
          description: UID represents the file UID.
        GID:
          type: string
          description: GID represents the file GID.
        Mode:
          type: integer
          description: Mode represents the FileMode of the file.
          contentEncoding: int32
      description: |-
        File represents a specific target that is backed by a file.

        <p><br /><p>

        > **Note**: `Configs.File` and `Configs.Runtime` are mutually exclusive
    GenericResource:
      title: GenericResource
      type: object
      properties:
        NamedResourceSpec:
          $ref: '#/components/schemas/NamedResourceSpec'
        DiscreteResourceSpec:
          $ref: '#/components/schemas/DiscreteResourceSpec'
    Health1:
      title: Health1
      type: object
      properties:
        Status:
          allOf:
            - $ref: '#/components/schemas/Status2'
            - description: the health status of the container
              examples:
                - healthy
        FailingStreak:
          type: integer
          description: FailingStreak is the number of consecutive failures
          contentEncoding: int32
          examples:
            - 0
      description: >-
        Summary of health status


        Added in v1.52, before that version all container summary not include
        Health.

        After this attribute introduced, it includes containers with no health
        checks configured,

        or containers that are not running with none
    HistoryResponseItem:
      title: HistoryResponseItem
      required:
        - Id
        - Created
        - CreatedBy
        - Tags
        - Size
        - Comment
      type: object
      properties:
        Id:
          type: string
        Created:
          type: integer
          contentEncoding: int64
        CreatedBy:
          type: string
        Tags:
          type: array
          items:
            type: string
          description: ''
        Size:
          type: integer
          contentEncoding: int64
        Comment:
          type: string
      description: individual image layer information in response to ImageHistory operation
    HostConfig1:
      title: HostConfig1
      type: object
      properties:
        NetworkMode:
          type: string
          description: |-
            Networking mode (`host`, `none`, `container:<id>`) or name of the
            primary network the container is using.

            This field is primarily for backward compatibility. The container
            can be connected to multiple networks for which information can be
            found in the `NetworkSettings.Networks` field, which enumerates
            settings per network.
          examples:
            - mynetwork
        Annotations:
          type: object
          additionalProperties:
            type: string
          description: Arbitrary key-value metadata attached to the container.
          examples:
            - io.kubernetes.docker.type: container
              io.kubernetes.sandbox.id: 3befe639bed0fd6afdd65fd1fa84506756f59360ec4adc270b0fdac9be22b4d3
      description: |-
        Summary of host-specific runtime information of the container. This
        is a reduced set of information in the container's "HostConfig" as
        available in the container "inspect" response.
    ImageData:
      title: ImageData
      required:
        - Platform
        - Containers
        - Size
      type: object
      properties:
        Platform:
          allOf:
            - $ref: '#/components/schemas/OCIPlatform'
            - description: >-
                Describes the platform which the image in the manifest runs on,
                as defined

                in the [OCI Image Index
                Specification](https://github.com/opencontainers/image-spec/blob/v1.0.1/image-index.md).
        Containers:
          type: array
          items:
            type: string
          description: The IDs of the containers that are using this image.
          examples:
            - - ede54ee1fda366ab42f824e8a5ffd195155d853ceaec74a927f249ea270c7430
              - abadbce344c096744d8d6071a90d474d28af8f1034b5ea9fb03c3f4bfc6d005e
        Size:
          $ref: '#/components/schemas/Size1'
      description: |-
        The image data for the image manifest.
        This field is only populated when Kind is "image".
    ImageOptions:
      title: ImageOptions
      type: object
      properties:
        Subpath:
          type: string
          description: >-
            Source path inside the image. Must be relative without any back
            traversals.
          examples:
            - dir-inside-image/subdirectory
      description: Optional configuration for the `image` type.
    ImagePruneResponse:
      title: ImagePruneResponse
      type: object
      properties:
        ImagesDeleted:
          type: array
          items:
            $ref: '#/components/schemas/ImageDeleteResponseItem'
          description: Images that were deleted
        SpaceReclaimed:
          type: integer
          description: Disk space reclaimed in bytes
          contentEncoding: int64
    ImageSearchResponseItem:
      title: ImageSearchResponseItem
      type: object
      properties:
        description:
          type: string
        is_official:
          type: boolean
        is_automated:
          type: boolean
          description: >-
            Whether this repository has automated builds enabled.


            <p><br /></p>


            > **Deprecated**: This field is deprecated and will always be
            "false".
          examples:
            - false
        name:
          type: string
        star_count:
          type: integer
          contentEncoding: int32
    Info:
      title: Info
      type: object
      properties:
        CapacityBytes:
          type: integer
          description: |-
            The capacity of the volume in bytes. A value of 0 indicates that
            the capacity is unknown.
          contentEncoding: int64
        VolumeContext:
          type: object
          additionalProperties:
            type: string
          description: |-
            A map of strings to strings returned from the storage plugin when
            the volume is created.
        VolumeID:
          type: string
          description: |-
            The ID of the volume as returned by the CSI storage plugin. This
            is distinct from the volume's ID as provided by Docker. This ID
            is never used by the user when communicating with Docker to refer
            to this volume. If the ID is blank, then the Volume has not been
            successfully created in the plugin yet.
        AccessibleTopology:
          type: array
          items:
            type: string
          description: The topology this volume is actually accessible from.
      description: Information about the global status of the volume.
    Interface:
      title: Interface
      required:
        - Types
        - Socket
      type: object
      properties:
        Types:
          type: array
          items:
            type: string
          description: ''
          examples:
            - - docker.volumedriver/1.0
        Socket:
          type: string
          examples:
            - plugins.sock
        ProtocolScheme:
          allOf:
            - $ref: '#/components/schemas/ProtocolScheme'
            - description: Protocol to use for clients connecting to the plugin.
      description: The interface between Docker and the plugin
    Isolation:
      title: Isolation
      enum:
        - default
        - process
        - hyperv
      type: string
      description: Isolation technology of the container. (Windows only)
    Isolation1:
      title: Isolation1
      enum:
        - default
        - process
        - hyperv
      type: string
      description: |-
        Isolation technology of the containers running the service.
        (Windows only)
    Isolation2:
      title: Isolation2
      enum:
        - default
        - hyperv
        - process
      type: string
      description: >-
        Represents the isolation technology to use as a default for containers.

        The supported values are platform-specific.


        If no isolation value is specified on daemon start, on Windows client,

        the default is `hyperv`, and on Windows server, the default is
        `process`.


        This option is currently not used on other platforms.
    JobStatus:
      title: JobStatus
      type: object
      properties:
        JobIteration:
          allOf:
            - $ref: '#/components/schemas/ObjectVersion'
            - description: >-
                The version number of the object such as node, service, etc.
                This is needed

                to avoid conflicting writes. The client must send the version
                number along

                with the modified specification when updating these objects.


                This approach ensures safe concurrency and determinism in that
                the change

                on the object may not be applied if the version number has
                changed from the

                last read. In other words, if two update requests specify the
                same base

                version, only one of the requests can succeed. As a result, two
                separate

                update requests that happen at the same time will not
                unintentionally

                overwrite each other.
        LastExecution:
          type: string
          description: |-
            The last time, as observed by the server, that this job was
            started.
      description: |-
        The status of the service when it is in one of ReplicatedJob or
        GlobalJob modes. Absent on Replicated and Global mode services. The
        JobIteration is an ObjectVersion, but unlike the Service's version,
        does not need to be sent with an update request.
    Kind:
      title: Kind
      enum:
        - image
        - attestation
        - unknown
      type: string
      description: >-
        The kind of the manifest.


        kind         | description

        -------------|-----------------------------------------------------------

        image        | Image manifest that can be used to start a container.

        attestation  | Attestation manifest produced by the Buildkit builder for
        a specific image manifest.
      examples:
        - image
    Linux:
      title: Linux
      required:
        - Capabilities
        - AllowAllDevices
        - Devices
      type: object
      properties:
        Capabilities:
          type: array
          items:
            type: string
          description: ''
          examples:
            - - CAP_SYS_ADMIN
              - CAP_SYSLOG
        AllowAllDevices:
          type: boolean
          examples:
            - false
        Devices:
          type: array
          items:
            $ref: '#/components/schemas/PluginDevice'
          description: ''
    LogConfig:
      title: LogConfig
      type: object
      properties:
        Type:
          allOf:
            - $ref: '#/components/schemas/Type3'
            - description: |-
                Name of the logging driver used for the container or "none"
                if logging is disabled.
        Config:
          type: object
          additionalProperties:
            type: string
          description: Driver-specific configuration options for the logging driver.
          examples:
            - max-file: '5'
              max-size: 10m
      description: The logging configuration for this container
    LogDriver:
      title: LogDriver
      type: object
      properties:
        Name:
          type: string
          description: The log driver to use as a default for new tasks.
          examples:
            - json-file
        Options:
          type: object
          additionalProperties:
            type: string
          description: |-
            Driver-specific options for the selected log driver, specified
            as key/value pairs.
          examples:
            - max-file: '10'
              max-size: 100m
      description: |-
        The log driver to use for tasks created in the orchestrator if
        unspecified by a service.

        Updating this value only affects new tasks. Existing tasks continue
        to use their previously configured log driver until recreated.
    LogDriver1:
      title: LogDriver1
      type: object
      properties:
        Name:
          type: string
        Options:
          type: object
          additionalProperties:
            type: string
      description: |-
        Specifies the log driver to use for tasks created from this spec. If
        not present, the default one for the swarm will be used, finally
        falling back to the engine default if not specified.
    Metadata:
      title: Metadata
      type: object
      properties:
        LastTagTime:
          type: string
          description: >-
            Date and time at which the image was last tagged in

            [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format with
            nano-seconds.


            This information is only available if the image was tagged locally,

            and omitted otherwise.
          examples:
            - '2022-02-28T14:40:02.623Z'
      description: |-
        Additional metadata of the image in the local cache. This information
        is local to the daemon, and not part of the image itself.
    Mode:
      title: Mode
      enum:
        - default
        - unconfined
        - custom
      type: string
    Mode1:
      title: Mode1
      enum:
        - default
        - disabled
      type: string
    Mode2:
      title: Mode2
      type: object
      properties:
        Replicated:
          $ref: '#/components/schemas/Replicated'
        Global:
          type: object
        ReplicatedJob:
          allOf:
            - $ref: '#/components/schemas/ReplicatedJob'
            - description: >-
                The mode used for services with a finite number of tasks that
                run

                to a completed state.
        GlobalJob:
          type: object
          description: |-
            The mode used for services which run a task to the completed state
            on each valid node.
      description: Scheduling mode for the service.
    Mode3:
      title: Mode3
      enum:
        - vip
        - dnsrr
      type: string
      description: The mode of resolution to use for internal load balancing between tasks.
    Name:
      title: Name
      enum:
        - 'no'
        - always
        - unless-stopped
        - on-failure
      type: string
      description: >-
        - Empty string means not to restart

        - `no` Do not automatically restart

        - `always` Always restart

        - `unless-stopped` Restart always except when the user has manually
        stopped the container

        - `on-failure` Restart only when the container exit code is non-zero
    NamedResourceSpec:
      title: NamedResourceSpec
      type: object
      properties:
        Kind:
          type: string
        Value:
          type: string
    Namespaces:
      title: Namespaces
      type: object
      properties:
        Containers:
          type: string
          description: |-
            The default containerd namespace used for containers managed
            by the daemon.

            The default namespace for containers is "moby", but will be
            suffixed with the `<uid>.<gid>` of the remapped `root` if
            user-namespaces are enabled and the containerd image-store
            is used.
          default: moby
          examples:
            - moby
        Plugins:
          type: string
          description: |-
            The default containerd namespace used for plugins managed by
            the daemon.

            The default namespace for plugins is "plugins.moby", but will be
            suffixed with the `<uid>.<gid>` of the remapped `root` if
            user-namespaces are enabled and the containerd image-store
            is used.
          default: plugins.moby
          examples:
            - plugins.moby
      description: |-
        The namespaces that the daemon uses for running containers and
        plugins in containerd. These namespaces can be configured in the
        daemon configuration, and are considered to be used exclusively
        by the daemon, Tampering with the containerd instance may cause
        unexpected behavior.

        As these namespaces are considered to be exclusively accessed
        by the daemon, it is not recommended to change these values,
        or to change them to a value that is used by other systems,
        such as cri-containerd.
    Network1:
      title: Network1
      required:
        - Type
      type: object
      properties:
        Type:
          type: string
          examples:
            - host
    NetworkAttachmentSpec:
      title: NetworkAttachmentSpec
      type: object
      properties:
        ContainerID:
          type: string
          description: ID of the container represented by this task
      description: |-
        Read-only spec type for non-swarm containers attached to swarm overlay
        networks.

        <p><br /></p>

        > **Note**: ContainerSpec, NetworkAttachmentSpec, and PluginSpec are
        > mutually exclusive. PluginSpec is only used when the Runtime field
        > is set to `plugin`. NetworkAttachmentSpec is used when the Runtime
        > field is set to `attachment`.
    NetworkCreateRequest:
      title: NetworkCreateRequest
      required:
        - Name
      type: object
      properties:
        Name:
          type: string
          description: The network's name.
          examples:
            - my_network
        Driver:
          type: string
          description: Name of the network driver plugin to use.
          default: bridge
          examples:
            - bridge
        Scope:
          type: string
          description: |-
            The level at which the network exists (e.g. `swarm` for cluster-wide
            or `local` for machine level).
        Internal:
          type: boolean
          description: Restrict external access to the network.
        Attachable:
          type: boolean
          description: |-
            Globally scoped network is manually attachable by regular
            containers from workers in swarm mode.
          examples:
            - true
        Ingress:
          type: boolean
          description: |-
            Ingress network is the network which provides the routing-mesh
            in swarm mode.
          examples:
            - false
        ConfigOnly:
          type: boolean
          description: |-
            Creates a config-only network. Config-only networks are placeholder
            networks for network configurations to be used by other networks.
            Config-only networks cannot be used directly to run containers
            or services.
          default: false
          examples:
            - false
        ConfigFrom:
          allOf:
            - $ref: '#/components/schemas/ConfigReference'
            - description: |-
                The config-only network source to provide the configuration for
                this network.
        IPAM:
          $ref: '#/components/schemas/IPAM'
        EnableIPv4:
          type: boolean
          description: Enable IPv4 on the network.
          examples:
            - true
        EnableIPv6:
          type: boolean
          description: Enable IPv6 on the network.
          examples:
            - true
        Options:
          type: object
          additionalProperties:
            type: string
          description: Network specific options to be used by the drivers.
          examples:
            - com.docker.network.bridge.default_bridge: 'true'
              com.docker.network.bridge.enable_icc: 'true'
              com.docker.network.bridge.enable_ip_masquerade: 'true'
              com.docker.network.bridge.host_binding_ipv4: 0.0.0.0
              com.docker.network.bridge.name: docker0
              com.docker.network.driver.mtu: '1500'
        Labels:
          type: object
          additionalProperties:
            type: string
          description: User-defined key/value metadata.
          examples:
            - com.example.some-label: some-value
              com.example.some-other-label: some-other-value
    NetworkPruneResponse:
      title: NetworkPruneResponse
      type: object
      properties:
        NetworksDeleted:
          type: array
          items:
            type: string
          description: Networks that were deleted
    NetworkSettings1:
      title: NetworkSettings1
      type: object
      properties:
        Networks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EndpointSettings'
          description: |-
            Summary of network-settings for each network the container is
            attached to.
      description: Summary of the container's network settings
    Orchestration:
      title: Orchestration
      type: object
      properties:
        TaskHistoryRetentionLimit:
          type: integer
          description: |-
            The number of historic tasks to keep per instance or node. If
            negative, never remove completed or failed tasks.
          contentEncoding: int64
          examples:
            - 10
      description: Orchestration configuration.
    Order:
      title: Order
      enum:
        - stop-first
        - start-first
      type: string
      description: |-
        The order of operations when rolling out an updated task. Either
        the old task is shut down before the new task is started, or the
        new task is started before the old task is shut down.
    Order1:
      title: Order1
      enum:
        - stop-first
        - start-first
      type: string
      description: |-
        The order of operations when rolling back a task. Either the old
        task is shut down before the new task is started, or the new task
        is started before the old task is shut down.
    Placement:
      title: Placement
      type: object
      properties:
        Constraints:
          type: array
          items:
            type: string
          description: >-
            An array of constraint expressions to limit the set of nodes where

            a task can be scheduled. Constraint expressions can either use a

            _match_ (`==`) or _exclude_ (`!=`) rule. Multiple constraints find

            nodes that satisfy every expression (AND match). Constraints can

            match node or Docker Engine labels as follows:


            node attribute       | matches                        | example

            ---------------------|--------------------------------|-----------------------------------------------

            `node.id`            | Node ID                        |
            `node.id==2ivku8v2gvtg4`

            `node.hostname`      | Node hostname                  |
            `node.hostname!=node-2`

            `node.role`          | Node role (`manager`/`worker`) |
            `node.role==manager`

            `node.platform.os`   | Node operating system          |
            `node.platform.os==windows`

            `node.platform.arch` | Node architecture              |
            `node.platform.arch==x86_64`

            `node.labels`        | User-defined node labels       |
            `node.labels.security==high`

            `engine.labels`      | Docker Engine's labels         |
            `engine.labels.operatingsystem==ubuntu-24.04`


            `engine.labels` apply to Docker Engine labels like operating system,

            drivers, etc. Swarm administrators add `node.labels` for operational

            purposes by using the [`node update
            endpoint`](#operation/NodeUpdate).
          examples:
            - - node.hostname!=node3.corp.example.com
              - node.role!=manager
              - node.labels.type==production
              - node.platform.os==linux
              - node.platform.arch==x86_64
        Preferences:
          type: array
          items:
            $ref: '#/components/schemas/Preference'
          description: |-
            Preferences provide a way to make the scheduler aware of factors
            such as topology. They are provided in order from highest to
            lowest precedence.
          examples:
            - - Spread:
                  SpreadDescriptor: node.labels.datacenter
              - Spread:
                  SpreadDescriptor: node.labels.rack
        MaxReplicas:
          type: integer
          description: |-
            Maximum number of replicas for per node (default value is 0, which
            is unlimited)
          contentEncoding: int64
          default: 0
        Platforms:
          type: array
          items:
            $ref: '#/components/schemas/Platform'
          description: |-
            Platforms stores all the platforms that the service's image can
            run on. This field is used in the platform filter for scheduling.
            If empty, then the platform filter is off, meaning there are no
            scheduling restrictions.
    Platform1:
      title: Platform1
      required:
        - Name
      type: object
      properties:
        Name:
          type: string
    Plugin1:
      title: Plugin1
      type: object
      properties:
        Type:
          type: string
        Name:
          type: string
    PluginSpec:
      title: PluginSpec
      type: object
      properties:
        Name:
          type: string
          description: The name or 'alias' to use for the plugin.
        Remote:
          type: string
          description: The plugin image reference to use.
        Disabled:
          type: boolean
          description: Disable the plugin once scheduled.
        PluginPrivilege:
          type: array
          items:
            $ref: '#/components/schemas/PluginPrivilege'
          description: ''
      description: |-
        Plugin spec for the service.  *(Experimental release only.)*

        <p><br /></p>

        > **Note**: ContainerSpec, NetworkAttachmentSpec, and PluginSpec are
        > mutually exclusive. PluginSpec is only used when the Runtime field
        > is set to `plugin`. NetworkAttachmentSpec is used when the Runtime
        > field is set to `attachment`.
    Preference:
      title: Preference
      type: object
      properties:
        Spread:
          $ref: '#/components/schemas/Spread'
    Privileges:
      title: Privileges
      type: object
      properties:
        CredentialSpec:
          allOf:
            - $ref: '#/components/schemas/CredentialSpec'
            - description: CredentialSpec for managed service account (Windows only)
        SELinuxContext:
          allOf:
            - $ref: '#/components/schemas/SELinuxContext'
            - description: SELinux labels of the container
        Seccomp:
          allOf:
            - $ref: '#/components/schemas/Seccomp'
            - description: Options for configuring seccomp on the container
        AppArmor:
          allOf:
            - $ref: '#/components/schemas/AppArmor'
            - description: Options for configuring AppArmor on the container
        NoNewPrivileges:
          type: boolean
          description: Configuration of the no_new_privs bit in the container
      description: Security options for the container
    Propagation:
      title: Propagation
      enum:
        - private
        - rprivate
        - shared
        - rshared
        - slave
        - rslave
      type: string
      description: >-
        A propagation mode with the value `[r]private`, `[r]shared`, or
        `[r]slave`.
    Protocol:
      title: Protocol
      const: cfssl
      type: string
      description: |-
        Protocol for communication with the external CA (currently
        only `cfssl` is supported).
    Protocol1:
      title: Protocol1
      enum:
        - tcp
        - udp
        - sctp
      type: string
    ProtocolScheme:
      title: ProtocolScheme
      const: moby.plugins.http/v1
      type: string
      description: Protocol to use for clients connecting to the plugin.
    PublishMode:
      title: PublishMode
      enum:
        - ingress
        - host
      type: string
      description: |-
        The mode in which port is published.

        <p><br /></p>

        - "ingress" makes the target port accessible on every node,
          regardless of whether there is a task for the service running on
          that node or not.
        - "host" bypasses the routing mesh and publish the port directly on
          the swarm node where that service is running.
      examples:
        - ingress
    PublishStatus:
      title: PublishStatus
      type: object
      properties:
        NodeID:
          type: string
          description: The ID of the Swarm node the volume is published on.
        State:
          allOf:
            - $ref: '#/components/schemas/State'
            - description: >-
                The published state of the volume.

                * `pending-publish` The volume should be published to this node,
                but the call to the controller plugin to do so has not yet been
                successfully completed.

                * `published` The volume is published successfully to the node.

                * `pending-node-unpublish` The volume should be unpublished from
                the node, and the manager is awaiting confirmation from the
                worker that it has done so.

                * `pending-controller-unpublish` The volume is successfully
                unpublished from the node, but has not yet been successfully
                unpublished on the controller.
        PublishContext:
          type: object
          additionalProperties:
            type: string
          description: |-
            A map of strings to strings returned by the CSI controller
            plugin when a volume is published.
    Raft:
      title: Raft
      type: object
      properties:
        SnapshotInterval:
          type: integer
          description: The number of log entries between snapshots.
          contentEncoding: int32
          examples:
            - 10000
        KeepOldSnapshots:
          type: integer
          description: The number of snapshots to keep beyond the current snapshot.
          contentEncoding: int32
        LogEntriesForSlowFollowers:
          type: integer
          description: |-
            The number of log entries to keep around to sync up slow followers
            after a snapshot is created.
          contentEncoding: int32
          examples:
            - 500
        ElectionTick:
          type: integer
          description: |-
            The number of ticks that a follower will wait for a message from
            the leader before becoming a candidate and starting an election.
            `ElectionTick` must be greater than `HeartbeatTick`.

            A tick currently defaults to one second, so these translate
            directly to seconds currently, but this is NOT guaranteed.
          contentEncoding: int32
          examples:
            - 3
        HeartbeatTick:
          type: integer
          description: |-
            The number of ticks between heartbeats. Every HeartbeatTick ticks,
            the leader will send a heartbeat to the followers.

            A tick currently defaults to one second, so these translate
            directly to seconds currently, but this is NOT guaranteed.
          contentEncoding: int32
          examples:
            - 1
      description: Raft configuration.
    registryAuthFrom:
      title: registryAuthFrom
      enum:
        - spec
        - previous-spec
      type: string
    Replicated:
      title: Replicated
      type: object
      properties:
        Replicas:
          type: integer
          contentEncoding: int64
    ReplicatedJob:
      title: ReplicatedJob
      type: object
      properties:
        MaxConcurrent:
          type: integer
          description: The maximum number of replicas to run simultaneously.
          contentEncoding: int64
          default: 1
        TotalCompletions:
          type: integer
          description: |-
            The total number of replicas desired to reach the Completed
            state. If unset, will default to the value of `MaxConcurrent`
          contentEncoding: int64
      description: |-
        The mode used for services with a finite number of tasks that run
        to a completed state.
    Resources1:
      title: Resources1
      type: object
      properties:
        Limits:
          allOf:
            - $ref: '#/components/schemas/Limit'
            - description: >-
                An object describing a limit on resources which can be requested
                by a task.
        Reservations:
          allOf:
            - $ref: '#/components/schemas/ResourceObject'
            - description: >-
                An object describing the resources which can be advertised by a
                node and

                requested by a task.
        SwapBytes:
          minimum: -1
          type: integer
          description: >-
            Amount of swap in bytes - can only be used together with a memory
            limit.

            If not specified, the default behaviour is to grant a swap space
            twice

            as big as the memory limit.

            Set to -1 to enable unlimited swap.
          contentEncoding: int64
        MemorySwappiness:
          maximum: 100
          minimum: -1
          type: integer
          description: >-
            Tune the service's containers' memory swappiness (0 to 100).

            If not specified, defaults to the containers' OS' default, generally
            60,

            or whatever value was predefined in the image.

            Set to -1 to unset a previously set value.
          contentEncoding: int64
      description: |-
        Resource requirements which apply to each individual container created
        as part of the service.
    RestartPolicy1:
      title: RestartPolicy1
      type: object
      properties:
        Condition:
          allOf:
            - $ref: '#/components/schemas/Condition'
            - description: Condition for restart.
        Delay:
          type: integer
          description: Delay between restart attempts.
          contentEncoding: int64
        MaxAttempts:
          type: integer
          description: |-
            Maximum attempts to restart a given container before giving up
            (default value is 0, which is ignored).
          contentEncoding: int64
          default: 0
        Window:
          type: integer
          description: |-
            Windows is the time window used to evaluate the restart policy
            (default value is 0, which is unbounded).
          contentEncoding: int64
          default: 0
      description: |-
        Specification for the restart policy which applies to containers
        created as part of this service.
    Role:
      title: Role
      enum:
        - worker
        - manager
      type: string
      description: Role of the node.
      examples:
        - manager
    RollbackConfig:
      title: RollbackConfig
      type: object
      properties:
        Parallelism:
          type: integer
          description: |-
            Maximum number of tasks to be rolled back in one iteration (0 means
            unlimited parallelism).
          contentEncoding: int64
        Delay:
          type: integer
          description: Amount of time between rollback iterations, in nanoseconds.
          contentEncoding: int64
        FailureAction:
          allOf:
            - $ref: '#/components/schemas/FailureAction1'
            - description: |-
                Action to take if an rolled back task fails to run, or stops
                running during the rollback.
        Monitor:
          type: integer
          description: |-
            Amount of time to monitor each rolled back task for failures, in
            nanoseconds.
          contentEncoding: int64
        MaxFailureRatio:
          type: number
          description: |-
            The fraction of tasks that may fail during a rollback before the
            failure action is invoked, specified as a floating point number
            between 0 and 1.
          default: 0
        Order:
          allOf:
            - $ref: '#/components/schemas/Order1'
            - description: >-
                The order of operations when rolling back a task. Either the old

                task is shut down before the new task is started, or the new
                task

                is started before the old task is shut down.
      description: Specification for the rollback strategy of the service.
    RootFS:
      title: RootFS
      required:
        - Type
      type: object
      properties:
        Type:
          type: string
          examples:
            - layers
        Layers:
          type: array
          items:
            type: string
          description: ''
          examples:
            - - >-
                sha256:1834950e52ce4d5a88a1bbd131c537f4d0e56d10ff0dd69e66be3b7dfa9df7e6
              - >-
                sha256:5f70bf18a086007016e948b04aed3b82103a36bea41755b6cddfaf10ace3c6ef
      description: Information about the image's RootFS, including the layer IDs.
    Rootfs1:
      title: Rootfs1
      type: object
      properties:
        type:
          type: string
          examples:
            - layers
        diff_ids:
          type: array
          items:
            type: string
          description: ''
          examples:
            - - >-
                sha256:675532206fbf3030b8458f88d6e26d4eb1577688a25efec97154c94e8b6b4887
              - >-
                sha256:e216a057b1cb1efc11f8a268f37ef62083e70b1b38323ba252e25ac88904a7e8
    Scope:
      title: Scope
      enum:
        - local
        - global
      type: string
      description: |-
        The level at which the volume exists. Either `global` for cluster-wide,
        or `local` for machine level.
      examples:
        - local
    Scope1:
      title: Scope1
      enum:
        - single
        - multi
      type: string
      description: >-
        The set of nodes this volume can be used on at one time.

        - `single` The volume may only be scheduled to one node at a time.

        - `multi` the volume may be scheduled to any supported number of nodes
        at a time.
    Scope2:
      title: Scope2
      enum:
        - local
        - swarm
      type: string
      description: |-
        Scope of the event. Engine events are `local` scope. Cluster (Swarm)
        events are `swarm` scope.
    Seccomp:
      title: Seccomp
      type: object
      properties:
        Mode:
          $ref: '#/components/schemas/Mode'
        Profile:
          type: string
          description: The custom seccomp profile as a json object
      description: Options for configuring seccomp on the container
    Secret1:
      title: Secret1
      type: object
      properties:
        File:
          allOf:
            - $ref: '#/components/schemas/File'
            - description: File represents a specific target that is backed by a file.
        SecretID:
          type: string
          description: |-
            SecretID represents the ID of the specific secret that we're
            referencing.
        SecretName:
          type: string
          description: |-
            SecretName is the name of the secret that this references,
            but this is just provided for lookup/display purposes. The
            secret in the reference will be identified by its ID.
    Secret3:
      title: Secret3
      type: object
      properties:
        Key:
          type: string
          description: |-
            Key is the name of the key of the key-value pair passed to
            the plugin.
        Secret:
          type: string
          description: |-
            Secret is the swarm Secret object from which to read data.
            This can be a Secret name or ID. The Secret data is
            retrieved by swarm and used as the value of the key-value
            pair passed to the plugin.
      description: |-
        One cluster volume secret entry. Defines a key-value pair that
        is passed to the plugin.
    SELinuxContext:
      title: SELinuxContext
      type: object
      properties:
        Disable:
          type: boolean
          description: Disable SELinux
        User:
          type: string
          description: SELinux user label
        Role:
          type: string
          description: SELinux role label
        Type:
          type: string
          description: SELinux type label
        Level:
          type: string
          description: SELinux level label
      description: SELinux labels of the container
    ServiceStatus:
      title: ServiceStatus
      type: object
      properties:
        RunningTasks:
          type: integer
          description: The number of tasks for the service currently in the Running state.
          contentEncoding: int32
          examples:
            - 7
        DesiredTasks:
          type: integer
          description: |-
            The number of tasks for the service desired to be running.
            For replicated services, this is the replica count from the
            service spec. For global services, this is computed by taking
            count of all tasks for the service with a Desired State other
            than Shutdown.
          contentEncoding: int32
          examples:
            - 10
        CompletedTasks:
          type: integer
          description: |-
            The number of tasks for a job that are in the Completed state.
            This field must be cross-referenced with the service type, as the
            value of 0 may mean the service is not in a job mode, or it may
            mean the job-mode service has no tasks yet Completed.
          contentEncoding: int32
      description: |-
        The status of the service's tasks. Provided only when requested as
        part of a ServiceList operation.
    Settings:
      title: Settings
      required:
        - Mounts
        - Env
        - Args
        - Devices
      type: object
      properties:
        Mounts:
          type: array
          items:
            $ref: '#/components/schemas/PluginMount'
          description: ''
        Env:
          type: array
          items:
            type: string
          description: ''
          examples:
            - - DEBUG=0
        Args:
          type: array
          items:
            type: string
          description: ''
        Devices:
          type: array
          items:
            $ref: '#/components/schemas/PluginDevice'
          description: ''
      description: user-configurable settings for the plugin.
    Sharing:
      title: Sharing
      enum:
        - none
        - readonly
        - onewriter
        - all
      type: string
      description: >-
        The number and way that different tasks can use this volume

        at one time.

        - `none` The volume may only be used by one task at a time.

        - `readonly` The volume may be used by any number of tasks, but they all
        must mount the volume as readonly

        - `onewriter` The volume may be used by any number of tasks, but only
        one may mount it as read/write.

        - `all` The volume may have any number of readers and writers.
    Size:
      title: Size
      required:
        - Total
        - Content
      type: object
      properties:
        Total:
          type: integer
          description: |-
            Total is the total size (in bytes) of all the locally present
            data (both distributable and non-distributable) that's related to
            this manifest and its children.
            This equal to the sum of [Content] size AND all the sizes in the
            [Size] struct present in the Kind-specific data struct.
            For example, for an image kind (Kind == "image")
            this would include the size of the image content and unpacked
            image snapshots ([Size.Content] + [ImageData.Size.Unpacked]).
          contentEncoding: int64
          examples:
            - 8213251
        Content:
          type: integer
          description: |-
            Content is the size (in bytes) of all the locally present
            content in the content store (e.g. image config, layers)
            referenced by this manifest and its children.
            This only includes blobs in the content store.
          contentEncoding: int64
          examples:
            - 3987495
    Size1:
      title: Size1
      required:
        - Unpacked
      type: object
      properties:
        Unpacked:
          type: integer
          description: >-
            Unpacked is the size (in bytes) of the locally unpacked

            (uncompressed) image content that's directly usable by the
            containers

            running this image.

            It's independent of the distributable content - e.g.

            the image might still have an unpacked data that's still used by

            some container even when the distributable/compressed content is

            already gone.
          contentEncoding: int64
          examples:
            - 3987495
    Spread:
      title: Spread
      type: object
      properties:
        SpreadDescriptor:
          type: string
          description: label descriptor, such as `engine.labels.az`.
    State:
      title: State
      enum:
        - pending-publish
        - published
        - pending-node-unpublish
        - pending-controller-unpublish
      type: string
      description: >-
        The published state of the volume.

        * `pending-publish` The volume should be published to this node, but the
        call to the controller plugin to do so has not yet been successfully
        completed.

        * `published` The volume is published successfully to the node.

        * `pending-node-unpublish` The volume should be unpublished from the
        node, and the manager is awaiting confirmation from the worker that it
        has done so.

        * `pending-controller-unpublish` The volume is successfully unpublished
        from the node, but has not yet been successfully unpublished on the
        controller.
    State1:
      title: State1
      enum:
        - updating
        - paused
        - completed
      type: string
    State2:
      title: State2
      enum:
        - created
        - running
        - paused
        - restarting
        - exited
        - removing
        - dead
      type: string
      description: The state of this container.
      examples:
        - running
    Status:
      title: Status
      enum:
        - none
        - starting
        - healthy
        - unhealthy
      type: string
      description: |-
        Status is one of `none`, `starting`, `healthy` or `unhealthy`

        - "none"      Indicates there is no healthcheck
        - "starting"  Starting indicates that the container is not yet ready
        - "healthy"   Healthy indicates that the container is running correctly
        - "unhealthy" Unhealthy indicates that the container has a problem
      examples:
        - healthy
    Status1:
      title: Status1
      enum:
        - created
        - running
        - paused
        - restarting
        - removing
        - exited
        - dead
      type: string
      description: |-
        String representation of the container state. Can be one of "created",
        "running", "paused", "restarting", "removing", "exited", or "dead".
      examples:
        - running
    Status2:
      title: Status2
      enum:
        - none
        - starting
        - healthy
        - unhealthy
      type: string
      description: the health status of the container
      examples:
        - healthy
    SwarmInitRequest:
      title: SwarmInitRequest
      type: object
      properties:
        ListenAddr:
          type: string
          description: |-
            Listen address used for inter-manager communication, as well
            as determining the networking interface used for the VXLAN
            Tunnel Endpoint (VTEP). This can either be an address/port
            combination in the form `192.168.1.1:4567`, or an interface
            followed by a port number, like `eth0:4567`. If the port number
            is omitted, the default swarm listening port is used.
        AdvertiseAddr:
          type: string
          description: |-
            Externally reachable address advertised to other nodes. This
            can either be an address/port combination in the form
            `192.168.1.1:4567`, or an interface followed by a port number,
            like `eth0:4567`. If the port number is omitted, the port
            number from the listen address is used. If `AdvertiseAddr` is
            not specified, it will be automatically detected when possible.
        DataPathAddr:
          type: string
          description: |-
            Address or interface to use for data path traffic (format:
            `<ip|interface>`), for example,  `192.168.1.1`, or an interface,
            like `eth0`. If `DataPathAddr` is unspecified, the same address
            as `AdvertiseAddr` is used.

            The `DataPathAddr` specifies the address that global scope
            network drivers will publish towards other  nodes in order to
            reach the containers running on this node. Using this parameter
            it is possible to separate the container data traffic from the
            management traffic of the cluster.
        DataPathPort:
          type: integer
          description: |-
            DataPathPort specifies the data path port number for data traffic.
            Acceptable port range is 1024 to 49151.
            if no port is set or is set to 0, default port 4789 will be used.
          contentEncoding: int32
        DefaultAddrPool:
          type: array
          items:
            type: string
          description: |-
            Default Address Pool specifies default subnet pools for global
            scope networks.
        ForceNewCluster:
          type: boolean
          description: Force creation of a new swarm.
        SubnetSize:
          type: integer
          description: |-
            SubnetSize specifies the subnet size of the networks created
            from the default subnet pool.
          contentEncoding: int32
        Spec:
          allOf:
            - $ref: '#/components/schemas/SwarmSpec'
            - description: User modifiable swarm configuration.
      examples:
        - ListenAddr: 0.0.0.0:2377
          AdvertiseAddr: 192.168.1.1:2377
          DataPathPort: 4789
          DefaultAddrPool:
            - 10.10.0.0/8
            - 20.20.0.0/8
          SubnetSize: 24
          ForceNewCluster: false
          Spec:
            Orchestration: {}
            Raft: {}
            Dispatcher: {}
            CAConfig: {}
            EncryptionConfig:
              AutoLockManagers: false
    SwarmJoinRequest:
      title: SwarmJoinRequest
      type: object
      properties:
        ListenAddr:
          type: string
          description: |-
            Listen address used for inter-manager communication if the node
            gets promoted to manager, as well as determining the networking
            interface used for the VXLAN Tunnel Endpoint (VTEP).
        AdvertiseAddr:
          type: string
          description: |-
            Externally reachable address advertised to other nodes. This
            can either be an address/port combination in the form
            `192.168.1.1:4567`, or an interface followed by a port number,
            like `eth0:4567`. If the port number is omitted, the port
            number from the listen address is used. If `AdvertiseAddr` is
            not specified, it will be automatically detected when possible.
        DataPathAddr:
          type: string
          description: |-
            Address or interface to use for data path traffic (format:
            `<ip|interface>`), for example,  `192.168.1.1`, or an interface,
            like `eth0`. If `DataPathAddr` is unspecified, the same address
            as `AdvertiseAddr` is used.

            The `DataPathAddr` specifies the address that global scope
            network drivers will publish towards other nodes in order to
            reach the containers running on this node. Using this parameter
            it is possible to separate the container data traffic from the
            management traffic of the cluster.
        RemoteAddrs:
          type: array
          items:
            type: string
          description: Addresses of manager nodes already participating in the swarm.
        JoinToken:
          type: string
          description: Secret token for joining this swarm.
      examples:
        - ListenAddr: 0.0.0.0:2377
          AdvertiseAddr: 192.168.1.1:2377
          DataPathAddr: 192.168.1.1
          RemoteAddrs:
            - node1:2377
          JoinToken: >-
            SWMTKN-1-3pu6hszjas19xyp7ghgosyx9k8atbfcr8p2is99znpy26u2lkl-7p73s1dx5in4tatdymyhg9hu2
    SwarmUnlockRequest:
      title: SwarmUnlockRequest
      type: object
      properties:
        UnlockKey:
          type: string
          description: The swarm's unlock key.
      examples:
        - UnlockKey: SWMKEY-1-7c37Cc8654o6p38HnroywCi19pllOnGtbdZEgtKxZu8
    SystemDataUsageResponse:
      title: SystemDataUsageResponse
      type: object
      properties:
        ImagesDiskUsage:
          allOf:
            - $ref: '#/components/schemas/ImagesDiskUsage'
            - description: represents system data usage for image resources.
        ContainersDiskUsage:
          allOf:
            - $ref: '#/components/schemas/ContainersDiskUsage'
            - description: >-
                represents system data usage information for container
                resources.
        VolumesDiskUsage:
          allOf:
            - $ref: '#/components/schemas/VolumesDiskUsage'
            - description: represents system data usage for volume resources.
        BuildCacheDiskUsage:
          allOf:
            - $ref: '#/components/schemas/BuildCacheDiskUsage'
            - description: represents system data usage for build cache resources.
    TaskDefaults:
      title: TaskDefaults
      type: object
      properties:
        LogDriver:
          allOf:
            - $ref: '#/components/schemas/LogDriver'
            - description: >-
                The log driver to use for tasks created in the orchestrator if

                unspecified by a service.


                Updating this value only affects new tasks. Existing tasks
                continue

                to use their previously configured log driver until recreated.
      description: Defaults for creating tasks in this cluster.
    TmpfsOptions:
      title: TmpfsOptions
      type: object
      properties:
        SizeBytes:
          type: integer
          description: The size for the tmpfs mount in bytes.
          contentEncoding: int64
        Mode:
          type: integer
          description: The permission mode for the tmpfs mount in an integer.
          contentEncoding: int32
        Options:
          type: array
          items:
            type: array
            items:
              type: string
          description: |-
            The options to be passed to the tmpfs mount. An array of arrays.
            Flag options should be provided as 1-length arrays. Other types
            should be provided as as 2-length arrays, where the first item is
            the key and the second the value.
          examples:
            - - - noexec
      description: Optional configuration for the `tmpfs` type.
    Type:
      title: Type
      enum:
        - tcp
        - udp
        - sctp
      type: string
    Type1:
      title: Type1
      enum:
        - bind
        - volume
        - image
        - tmpfs
        - npipe
        - cluster
      type: string
      description: >-
        The mount type:


        - `bind` a mount of a file or directory from the host into the
        container.

        - `volume` a docker volume with the given `Name`.

        - `image` a docker image

        - `tmpfs` a `tmpfs`.

        - `npipe` a named pipe from the host into the container.

        - `cluster` a Swarm cluster volume
      examples:
        - volume
    Type2:
      title: Type2
      enum:
        - bind
        - volume
        - image
        - tmpfs
        - npipe
        - cluster
      type: string
      description: >-
        The mount type. Available types:


        - `bind` Mounts a file or directory from the host into the container.
        Must exist prior to creating the container.

        - `volume` Creates a volume with the given name and options (or uses a
        pre-existing volume with the same name and options). These are **not**
        removed when the container is removed.

        - `image` Mounts an image.

        - `tmpfs` Create a tmpfs with the given options. The mount source cannot
        be specified for tmpfs.

        - `npipe` Mounts a named pipe from the host into the container. Must
        exist prior to creating the container.

        - `cluster` a Swarm cluster volume
    Type3:
      title: Type3
      enum:
        - local
        - json-file
        - syslog
        - journald
        - gelf
        - fluentd
        - awslogs
        - splunk
        - etwlogs
        - none
      type: string
      description: |-
        Name of the logging driver used for the container or "none"
        if logging is disabled.
    Type4:
      title: Type4
      enum:
        - internal
        - frontend
        - source.local
        - source.git.checkout
        - exec.cachemount
        - regular
      type: string
      description: Cache record type.
      examples:
        - regular
    Type5:
      title: Type5
      enum:
        - builder
        - config
        - container
        - daemon
        - image
        - network
        - node
        - plugin
        - secret
        - service
        - volume
      type: string
      description: The type of object emitting the event
      examples:
        - container
    type6:
      title: type6
      enum:
        - container
        - image
        - volume
        - build-cache
      type: string
    Ulimit:
      title: Ulimit
      type: object
      properties:
        Name:
          type: string
          description: Name of ulimit
        Soft:
          type: integer
          description: Soft limit
          contentEncoding: int32
        Hard:
          type: integer
          description: Hard limit
          contentEncoding: int32
    UnlockKeyResponse:
      title: UnlockKeyResponse
      type: object
      properties:
        UnlockKey:
          type: string
          description: The swarm's unlock key.
      examples:
        - UnlockKey: SWMKEY-1-7c37Cc8654o6p38HnroywCi19pllOnGtbdZEgtKxZu8
    update:
      title: update
      type: object
      properties:
        CpuShares:
          type: integer
          description: |-
            An integer value representing this container's relative CPU weight
            versus other containers.
          contentEncoding: int32
        Memory:
          type: integer
          description: Memory limit in bytes.
          contentEncoding: int64
          default: 0
        CgroupParent:
          type: string
          description: >-
            Path to `cgroups` under which the container's `cgroup` is created.
            If

            the path is not absolute, the path is considered to be relative to
            the

            `cgroups` path of the init process. Cgroups are created if they do
            not

            already exist.
        BlkioWeight:
          maximum: 1000
          minimum: 0
          type: integer
          description: Block IO weight (relative weight).
          contentEncoding: int32
        BlkioWeightDevice:
          type: array
          items:
            $ref: '#/components/schemas/BlkioWeightDevice'
          description: |-
            Block IO weight (relative device weight) in the form:

            ```
            [{"Path": "device_path", "Weight": weight}]
            ```
        BlkioDeviceReadBps:
          type: array
          items:
            $ref: '#/components/schemas/ThrottleDevice'
          description: |-
            Limit read rate (bytes per second) from a device, in the form:

            ```
            [{"Path": "device_path", "Rate": rate}]
            ```
        BlkioDeviceWriteBps:
          type: array
          items:
            $ref: '#/components/schemas/ThrottleDevice'
          description: |-
            Limit write rate (bytes per second) to a device, in the form:

            ```
            [{"Path": "device_path", "Rate": rate}]
            ```
        BlkioDeviceReadIOps:
          type: array
          items:
            $ref: '#/components/schemas/ThrottleDevice'
          description: |-
            Limit read rate (IO per second) from a device, in the form:

            ```
            [{"Path": "device_path", "Rate": rate}]
            ```
        BlkioDeviceWriteIOps:
          type: array
          items:
            $ref: '#/components/schemas/ThrottleDevice'
          description: |-
            Limit write rate (IO per second) to a device, in the form:

            ```
            [{"Path": "device_path", "Rate": rate}]
            ```
        CpuPeriod:
          type: integer
          description: The length of a CPU period in microseconds.
          contentEncoding: int64
        CpuQuota:
          type: integer
          description: Microseconds of CPU time that the container can get in a CPU period.
          contentEncoding: int64
        CpuRealtimePeriod:
          type: integer
          description: |-
            The length of a CPU real-time period in microseconds. Set to 0 to
            allocate no time allocated to real-time tasks.
          contentEncoding: int64
        CpuRealtimeRuntime:
          type: integer
          description: |-
            The length of a CPU real-time runtime in microseconds. Set to 0 to
            allocate no time allocated to real-time tasks.
          contentEncoding: int64
        CpusetCpus:
          type: string
          description: CPUs in which to allow execution (e.g., `0-3`, `0,1`).
          examples:
            - 0-3
        CpusetMems:
          type: string
          description: |-
            Memory nodes (MEMs) in which to allow execution (0-3, 0,1). Only
            effective on NUMA systems.
        Devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceMapping'
          description: A list of devices to add to the container.
        DeviceCgroupRules:
          type: array
          items:
            type: string
          description: a list of cgroup rules to apply to the container
        DeviceRequests:
          type: array
          items:
            $ref: '#/components/schemas/DeviceRequest'
          description: A list of requests for devices to be sent to device drivers.
        MemoryReservation:
          type: integer
          description: Memory soft limit in bytes.
          contentEncoding: int64
        MemorySwap:
          type: integer
          description: |-
            Total memory limit (memory + swap). Set as `-1` to enable unlimited
            swap.
          contentEncoding: int64
        MemorySwappiness:
          maximum: 100
          minimum: 0
          type: integer
          description: |-
            Tune a container's memory swappiness behavior. Accepts an integer
            between 0 and 100.
          contentEncoding: int64
        NanoCpus:
          type: integer
          description: CPU quota in units of 10<sup>-9</sup> CPUs.
          contentEncoding: int64
        OomKillDisable:
          type: boolean
          description: Disable OOM Killer for the container.
        Init:
          type: boolean
          description: |-
            Run an init inside the container that forwards signals and reaps
            processes. This field is omitted if empty, and the default (as
            configured on the daemon) is used.
        PidsLimit:
          type: integer
          description: >-
            Tune a container's PIDs limit. Set `0` or `-1` for unlimited, or
            `null`

            to not change.
          contentEncoding: int64
        Ulimits:
          type: array
          items:
            $ref: '#/components/schemas/Ulimit'
          description: |-
            A list of resource limits to set in the container. For example:

            ```
            {"Name": "nofile", "Soft": 1024, "Hard": 2048}
            ```
        CpuCount:
          type: integer
          description: >-
            The number of usable CPUs (Windows only).


            On Windows Server containers, the processor resource controls are

            mutually exclusive. The order of precedence is `CPUCount` first,
            then

            `CPUShares`, and `CPUPercent` last.
          contentEncoding: int64
        CpuPercent:
          type: integer
          description: >-
            The usable percentage of the available CPUs (Windows only).


            On Windows Server containers, the processor resource controls are

            mutually exclusive. The order of precedence is `CPUCount` first,
            then

            `CPUShares`, and `CPUPercent` last.
          contentEncoding: int64
        IOMaximumIOps:
          type: integer
          description: Maximum IOps for the container system drive (Windows only)
          contentEncoding: int64
        IOMaximumBandwidth:
          type: integer
          description: |-
            Maximum IO in bytes per second for the container system drive
            (Windows only).
          contentEncoding: int64
        RestartPolicy:
          allOf:
            - $ref: '#/components/schemas/RestartPolicy'
            - description: >-
                The behavior to apply when the container exits. The default is
                not to

                restart.


                An ever increasing delay (double the previous delay, starting at
                100ms) is

                added before each restart to prevent flooding the server.
      examples:
        - BlkioWeight: 300
          CpuShares: 512
          CpuPeriod: 100000
          CpuQuota: 50000
          CpuRealtimePeriod: 1000000
          CpuRealtimeRuntime: 10000
          CpusetCpus: 0,1
          CpusetMems: '0'
          Memory: 314572800
          MemorySwap: 514288000
          MemoryReservation: 209715200
          RestartPolicy:
            MaximumRetryCount: 4
            Name: on-failure
    UpdateConfig:
      title: UpdateConfig
      type: object
      properties:
        Parallelism:
          type: integer
          description: |-
            Maximum number of tasks to be updated in one iteration (0 means
            unlimited parallelism).
          contentEncoding: int64
        Delay:
          type: integer
          description: Amount of time between updates, in nanoseconds.
          contentEncoding: int64
        FailureAction:
          allOf:
            - $ref: '#/components/schemas/FailureAction'
            - description: |-
                Action to take if an updated task fails to run, or stops running
                during the update.
        Monitor:
          type: integer
          description: |-
            Amount of time to monitor each updated task for failures, in
            nanoseconds.
          contentEncoding: int64
        MaxFailureRatio:
          type: number
          description: |-
            The fraction of tasks that may fail during an update before the
            failure action is invoked, specified as a floating point number
            between 0 and 1.
          default: 0
        Order:
          allOf:
            - $ref: '#/components/schemas/Order'
            - description: |-
                The order of operations when rolling out an updated task. Either
                the old task is shut down before the new task is started, or the
                new task is started before the old task is shut down.
      description: Specification for the update strategy of the service.
    UpdateStatus:
      title: UpdateStatus
      type: object
      properties:
        State:
          $ref: '#/components/schemas/State1'
        StartedAt:
          type: string
        CompletedAt:
          type: string
        Message:
          type: string
      description: The status of a service update.
    UsageData:
      title: UsageData
      required:
        - Size
        - RefCount
      type: object
      properties:
        Size:
          type: integer
          description: |-
            Amount of disk space used by the volume (in bytes). This information
            is only available for volumes created with the `"local"` volume
            driver. For volumes created with other volume drivers, this field
            is set to `-1` ("not available")
          contentEncoding: int64
        RefCount:
          type: integer
          description: |-
            The number of containers referencing this volume. This field
            is set to `-1` if the reference-count is not available.
          contentEncoding: int64
      description: |-
        Usage details about the volume. This information is used by the
        `GET /system/df` endpoint, and omitted in other endpoints.
    User:
      title: User
      type: object
      properties:
        UID:
          type: integer
          contentEncoding: int32
          examples:
            - 1000
        GID:
          type: integer
          contentEncoding: int32
          examples:
            - 1000
    version:
      title: version
      enum:
        - '1'
        - '2'
      type: string
    VirtualIP:
      title: VirtualIP
      type: object
      properties:
        NetworkID:
          type: string
        Addr:
          type: string
    VolumeOptions:
      title: VolumeOptions
      type: object
      properties:
        NoCopy:
          type: boolean
          description: Populate volume with data from the target.
          default: false
        Labels:
          type: object
          additionalProperties:
            type: string
          description: User-defined key/value metadata.
        DriverConfig:
          allOf:
            - $ref: '#/components/schemas/DriverConfig'
            - description: Map of driver specific options
        Subpath:
          type: string
          description: >-
            Source path inside the volume. Must be relative without any back
            traversals.
          examples:
            - dir-inside-volume/subdirectory
      description: Optional configuration for the `volume` type.
    VolumePruneResponse:
      title: VolumePruneResponse
      type: object
      properties:
        VolumesDeleted:
          type: array
          items:
            type: string
          description: Volumes that were deleted
        SpaceReclaimed:
          type: integer
          description: Disk space reclaimed in bytes
          contentEncoding: int64
    Volumes:
      title: Volumes
      const: '{}'
      type: string
tags:
  - name: Container
    description: |
      Create and manage containers.
  - name: Image
  - name: Network
    description: |
      Networks are user-defined networks that containers can be attached to.
      See the [networking documentation](https://docs.docker.com/network/)
      for more information.
  - name: Volume
    description: |
      Create and manage persistent storage that can be attached to containers.
  - name: Exec
    description: >
      Run new commands inside running containers. Refer to the

      [command-line
      reference](https://docs.docker.com/engine/reference/commandline/exec/)

      for more information.


      To exec a command in a container, you first need to create an exec
      instance,

      then start it. These two API endpoints are wrapped up in a single
      command-line

      command, `docker exec`.
  - name: Swarm
    description: |
      Engines can be clustered together in a swarm. Refer to the
      [swarm mode documentation](https://docs.docker.com/engine/swarm/)
      for more information.
  - name: Node
    description: |
      Nodes are instances of the Engine participating in a swarm. Swarm mode
      must be enabled for these endpoints to work.
  - name: Service
    description: |
      Services are the definitions of tasks to run on a swarm. Swarm mode must
      be enabled for these endpoints to work.
  - name: Task
    description: |
      A task is a container running on a swarm. It is the atomic scheduling unit
      of swarm. Swarm mode must be enabled for these endpoints to work.
  - name: Secret
    description: |
      Secrets are sensitive data that can be used by services. Swarm mode must
      be enabled for these endpoints to work.
  - name: Config
    description: |
      Configs are application configurations that can be used by services. Swarm
      mode must be enabled for these endpoints to work.
  - name: Plugin
  - name: System
  - name: Distribution
    description: ''
  - name: Session
    description: ''
