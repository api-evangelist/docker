          type: string
    ProgressDetail:
      title: ProgressDetail
      type: object
      properties:
        current:
          type: integer
          contentEncoding: int32
        total:
          type: integer
          contentEncoding: int32
    ErrorResponse:
      title: ErrorResponse
      required:
