              FailureAction: pause
              Monitor: 15000000000
              MaxFailureRatio: 0.15
            EndpointSpec:
              Mode: vip
              Ports:
                - Protocol: tcp
                  TargetPort: 6379
                  PublishedPort: 30001
          Endpoint:
            Spec:
              Mode: vip
              Ports:
                - Protocol: tcp
                  TargetPort: 6379
                  PublishedPort: 30001
            Ports:
              - Protocol: tcp
                TargetPort: 6379
                PublishedPort: 30001
            VirtualIPs:
              - NetworkID: 4qvuz4ko70xaltuqbt8956gd1
