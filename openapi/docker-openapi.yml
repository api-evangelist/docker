          allOf:
            - $ref: '#/components/schemas/ObjectVersion'
            - description: >-
                The version number of the object such as node, service, etc.
                This is needed

                to avoid conflicting writes. The client must send the version
                number along

                with the modified specification when updating these objects.


                This approach ensures safe concurrency and determinism in that
                the change

                on the object may not be applied if the version number has
                changed from the

                last read. In other words, if two update requests specify the
                same base

                version, only one of the requests can succeed. As a result, two
                separate

                update requests that happen at the same time will not
                unintentionally

                overwrite each other.
        CreatedAt:
          type: string
          description: >-
            Date and time at which the node was added to the swarm in

            [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format with
            nano-seconds.
          examples:
            - '2016-08-18T10:44:24.496Z'
        UpdatedAt:
          type: string
          description: >-
            Date and time at which the node was last updated in

            [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format with
            nano-seconds.
          examples:
            - '2017-08-09T07:09:37.632Z'
        Spec:
          allOf:
            - $ref: '#/components/schemas/NodeSpec'
            - examples:
                - Availability: active
                  Name: node-name
                  Role: manager
                  Labels:
                    foo: bar
        Description:
          allOf:
            - $ref: '#/components/schemas/NodeDescription'
            - description: >-
                NodeDescription encapsulates the properties of the Node as
                reported by the

                agent.
        Status:
          allOf:
            - $ref: '#/components/schemas/NodeStatus'
            - description: >-
                NodeStatus represents the status of a node.


                It provides the current status of the node, as seen by the
                manager.
        ManagerStatus:
          allOf:
            - $ref: '#/components/schemas/ManagerStatus'
            - description: >-
                ManagerStatus represents the status of a manager.


                It provides the current status of a node's manager component, if
                the node

                is a manager.
    NodeDescription:
      title: NodeDescription
