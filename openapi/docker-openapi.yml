      type: object
      properties:
        message:
          type: string
          description: The error message.
      description: Represents an error.
      examples:
        - message: Something went wrong.
    IDResponse:
      title: IDResponse
      required:
        - Id
      type: object
      properties:
        Id:
          type: string
          description: The id of the newly created object.
      description: Response to an API call that returns just an Id
    NetworkConnectRequest:
      title: NetworkConnectRequest
      required:
        - Container
      type: object
      properties:
        Container:
          type: string
          description: The ID or name of the container to connect to the network.
          examples:
            - 3613f73ba0e4
        EndpointConfig:
          allOf:
            - $ref: '#/components/schemas/EndpointSettings'
            - description: Configuration for a network endpoint.
      description: >-
        NetworkConnectRequest represents the data to be used to connect a
        container to a network.
    NetworkDisconnectRequest:
      title: NetworkDisconnectRequest
      required:
        - Container
      type: object
      properties:
        Container:
          type: string
          description: The ID or name of the container to disconnect from the network.
          examples:
            - 3613f73ba0e4
        Force:
          type: boolean
          description: Force the container to disconnect from the network.
          default: false
          examples:
            - false
      description: >-
        NetworkDisconnectRequest represents the data to be used to disconnect a
        container from a network.
    EndpointSettings:
      title: EndpointSettings
      type: object
      properties:
        IPAMConfig:
          allOf:
            - $ref: '#/components/schemas/EndpointIPAMConfig'
            - description: EndpointIPAMConfig represents an endpoint's IPAM configuration.
        Links:
          type: array
          items:
            type: string
          description: ''
          examples:
            - - container_1
              - container_2
        MacAddress:
          type: string
          description: >-
            MAC address for the endpoint on this network. The network driver
            might ignore this parameter.
          examples:
            - 02:42:ac:11:00:04
        Aliases:
          type: array
          items:
            type: string
          description: ''
          examples:
            - - server_x
              - server_y
        DriverOpts:
          type: object
          additionalProperties:
            type: string
          description: |-
            DriverOpts is a mapping of driver options and values. These options
            are passed directly to the driver and are driver specific.
          examples:
            - com.example.some-label: some-value
              com.example.some-other-label: some-other-value
        GwPriority:
          type: integer
          description: |-
            This property determines which endpoint will provide the default
            gateway for a container. The endpoint with the highest priority will
            be used. If multiple endpoints have the same priority, endpoints are
            lexicographically sorted based on their network name, and the one
            that sorts first is picked.
          contentEncoding: int64
        NetworkID:
          type: string
          description: Unique ID of the network.
          examples:
            - 08754567f1f40222263eab4102e1c733ae697e8e354aa9cd6e18d7402835292a
        EndpointID:
          type: string
          description: Unique ID for the service endpoint in a Sandbox.
          examples:
            - b88f5b905aabf2893f3cbc4ee42d1ea7980bbc0a92e2c8922b1e1795298afb0b
        Gateway:
          type: string
          description: Gateway address for this network.
          examples:
            - 172.17.0.1
        IPAddress:
          type: string
          description: IPv4 address.
          examples:
            - 172.17.0.4
        IPPrefixLen:
          type: integer
          description: Mask length of the IPv4 address.
          contentEncoding: int32
          examples:
            - 16
        IPv6Gateway:
          type: string
          description: IPv6 gateway address.
          examples:
            - 2001:db8:2::100
        GlobalIPv6Address:
          type: string
          description: Global IPv6 address.
          examples:
            - 2001:db8::5689
        GlobalIPv6PrefixLen:
          type: integer
          description: Mask length of the global IPv6 address.
          contentEncoding: int64
          examples:
            - 64
        DNSNames:
          type: array
          items:
            type: string
          description: >-
            List of all DNS names an endpoint has on a specific network. This

            list is based on the container name, network aliases, container
            short

            ID, and hostname.


            These DNS names are non-fully qualified but can contain several
            dots.

            You can get fully qualified DNS names by appending
            `.<network-name>`.

            For instance, if container name is `my.ctr` and the network is named

            `testnet`, `DNSNames` will contain `my.ctr` and the FQDN will be

            `my.ctr.testnet`.
          examples:
            - - foobar
              - server_x
              - server_y
              - my.ctr
      description: Configuration for a network endpoint.
    EndpointIPAMConfig:
      title: EndpointIPAMConfig
      type: object
      properties:
        IPv4Address:
          type: string
          examples:
            - 172.20.30.33
        IPv6Address:
          type: string
          examples:
            - 2001:db8:abcd::3033
        LinkLocalIPs:
          type: array
          items:
            type: string
          description: ''
          examples:
            - - 169.254.34.68
              - fe80::3468
      description: EndpointIPAMConfig represents an endpoint's IPAM configuration.
    PluginMount:
      title: PluginMount
      required:
        - Name
        - Description
        - Settable
        - Source
        - Destination
        - Type
        - Options
      type: object
      properties:
        Name:
          type: string
          examples:
            - some-mount
        Description:
          type: string
          examples:
            - This is a mount that's used by the plugin.
        Settable:
          type: array
          items:
            type: string
          description: ''
        Source:
          type: string
          examples:
            - /var/lib/docker/plugins/
        Destination:
          type: string
          examples:
            - /mnt/state
        Type:
          type: string
          examples:
            - bind
        Options:
          type: array
          items:
            type: string
          description: ''
          examples:
            - - rbind
              - rw
