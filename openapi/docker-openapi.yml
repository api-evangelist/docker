        call back to the client for advanced capabilities.

        ### Hijacking

        This endpoint hijacks the HTTP connection to HTTP2 transport that allows
        the client to expose gPRC services on that connection.

        For example, the client sends this request to upgrade the connection:

        ```
        POST /session HTTP/1.1
        Upgrade: h2c
        Connection: Upgrade
        ```

        The Docker daemon responds with a `101 UPGRADED` response follow with
        the raw stream:

        ```
        HTTP/1.1 101 UPGRADED
        Connection: Upgrade
        Upgrade: h2c
        ```
      operationId: Session
      parameters: []
      responses:
        '101':
          description: no error, hijacking successful
          headers: {}
          content: {}
        '400':
          description: bad parameter
          headers: {}
          content:
            application/vnd.docker.raw-stream:
              schema:
                contentMediaType: application/vnd.docker.raw-stream
        '500':
          description: server error
          headers: {}
          content:
            application/vnd.docker.raw-stream:
              schema:
                contentMediaType: application/vnd.docker.raw-stream
      deprecated: false
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
    parameters: []
components:
  schemas:
    PortSummary:
      title: PortSummary
      required:
        - PrivatePort
        - Type
      type: object
      properties:
        IP:
          type: string
          description: Host IP address that the container's port is mapped to
        PrivatePort:
          type: integer
          description: Port on the container
          contentEncoding: int32
        PublicPort:
          type: integer
          description: Port exposed on the host
          contentEncoding: int32
        Type:
          $ref: '#/components/schemas/Type'
      description: Describes a port-mapping between the container and the host.
      examples:
        - PrivatePort: 8080
          PublicPort: 80
          Type: tcp
    MountPoint:
      title: MountPoint
      type: object
      properties:
        Type:
          allOf:
            - $ref: '#/components/schemas/Type1'
            - description: >-
                The mount type:


                - `bind` a mount of a file or directory from the host into the
                container.

                - `volume` a docker volume with the given `Name`.

                - `image` a docker image

                - `tmpfs` a `tmpfs`.

                - `npipe` a named pipe from the host into the container.

                - `cluster` a Swarm cluster volume
              examples:
                - volume
        Name:
          type: string
          description: >-
            Name is the name reference to the underlying data defined by
            `Source`

            e.g., the volume name.
          examples:
            - myvolume
        Source:
          type: string
          description: >-
            Source location of the mount.


            For volumes, this contains the storage location of the volume
            (within

            `/var/lib/docker/volumes/`). For bind-mounts, and `npipe`, this
            contains

            the source (host) part of the bind-mount. For `tmpfs` mount points,
            this

            field is empty.
          examples:
            - /var/lib/docker/volumes/myvolume/_data
        Destination:
          type: string
          description: |-
            Destination is the path relative to the container root (`/`) where
            the `Source` is mounted inside the container.
          examples:
            - /usr/share/nginx/html/
        Driver:
          type: string
          description: >-
            Driver is the volume driver used to create the volume (if it is a
            volume).
          examples:
            - local
        Mode:
          type: string
          description: |-
            Mode is a comma separated list of options supplied by the user when
            creating the bind/volume mount.

            The default is platform-specific (`"z"` on Linux, empty on Windows).
          examples:
            - z
        RW:
          type: boolean
          description: Whether the mount is mounted writable (read-write).
          examples:
            - true
        Propagation:
          type: string
          description: >-
            Propagation describes how mounts are propagated from the host into
            the

            mount point, and vice-versa. Refer to the [Linux kernel
            documentation](https://www.kernel.org/doc/Documentation/filesystems/sharedsubtree.txt)

            for details. This field is not used on Windows.
      description: |-
        MountPoint represents a mount point configuration inside the container.
        This is used for reporting the mountpoints in use by a container.
    DeviceMapping:
      title: DeviceMapping
      type: object
      properties:
        PathOnHost:
          type: string
        PathInContainer:
          type: string
        CgroupPermissions:
          type: string
      description: A device mapping between the host and container
      examples:
        - PathOnHost: /dev/deviceName
          PathInContainer: /dev/deviceName
          CgroupPermissions: mrw
    DeviceRequest:
      title: DeviceRequest
      type: object
      properties:
        Driver:
          type: string
          description: |-
            The name of the device driver to use for this request.

            Note that if this is specified the capabilities are ignored when
            selecting a device driver.
          examples:
            - nvidia
        Count:
          type: integer
          contentEncoding: int32
          examples:
            - -1
        DeviceIDs:
          type: array
          items:
            type: string
          description: ''
          examples:
            - - '0'
              - '1'
              - GPU-fef8089b-4820-abfc-e83e-94318197576e
        Capabilities:
          type: array
          items:
            type: array
            items:
              type: string
          description: >-
            A list of capabilities; an OR list of AND lists of capabilities.


            Note that if a driver is specified the capabilities have no effect
            on

            selecting a driver as the driver name is used directly.


            Note that if no driver is specified the capabilities are used to

            select a driver with the required capabilities.
          examples:
            - - - gpu
                - nvidia
                - compute
        Options:
          type: object
          additionalProperties:
            type: string
          description: >-
            Driver-specific options, specified as a key/value pairs. These
            options

            are passed directly to the driver.
      description: A request for devices to be sent to device drivers
    ThrottleDevice:
      title: ThrottleDevice
      type: object
      properties:
        Path:
          type: string
          description: Device path
        Rate:
          minimum: 0
          type: integer
          description: Rate
          contentEncoding: int64
    Mount:
      title: Mount
      type: object
      properties:
        Target:
          type: string
          description: Container path.
        Source:
          type: string
          description: Mount source (e.g. a volume name, a host path).
        Type:
          allOf:
            - $ref: '#/components/schemas/Type2'
            - description: >-
                The mount type. Available types:


                - `bind` Mounts a file or directory from the host into the
                container. Must exist prior to creating the container.

                - `volume` Creates a volume with the given name and options (or
                uses a pre-existing volume with the same name and options).
                These are **not** removed when the container is removed.

                - `image` Mounts an image.

                - `tmpfs` Create a tmpfs with the given options. The mount
                source cannot be specified for tmpfs.

                - `npipe` Mounts a named pipe from the host into the container.
                Must exist prior to creating the container.

                - `cluster` a Swarm cluster volume
        ReadOnly:
          type: boolean
          description: Whether the mount should be read-only.
        Consistency:
          type: string
          description: >-
            The consistency requirement for the mount: `default`, `consistent`,
            `cached`, or `delegated`.
        BindOptions:
          allOf:
            - $ref: '#/components/schemas/BindOptions'
            - description: Optional configuration for the `bind` type.
        VolumeOptions:
          allOf:
            - $ref: '#/components/schemas/VolumeOptions'
            - description: Optional configuration for the `volume` type.
        ImageOptions:
          allOf:
            - $ref: '#/components/schemas/ImageOptions'
            - description: Optional configuration for the `image` type.
        TmpfsOptions:
          allOf:
            - $ref: '#/components/schemas/TmpfsOptions'
            - description: Optional configuration for the `tmpfs` type.
    RestartPolicy:
      title: RestartPolicy
      type: object
      properties:
        Name:
          allOf:
            - $ref: '#/components/schemas/Name'
            - description: >-
                - Empty string means not to restart

                - `no` Do not automatically restart

                - `always` Always restart

                - `unless-stopped` Restart always except when the user has
                manually stopped the container

                - `on-failure` Restart only when the container exit code is
                non-zero
        MaximumRetryCount:
          type: integer
          description: >-
            If `on-failure` is used, the number of times to retry before giving
            up.
          contentEncoding: int32
      description: >-
        The behavior to apply when the container exits. The default is not to

        restart.


        An ever increasing delay (double the previous delay, starting at 100ms)
        is

        added before each restart to prevent flooding the server.
    Resources:
      title: Resources
      type: object
      properties:
        CpuShares:
          type: integer
          description: |-
            An integer value representing this container's relative CPU weight
            versus other containers.
          contentEncoding: int32
        Memory:
          type: integer
          description: Memory limit in bytes.
          contentEncoding: int64
          default: 0
        CgroupParent:
          type: string
          description: >-
            Path to `cgroups` under which the container's `cgroup` is created.
            If

            the path is not absolute, the path is considered to be relative to
            the

            `cgroups` path of the init process. Cgroups are created if they do
            not

            already exist.
        BlkioWeight:
          maximum: 1000
          minimum: 0
          type: integer
          description: Block IO weight (relative weight).
          contentEncoding: int32
        BlkioWeightDevice:
          type: array
          items:
            $ref: '#/components/schemas/BlkioWeightDevice'
          description: |-
            Block IO weight (relative device weight) in the form:

            ```
            [{"Path": "device_path", "Weight": weight}]
            ```
        BlkioDeviceReadBps:
          type: array
          items:
            $ref: '#/components/schemas/ThrottleDevice'
          description: |-
            Limit read rate (bytes per second) from a device, in the form:

            ```
            [{"Path": "device_path", "Rate": rate}]
            ```
        BlkioDeviceWriteBps:
          type: array
          items:
            $ref: '#/components/schemas/ThrottleDevice'
          description: |-
            Limit write rate (bytes per second) to a device, in the form:

            ```
            [{"Path": "device_path", "Rate": rate}]
            ```
        BlkioDeviceReadIOps:
          type: array
          items:
            $ref: '#/components/schemas/ThrottleDevice'
          description: |-
            Limit read rate (IO per second) from a device, in the form:

            ```
            [{"Path": "device_path", "Rate": rate}]
            ```
        BlkioDeviceWriteIOps:
          type: array
          items:
            $ref: '#/components/schemas/ThrottleDevice'
          description: |-
            Limit write rate (IO per second) to a device, in the form:

            ```
            [{"Path": "device_path", "Rate": rate}]
            ```
        CpuPeriod:
          type: integer
          description: The length of a CPU period in microseconds.
          contentEncoding: int64
        CpuQuota:
          type: integer
          description: Microseconds of CPU time that the container can get in a CPU period.
          contentEncoding: int64
        CpuRealtimePeriod:
          type: integer
          description: |-
            The length of a CPU real-time period in microseconds. Set to 0 to
            allocate no time allocated to real-time tasks.
          contentEncoding: int64
        CpuRealtimeRuntime:
          type: integer
          description: |-
            The length of a CPU real-time runtime in microseconds. Set to 0 to
            allocate no time allocated to real-time tasks.
          contentEncoding: int64
        CpusetCpus:
          type: string
          description: CPUs in which to allow execution (e.g., `0-3`, `0,1`).
          examples:
            - 0-3
        CpusetMems:
          type: string
          description: |-
            Memory nodes (MEMs) in which to allow execution (0-3, 0,1). Only
            effective on NUMA systems.
        Devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceMapping'
          description: A list of devices to add to the container.
        DeviceCgroupRules:
          type: array
          items:
            type: string
          description: a list of cgroup rules to apply to the container
        DeviceRequests:
          type: array
          items:
            $ref: '#/components/schemas/DeviceRequest'
          description: A list of requests for devices to be sent to device drivers.
        MemoryReservation:
          type: integer
          description: Memory soft limit in bytes.
          contentEncoding: int64
        MemorySwap:
          type: integer
          description: |-
            Total memory limit (memory + swap). Set as `-1` to enable unlimited
            swap.
          contentEncoding: int64
        MemorySwappiness:
          maximum: 100
          minimum: 0
          type: integer
          description: |-
            Tune a container's memory swappiness behavior. Accepts an integer
            between 0 and 100.
          contentEncoding: int64
        NanoCpus:
          type: integer
          description: CPU quota in units of 10<sup>-9</sup> CPUs.
          contentEncoding: int64
        OomKillDisable:
          type: boolean
          description: Disable OOM Killer for the container.
        Init:
          type: boolean
          description: |-
            Run an init inside the container that forwards signals and reaps
            processes. This field is omitted if empty, and the default (as
            configured on the daemon) is used.
        PidsLimit:
          type: integer
          description: >-
            Tune a container's PIDs limit. Set `0` or `-1` for unlimited, or
            `null`

            to not change.
          contentEncoding: int64
        Ulimits:
          type: array
          items:
            $ref: '#/components/schemas/Ulimit'
          description: |-
            A list of resource limits to set in the container. For example:

            ```
            {"Name": "nofile", "Soft": 1024, "Hard": 2048}
            ```
        CpuCount:
          type: integer
          description: >-
            The number of usable CPUs (Windows only).


            On Windows Server containers, the processor resource controls are

            mutually exclusive. The order of precedence is `CPUCount` first,
            then

            `CPUShares`, and `CPUPercent` last.
          contentEncoding: int64
        CpuPercent:
          type: integer
          description: >-
            The usable percentage of the available CPUs (Windows only).


            On Windows Server containers, the processor resource controls are

            mutually exclusive. The order of precedence is `CPUCount` first,
            then

            `CPUShares`, and `CPUPercent` last.
          contentEncoding: int64
        IOMaximumIOps:
          type: integer
          description: Maximum IOps for the container system drive (Windows only)
          contentEncoding: int64
        IOMaximumBandwidth:
          type: integer
          description: |-
            Maximum IO in bytes per second for the container system drive
            (Windows only).
          contentEncoding: int64
      description: A container's resources (cgroups config, ulimits, etc)
    Limit:
      title: Limit
      type: object
      properties:
        NanoCPUs:
          type: integer
          contentEncoding: int64
          examples:
            - 4000000000
        MemoryBytes:
          type: integer
          contentEncoding: int64
          examples:
            - 8272408576
        Pids:
          type: integer
          description: >-
            Limits the maximum number of PIDs in the container. Set `0` for
            unlimited.
          contentEncoding: int64
          default: 0
          examples:
            - 100
      description: >-
        An object describing a limit on resources which can be requested by a
        task.
    ResourceObject:
      title: ResourceObject
      type: object
      properties:
        NanoCPUs:
          type: integer
          contentEncoding: int64
          examples:
            - 4000000000
        MemoryBytes:
          type: integer
          contentEncoding: int64
          examples:
            - 8272408576
        GenericResources:
          type: array
          items:
            $ref: '#/components/schemas/GenericResource'
          description: >-
            User-defined resources can be either Integer resources (e.g,
            `SSD=3`) or

            String resources (e.g, `GPU=UUID1`).
          examples:
            - - DiscreteResourceSpec:
                  Kind: SSD
                  Value: 3
              - NamedResourceSpec:
                  Kind: GPU
                  Value: UUID1
              - NamedResourceSpec:
                  Kind: GPU
                  Value: UUID2
      description: |-
        An object describing the resources which can be advertised by a node and
        requested by a task.
    HealthConfig:
      title: HealthConfig
      type: object
      properties:
        Test:
          type: array
          items:
            type: string
          description: |-
            The test to perform. Possible values are:

            - `[]` inherit healthcheck from image or parent image
            - `["NONE"]` disable healthcheck
            - `["CMD", args...]` exec arguments directly
            - `["CMD-SHELL", command]` run command with system's default shell
        Interval:
          type: integer
          description: |-
            The time to wait between checks in nanoseconds. It should be 0 or at
            least 1000000 (1 ms). 0 means inherit.
          contentEncoding: int64
        Timeout:
          type: integer
          description: >-
            The time to wait before considering the check to have hung. It
            should

            be 0 or at least 1000000 (1 ms). 0 means inherit.
          contentEncoding: int64
        Retries:
          type: integer
          description: |-
            The number of consecutive failures needed to consider a container as
            unhealthy. 0 means inherit.
          contentEncoding: int32
        StartPeriod:
          type: integer
          description: |-
            Start period for the container to initialize before starting
            health-retries countdown in nanoseconds. It should be 0 or at least
            1000000 (1 ms). 0 means inherit.
          contentEncoding: int64
        StartInterval:
          type: integer
          description: >-
            The time to wait between checks in nanoseconds during the start
            period.

            It should be 0 or at least 1000000 (1 ms). 0 means inherit.
          contentEncoding: int64
      description: A test to perform to check that the container is healthy.
    Health:
      title: Health
      type: object
      properties:
        Status:
          allOf:
            - $ref: '#/components/schemas/Status'
            - description: >-
                Status is one of `none`, `starting`, `healthy` or `unhealthy`


                - "none"      Indicates there is no healthcheck

                - "starting"  Starting indicates that the container is not yet
                ready

                - "healthy"   Healthy indicates that the container is running
                correctly

                - "unhealthy" Unhealthy indicates that the container has a
                problem
              examples:
                - healthy
        FailingStreak:
          type: integer
          description: FailingStreak is the number of consecutive failures
          contentEncoding: int32
          examples:
            - 0
        Log:
          type: array
          items:
            $ref: '#/components/schemas/HealthcheckResult'
          description: Log contains the last few results (oldest first)
      description: Health stores information about the container's healthcheck results.
    HealthcheckResult:
      title: HealthcheckResult
      type: object
      properties:
        Start:
          type: string
          description: >-
            Date and time at which this check started in

            [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format with
            nano-seconds.
          contentEncoding: date-time
          examples:
            - '2020-01-04T10:44:24.496Z'
        End:
          type: string
          description: >-
            Date and time at which this check ended in

            [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format with
            nano-seconds.
          examples:
            - '2020-01-04T10:45:21.364Z'
        ExitCode:
          type: integer
          description: |-
            ExitCode meanings:

            - `0` healthy
            - `1` unhealthy
            - `2` reserved (considered unhealthy)
            - other values: error running probe
          contentEncoding: int32
          examples:
            - 0
        Output:
          type: string
          description: Output from last check
      description: >-
        HealthcheckResult stores information about a single run of a healthcheck
        probe
    HostConfig:
      title: HostConfig
      type: object
      properties:
        CpuShares:
          type: integer
          description: |-
            An integer value representing this container's relative CPU weight
            versus other containers.
          contentEncoding: int32
        Memory:
          type: integer
          description: Memory limit in bytes.
          contentEncoding: int64
          default: 0
        CgroupParent:
          type: string
          description: >-
            Path to `cgroups` under which the container's `cgroup` is created.
            If

            the path is not absolute, the path is considered to be relative to
            the

            `cgroups` path of the init process. Cgroups are created if they do
            not

            already exist.
        BlkioWeight:
          maximum: 1000
          minimum: 0
          type: integer
          description: Block IO weight (relative weight).
          contentEncoding: int32
        BlkioWeightDevice:
          type: array
          items:
            $ref: '#/components/schemas/BlkioWeightDevice'
          description: |-
            Block IO weight (relative device weight) in the form:

            ```
            [{"Path": "device_path", "Weight": weight}]
            ```
        BlkioDeviceReadBps:
          type: array
          items:
            $ref: '#/components/schemas/ThrottleDevice'
          description: |-
            Limit read rate (bytes per second) from a device, in the form:

            ```
            [{"Path": "device_path", "Rate": rate}]
            ```
        BlkioDeviceWriteBps:
          type: array
          items:
            $ref: '#/components/schemas/ThrottleDevice'
          description: |-
            Limit write rate (bytes per second) to a device, in the form:

            ```
            [{"Path": "device_path", "Rate": rate}]
            ```
        BlkioDeviceReadIOps:
          type: array
          items:
            $ref: '#/components/schemas/ThrottleDevice'
          description: |-
            Limit read rate (IO per second) from a device, in the form:

            ```
            [{"Path": "device_path", "Rate": rate}]
            ```
        BlkioDeviceWriteIOps:
          type: array
          items:
            $ref: '#/components/schemas/ThrottleDevice'
          description: |-
            Limit write rate (IO per second) to a device, in the form:

            ```
            [{"Path": "device_path", "Rate": rate}]
            ```
        CpuPeriod:
          type: integer
          description: The length of a CPU period in microseconds.
          contentEncoding: int64
        CpuQuota:
          type: integer
          description: Microseconds of CPU time that the container can get in a CPU period.
          contentEncoding: int64
        CpuRealtimePeriod:
          type: integer
          description: |-
            The length of a CPU real-time period in microseconds. Set to 0 to
            allocate no time allocated to real-time tasks.
          contentEncoding: int64
        CpuRealtimeRuntime:
          type: integer
          description: |-
            The length of a CPU real-time runtime in microseconds. Set to 0 to
            allocate no time allocated to real-time tasks.
          contentEncoding: int64
        CpusetCpus:
          type: string
          description: CPUs in which to allow execution (e.g., `0-3`, `0,1`).
          examples:
            - 0-3
        CpusetMems:
          type: string
          description: |-
            Memory nodes (MEMs) in which to allow execution (0-3, 0,1). Only
            effective on NUMA systems.
        Devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceMapping'
          description: A list of devices to add to the container.
        DeviceCgroupRules:
          type: array
          items:
            type: string
          description: a list of cgroup rules to apply to the container
        DeviceRequests:
          type: array
          items:
            $ref: '#/components/schemas/DeviceRequest'
