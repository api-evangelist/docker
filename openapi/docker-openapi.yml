    ContainerInspectResponse:
      title: ContainerInspectResponse
      type: object
      properties:
        Id:
          maxLength: 64
          minLength: 64
          pattern: ^[0-9a-fA-F]{64}$
          type: string
          description: >-
            The ID of this container as a 128-bit (64-character) hexadecimal
            string (32 bytes).
          examples:
            - aa86eacfb3b3ed4cd362c1e88fc89a53908ad05fb3a4103bca3f9b28292d14bf
        Created:
          type: string
          description: >-
            Date and time at which the container was created, formatted in

            [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format with
            nano-seconds.
          examples:
            - '2025-02-17T17:43:39.640Z'
        Path:
          type: string
          description: The path to the command being run
          examples:
