openapi: 3.1.0
info:
  title: Docker
  description: >-
    Docker is a platform that lets developers package applications and all their
    dependencies into standardized units called containers. These containers
    bundle everything needed to run the software—code, runtime, system tools,
    and libraries—so the application runs consistently across different
    computing environments, whether that's your laptop, a test server, or a
    production cloud system. 
  contact: {}
  version: '1.52'
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: http://{defaultHost}
    variables:
      defaultHost:
        default: www.example.com/v1.52
  - url: https://{defaultHost}
    variables:
      defaultHost:
        default: www.example.com/v1.52
paths:
  /containers/json:
    get:
      tags:
        - Container
      summary: Containerlist
      description: |
        Returns a list of containers. For details on the format, see the
        [inspect endpoint](#operation/ContainerInspect).

        Note that it uses a different, smaller representation of a container
        than inspecting a single container. For example, the list of linked
        containers is not propagated .
      operationId: ContainerList
      parameters:
        - name: all
          in: query
          description: >-
            Return all containers. By default, only running containers are
            shown.
          style: form
          explode: true
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: |-
            Return this number of most recently created containers, including
            non-running ones.
          style: form
          explode: true
          schema:
            type: integer
            contentEncoding: int32
        - name: size
          in: query
          description: Return the size of container as fields `SizeRw` and `SizeRootFs`.
          style: form
          explode: true
          schema:
            type: boolean
            default: false
        - name: filters
          in: query
          description: >-
            Filters to process on the container list, encoded as JSON (a

            `map[string][]string`). For example, `{"status": ["paused"]}` will

            only return paused containers.


            Available filters:


            - `ancestor`=(`<image-name>[:<tag>]`, `<image id>`, or
            `<image@digest>`)

            - `before`=(`<container id>` or `<container name>`)

            - `expose`=(`<port>[/<proto>]`|`<startport-endport>/[<proto>]`)

            - `exited=<int>` containers with exit code of `<int>`

            - `health`=(`starting`|`healthy`|`unhealthy`|`none`)

            - `id=<ID>` a container's ID

            - `isolation=`(`default`|`process`|`hyperv`) (Windows daemon only)

            - `is-task=`(`true`|`false`)

            - `label=key` or `label="key=value"` of a container label

            - `name=<name>` a container's name

            - `network`=(`<network id>` or `<network name>`)

            - `publish`=(`<port>[/<proto>]`|`<startport-endport>/[<proto>]`)

            - `since`=(`<container id>` or `<container name>`)

            -
            `status=`(`created`|`restarting`|`running`|`removing`|`paused`|`exited`|`dead`)

            - `volume`=(`<volume name>` or `<mount point destination>`)
          style: form
          explode: true
          schema:
            type: string
      responses:
        '200':
          description: no error
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContainerSummary'
                description: ''
                contentMediaType: application/json
        '400':
          description: bad parameter
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: server error
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
    parameters: []
  /containers/create:
    post:
      tags:
        - Container
      summary: Containercreate
      description: Create a container
      operationId: ContainerCreate
      parameters:
        - name: name
          in: query
          description: |-
            Assign the specified name to the container. Must match
            `/?[a-zA-Z0-9][a-zA-Z0-9_.-]+`.
          style: form
          explode: true
          schema:
            pattern: ^/?[a-zA-Z0-9][a-zA-Z0-9_.-]+$
            type: string
        - name: platform
          in: query
          description: >-
            Platform in the format `os[/arch[/variant]]` used for image lookup.


            When specified, the daemon checks if the requested image is present

            in the local image cache with the given OS and Architecture, and

            otherwise returns a `404` status.


            If the option is not set, the host's native OS and Architecture are

            used to look up the image in the image cache. However, if no
            platform

            is passed and the given image does exist in the local image cache,

            but its OS or architecture does not match, the container is created

            with the available image, and a warning is added to the `Warnings`

            field in the response, for example;

                WARNING: The requested image's platform (linux/arm64/v8) does not
                         match the detected host platform (linux/amd64) and no
                         specific platform was requested
          style: form
          explode: true
          schema:
            type: string
      requestBody:
        description: Container to create
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/body'
                - description: Container to create
              contentMediaType: application/json
        required: true
      responses:
        '201':
          description: Container created successfully
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerCreateResponse'
        '400':
          description: bad parameter
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: no such image
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - examples:
                      - message: 'No such image: c2ada9df5af8'
                contentMediaType: application/json
              example:
                message: 'No such image: c2ada9df5af8'
        '409':
          description: conflict
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: server error
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
    parameters: []
  /containers/{id}/json:
    get:
      tags:
        - Container
      summary: Containerinspect
      description: Return low-level information about a container.
      operationId: ContainerInspect
      parameters:
        - name: id
          in: path
          description: ID or name of the container
          required: true
          schema:
            type: string
        - name: size
          in: query
          description: Return the size of container as fields `SizeRw` and `SizeRootFs`
          style: form
          explode: true
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: no error
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerInspectResponse'
        '404':
          description: no such container
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - examples:
                      - message: 'No such container: c2ada9df5af8'
                contentMediaType: application/json
              example:
                message: 'No such container: c2ada9df5af8'
        '500':
          description: server error
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
    parameters: []
  /containers/{id}/top:
    get:
      tags:
        - Container
      summary: Containertop
      description: |
        On Unix systems, this is done by running the `ps` command. This endpoint
        is not supported on Windows.
      operationId: ContainerTop
      parameters:
        - name: id
          in: path
          description: ID or name of the container
          required: true
          schema:
            type: string
        - name: ps_args
          in: query
          description: The arguments to pass to `ps`. For example, `aux`
          style: form
          explode: true
          schema:
            type: string
            default: '-ef'
      responses:
        '200':
          description: no error
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerTopResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/ContainerTopResponse'
        '404':
          description: no such container
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - examples:
                      - message: 'No such container: c2ada9df5af8'
                contentMediaType: application/json
              example:
                message: 'No such container: c2ada9df5af8'
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: server error
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
    parameters: []
  /containers/{id}/logs:
    get:
      tags:
        - Container
      summary: Containerlogs
      description: |
        Get `stdout` and `stderr` logs from a container.

        Note: This endpoint works only for containers with the `json-file` or
        `journald` logging driver.
      operationId: ContainerLogs
      parameters:
        - name: id
          in: path
          description: ID or name of the container
          required: true
          schema:
            type: string
        - name: follow
          in: query
          description: Keep connection after returning logs.
          style: form
          explode: true
          schema:
            type: boolean
            default: false
        - name: stdout
          in: query
          description: Return logs from `stdout`
          style: form
          explode: true
          schema:
            type: boolean
            default: false
        - name: stderr
          in: query
          description: Return logs from `stderr`
          style: form
          explode: true
          schema:
            type: boolean
            default: false
        - name: since
          in: query
          description: Only return logs since this time, as a UNIX timestamp
          style: form
          explode: true
          schema:
            type: integer
            contentEncoding: int32
            default: 0
        - name: until
          in: query
          description: Only return logs before this time, as a UNIX timestamp
          style: form
          explode: true
          schema:
            type: integer
            contentEncoding: int32
            default: 0
        - name: timestamps
          in: query
          description: Add timestamps to every log line
          style: form
          explode: true
          schema:
            type: boolean
            default: false
        - name: tail
          in: query
          description: |-
            Only return this number of log lines from the end of the logs.
            Specify as an integer or `all` to output all log lines.
          style: form
          explode: true
          schema:
            type: string
            default: all
      responses:
        '200':
          description: >-
            logs returned as a stream in response body.

            For the stream format, [see the documentation for the attach
            endpoint](#operation/ContainerAttach).

            Note that unlike the attach endpoint, the logs endpoint does not

            upgrade the connection and does not set Content-Type.
          headers: {}
          content:
            application/vnd.docker.raw-stream:
              schema:
                contentMediaType: application/vnd.docker.raw-stream
            application/vnd.docker.multiplexed-stream:
              schema:
                contentMediaType: application/vnd.docker.multiplexed-stream
        '404':
          description: no such container
          headers: {}
          content:
            application/vnd.docker.raw-stream:
              schema:
                contentMediaType: application/vnd.docker.raw-stream
            application/vnd.docker.multiplexed-stream:
              schema:
                contentMediaType: application/vnd.docker.multiplexed-stream
        '500':
          description: server error
          headers: {}
          content:
            application/vnd.docker.raw-stream:
              schema:
                contentMediaType: application/vnd.docker.raw-stream
            application/vnd.docker.multiplexed-stream:
              schema:
                contentMediaType: application/vnd.docker.multiplexed-stream
      deprecated: false
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
    parameters: []
  /containers/{id}/changes:
    get:
      tags:
        - Container
      summary: Containerchanges
      description: >
        Returns which files in a container's filesystem have been added,
        deleted,

        or modified. The `Kind` of modification can be one of:


        - `0`: Modified ("C")

        - `1`: Added ("A")

        - `2`: Deleted ("D")
      operationId: ContainerChanges
      parameters:
        - name: id
          in: path
          description: ID or name of the container
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The list of changes
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FilesystemChange'
                description: ''
                examples:
                  - - Path: /dev
                      Kind: 0
                    - Path: /dev/kmsg
                      Kind: 1
                    - Path: /test
                      Kind: 1
                contentMediaType: application/json
              example:
                - Path: /dev
                  Kind: 0
                - Path: /dev/kmsg
                  Kind: 1
                - Path: /test
                  Kind: 1
        '404':
          description: no such container
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - examples:
                      - message: 'No such container: c2ada9df5af8'
                contentMediaType: application/json
              example:
                message: 'No such container: c2ada9df5af8'
        '500':
          description: server error
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
    parameters: []
  /containers/{id}/export:
    get:
      tags:
        - Container
      summary: Containerexport
      description: Export the contents of a container as a tarball.
      operationId: ContainerExport
      parameters:
        - name: id
          in: path
          description: ID or name of the container
          required: true
          schema:
            type: string
      responses:
        '200':
          description: no error
          headers: {}
          content: {}
        '404':
          description: no such container
          headers: {}
          content:
            application/octet-stream:
              schema:
                type: string
                contentEncoding: base64
                contentMediaType: application/octet-stream
        '500':
          description: server error
          headers: {}
          content:
            application/octet-stream:
              schema:
                type: string
                contentEncoding: base64
                contentMediaType: application/octet-stream
      deprecated: false
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
    parameters: []
  /containers/{id}/stats:
    get:
      tags:
        - Container
      summary: Containerstats
      description: >
        This endpoint returns a live stream of a container’s resource usage

        statistics.


        The `precpu_stats` is the CPU statistic of the *previous* read, and is

        used to calculate the CPU usage percentage. It is not an exact copy

        of the `cpu_stats` field.


        If either `precpu_stats.online_cpus` or `cpu_stats.online_cpus` is

        nil then for compatibility with older daemons the length of the

        corresponding `cpu_usage.percpu_usage` array should be used.


        On a cgroup v2 host, the following fields are not set

        * `blkio_stats`: all fields other than `io_service_bytes_recursive`

        * `cpu_stats`: `cpu_usage.percpu_usage`

        * `memory_stats`: `max_usage` and `failcnt`

        Also, `memory_stats.stats` fields are incompatible with cgroup v1.


        To calculate the values shown by the `stats` command of the docker cli
        tool

        the following formulas can be used:

        * used_memory = `memory_stats.usage - memory_stats.stats.cache`

        * available_memory = `memory_stats.limit`

        * Memory usage % = `(used_memory / available_memory) * 100.0`

        * cpu_delta = `cpu_stats.cpu_usage.total_usage -
        precpu_stats.cpu_usage.total_usage`

        * system_cpu_delta = `cpu_stats.system_cpu_usage -
        precpu_stats.system_cpu_usage`

        * number_cpus = `length(cpu_stats.cpu_usage.percpu_usage)` or
        `cpu_stats.online_cpus`

        * CPU usage % = `(cpu_delta / system_cpu_delta) * number_cpus * 100.0`
      operationId: ContainerStats
      parameters:
        - name: id
          in: path
          description: ID or name of the container
          required: true
          schema:
            type: string
        - name: stream
          in: query
          description: |-
            Stream the output. If false, the stats will be output once and then
            it will disconnect.
          style: form
          explode: true
          schema:
            type: boolean
            default: true
        - name: one-shot
          in: query
          description: |-
            Only get a single stat instead of waiting for 2 cycles. Must be used
            with `stream=false`.
          style: form
          explode: true
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: no error
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerStatsResponse'
        '404':
          description: no such container
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - examples:
                      - message: 'No such container: c2ada9df5af8'
                contentMediaType: application/json
              example:
                message: 'No such container: c2ada9df5af8'
        '500':
          description: server error
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
    parameters: []
  /containers/{id}/resize:
    post:
      tags:
        - Container
      summary: Containerresize
      description: Resize the TTY for a container.
      operationId: ContainerResize
      parameters:
        - name: id
          in: path
          description: ID or name of the container
          required: true
          schema:
            type: string
        - name: h
          in: query
          description: Height of the TTY session in characters
          required: true
          style: form
          explode: true
          schema:
            type: integer
            contentEncoding: int32
        - name: w
          in: query
          description: Width of the TTY session in characters
          required: true
          style: form
          explode: true
          schema:
            type: integer
            contentEncoding: int32
        - name: Content-Type
          in: header
          description: ''
          required: true
          schema:
            const: application/octet-stream
            type: string
      responses:
        '200':
          description: no error
          headers: {}
          content: {}
        '404':
          description: no such container
          headers: {}
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: cannot resize container
          headers: {}
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
    parameters: []
  /containers/{id}/start:
    post:
      tags:
        - Container
      summary: Containerstart
      description: Start a container
      operationId: ContainerStart
      parameters:
        - name: id
          in: path
          description: ID or name of the container
          required: true
          schema:
            type: string
        - name: detachKeys
          in: query
          description: |-
            Override the key sequence for detaching a container. Format is a
            single character `[a-Z]` or `ctrl-<value>` where `<value>` is one
            of: `a-z`, `@`, `^`, `[`, `,` or `_`.
          style: form
          explode: true
          schema:
            type: string
      responses:
        '204':
          description: no error
          headers: {}
          content: {}
        '304':
          description: container already started
          headers: {}
          content: {}
        '404':
          description: no such container
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - examples:
                      - message: 'No such container: c2ada9df5af8'
                contentMediaType: application/json
              example:
                message: 'No such container: c2ada9df5af8'
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: server error
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
    parameters: []
  /containers/{id}/stop:
    post:
      tags:
        - Container
      summary: Containerstop
      description: Stop a container
      operationId: ContainerStop
      parameters:
        - name: id
          in: path
          description: ID or name of the container
          required: true
          schema:
            type: string
        - name: signal
          in: query
          description: >-
            Signal to send to the container as an integer or string (e.g.
            `SIGINT`).
          style: form
          explode: true
          schema:
            type: string
        - name: t
          in: query
          description: Number of seconds to wait before killing the container
          style: form
          explode: true
          schema:
            type: integer
            contentEncoding: int32
      responses:
        '204':
          description: no error
          headers: {}
          content: {}
        '304':
          description: container already stopped
          headers: {}
          content: {}
        '404':
          description: no such container
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - examples:
                      - message: 'No such container: c2ada9df5af8'
                contentMediaType: application/json
              example:
                message: 'No such container: c2ada9df5af8'
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: server error
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
    parameters: []
  /containers/{id}/restart:
    post:
      tags:
        - Container
      summary: Containerrestart
      description: Restart a container
      operationId: ContainerRestart
      parameters:
        - name: id
          in: path
          description: ID or name of the container
          required: true
          schema:
            type: string
        - name: signal
          in: query
          description: >-
            Signal to send to the container as an integer or string (e.g.
            `SIGINT`).
          style: form
          explode: true
          schema:
            type: string
        - name: t
          in: query
          description: Number of seconds to wait before killing the container
          style: form
          explode: true
          schema:
            type: integer
            contentEncoding: int32
      responses:
        '204':
          description: no error
          headers: {}
          content: {}
        '404':
          description: no such container
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - examples:
                      - message: 'No such container: c2ada9df5af8'
                contentMediaType: application/json
              example:
                message: 'No such container: c2ada9df5af8'
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: server error
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
    parameters: []
  /containers/{id}/kill:
    post:
      tags:
        - Container
      summary: Containerkill
      description: |
        Send a POSIX signal to a container, defaulting to killing to the
        container.
      operationId: ContainerKill
      parameters:
        - name: id
          in: path
          description: ID or name of the container
          required: true
          schema:
            type: string
        - name: signal
          in: query
          description: >-
            Signal to send to the container as an integer or string (e.g.
            `SIGINT`).
          style: form
          explode: true
          schema:
            type: string
            default: SIGKILL
      responses:
        '204':
