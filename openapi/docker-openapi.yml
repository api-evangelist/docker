            - description: represents the status of a container.
        PortStatus:
          allOf:
            - $ref: '#/components/schemas/PortStatus'
            - description: >-
                represents the port status of a task's host ports whose service
                has published host ports
      description: represents the status of a task.
    Task:
      title: Task
      type: object
      properties:
        ID:
          type: string
          description: The ID of the task.
        Version:
          allOf:
            - $ref: '#/components/schemas/ObjectVersion'
            - description: >-
                The version number of the object such as node, service, etc.
                This is needed

                to avoid conflicting writes. The client must send the version
                number along

                with the modified specification when updating these objects.


                This approach ensures safe concurrency and determinism in that
                the change

                on the object may not be applied if the version number has
                changed from the

                last read. In other words, if two update requests specify the
                same base

                version, only one of the requests can succeed. As a result, two
                separate

                update requests that happen at the same time will not
                unintentionally

                overwrite each other.
        CreatedAt:
          type: string
        UpdatedAt:
          type: string
        Name:
          type: string
          description: Name of the task.
        Labels:
          type: object
          additionalProperties:
            type: string
          description: User-defined key/value metadata.
        Spec:
          allOf:
            - $ref: '#/components/schemas/TaskSpec'
            - description: User modifiable task configuration.
        ServiceID:
          type: string
          description: The ID of the service this task is part of.
        Slot:
          type: integer
          contentEncoding: int32
        NodeID:
          type: string
          description: The ID of the node that this task is on.
        AssignedGenericResources:
          type: array
          items:
            $ref: '#/components/schemas/GenericResource'
          description: >-
            User-defined resources can be either Integer resources (e.g,
            `SSD=3`) or

            String resources (e.g, `GPU=UUID1`).
          examples:
            - - DiscreteResourceSpec:
                  Kind: SSD
                  Value: 3
              - NamedResourceSpec:
                  Kind: GPU
                  Value: UUID1
              - NamedResourceSpec:
                  Kind: GPU
                  Value: UUID2
        Status:
          allOf:
            - $ref: '#/components/schemas/TaskStatus'
            - description: represents the status of a task.
        DesiredState:
          $ref: '#/components/schemas/TaskState'
        JobIteration:
          allOf:
            - $ref: '#/components/schemas/ObjectVersion'
            - description: >-
                The version number of the object such as node, service, etc.
                This is needed

                to avoid conflicting writes. The client must send the version
                number along

                with the modified specification when updating these objects.


                This approach ensures safe concurrency and determinism in that
                the change

                on the object may not be applied if the version number has
                changed from the

                last read. In other words, if two update requests specify the
                same base

                version, only one of the requests can succeed. As a result, two
                separate

                update requests that happen at the same time will not
                unintentionally

                overwrite each other.
      examples:
        - ID: 0kzzo1i0y4jz6027t0k7aezc7
          Version:
            Index: 71
          CreatedAt: '2016-06-07T21:07:31.171Z'
          UpdatedAt: '2016-06-07T21:07:31.376Z'
          Spec:
            ContainerSpec:
              Image: redis
            Resources:
              Limits: {}
              Reservations: {}
            RestartPolicy:
              Condition: any
              MaxAttempts: 0
            Placement: {}
          ServiceID: 9mnpnzenvg8p8tdbtq4wvbkcz
          Slot: 1
          NodeID: 60gvrl6tm78dmak4yl7srz94v
          Status:
            Timestamp: '2016-06-07T21:07:31.290Z'
            State: running
            Message: started
            ContainerStatus:
              ContainerID: e5d62702a1b48d01c3e02ca1e0212a250801fa8d67caca0b6f35919ebc12f035
              PID: 677
          DesiredState: running
          NetworksAttachments:
            - Network:
                ID: 4qvuz4ko70xaltuqbt8956gd1
                Version:
                  Index: 18
                CreatedAt: '2016-06-07T20:31:11.912Z'
                UpdatedAt: '2016-06-07T21:07:29.955Z'
                Spec:
                  Name: ingress
                  Labels:
                    com.docker.swarm.internal: 'true'
                  DriverConfiguration: {}
                  IPAMOptions:
                    Driver: {}
                    Configs:
                      - Subnet: 10.255.0.0/16
                        Gateway: 10.255.0.1
                DriverState:
                  Name: overlay
                  Options:
                    com.docker.network.driver.overlay.vxlanid_list: '256'
                IPAMOptions:
                  Driver:
                    Name: default
                  Configs:
                    - Subnet: 10.255.0.0/16
                      Gateway: 10.255.0.1
              Addresses:
                - 10.255.0.10/16
          AssignedGenericResources:
            - DiscreteResourceSpec:
                Kind: SSD
                Value: 3
            - NamedResourceSpec:
                Kind: GPU
                Value: UUID1
            - NamedResourceSpec:
                Kind: GPU
                Value: UUID2
    ServiceSpec:
      title: ServiceSpec
      type: object
      properties:
        Name:
          type: string
          description: Name of the service.
        Labels:
          type: object
          additionalProperties:
            type: string
          description: User-defined key/value metadata.
        TaskTemplate:
          allOf:
            - $ref: '#/components/schemas/TaskSpec'
            - description: User modifiable task configuration.
        Mode:
          allOf:
            - $ref: '#/components/schemas/Mode2'
            - description: Scheduling mode for the service.
        UpdateConfig:
          allOf:
            - $ref: '#/components/schemas/UpdateConfig'
            - description: Specification for the update strategy of the service.
        RollbackConfig:
          allOf:
            - $ref: '#/components/schemas/RollbackConfig'
            - description: Specification for the rollback strategy of the service.
        Networks:
          type: array
          items:
            $ref: '#/components/schemas/NetworkAttachmentConfig'
          description: >-
            Specifies which networks the service should attach to.


            Deprecated: This field is deprecated since v1.44. The Networks field
            in TaskSpec should be used instead.
        EndpointSpec:
          allOf:
            - $ref: '#/components/schemas/EndpointSpec'
            - description: >-
                Properties that can be configured to access and load balance a
                service.
      description: User modifiable configuration for a service.
    EndpointPortConfig:
      title: EndpointPortConfig
      type: object
      properties:
        Name:
          type: string
        Protocol:
          $ref: '#/components/schemas/Protocol1'
        TargetPort:
          type: integer
          description: The port inside the container.
          contentEncoding: int32
        PublishedPort:
          type: integer
          description: The port on the swarm hosts.
          contentEncoding: int32
        PublishMode:
          allOf:
            - $ref: '#/components/schemas/PublishMode'
            - description: >-
                The mode in which port is published.


                <p><br /></p>


                - "ingress" makes the target port accessible on every node,
                  regardless of whether there is a task for the service running on
                  that node or not.
                - "host" bypasses the routing mesh and publish the port directly
                on
                  the swarm node where that service is running.
              examples:
                - ingress
    EndpointSpec:
      title: EndpointSpec
      type: object
      properties:
        Mode:
          allOf:
            - $ref: '#/components/schemas/Mode3'
            - description: >-
                The mode of resolution to use for internal load balancing
                between tasks.
        Ports:
          type: array
          items:
            $ref: '#/components/schemas/EndpointPortConfig'
          description: >-
            List of exposed ports that this service is accessible on from the

            outside. Ports can only be provided if `vip` resolution mode is
            used.
      description: Properties that can be configured to access and load balance a service.
    Service:
      title: Service
      type: object
      properties:
        ID:
          type: string
        Version:
          allOf:
            - $ref: '#/components/schemas/ObjectVersion'
            - description: >-
                The version number of the object such as node, service, etc.
                This is needed

                to avoid conflicting writes. The client must send the version
                number along

                with the modified specification when updating these objects.


                This approach ensures safe concurrency and determinism in that
                the change

                on the object may not be applied if the version number has
                changed from the

                last read. In other words, if two update requests specify the
                same base

                version, only one of the requests can succeed. As a result, two
                separate

                update requests that happen at the same time will not
                unintentionally

                overwrite each other.
        CreatedAt:
          type: string
        UpdatedAt:
          type: string
        Spec:
          allOf:
            - $ref: '#/components/schemas/ServiceSpec'
            - description: User modifiable configuration for a service.
        Endpoint:
          $ref: '#/components/schemas/Endpoint'
        UpdateStatus:
          allOf:
            - $ref: '#/components/schemas/UpdateStatus'
            - description: The status of a service update.
        ServiceStatus:
          allOf:
            - $ref: '#/components/schemas/ServiceStatus'
            - description: >-
                The status of the service's tasks. Provided only when requested
                as

                part of a ServiceList operation.
        JobStatus:
          allOf:
            - $ref: '#/components/schemas/JobStatus'
            - description: >-
                The status of the service when it is in one of ReplicatedJob or

                GlobalJob modes. Absent on Replicated and Global mode services.
                The

                JobIteration is an ObjectVersion, but unlike the Service's
                version,

                does not need to be sent with an update request.
      examples:
        - ID: 9mnpnzenvg8p8tdbtq4wvbkcz
          Version:
            Index: 19
          CreatedAt: '2016-06-07T21:05:51.880Z'
          UpdatedAt: '2016-06-07T21:07:29.962Z'
          Spec:
            Name: hopeful_cori
            TaskTemplate:
              ContainerSpec:
                Image: redis
              Resources:
                Limits: {}
                Reservations: {}
              RestartPolicy:
                Condition: any
                MaxAttempts: 0
              Placement: {}
              ForceUpdate: 0
            Mode:
              Replicated:
                Replicas: 1
            UpdateConfig:
              Parallelism: 1
              Delay: 1000000000
              FailureAction: pause
              Monitor: 15000000000
              MaxFailureRatio: 0.15
            RollbackConfig:
