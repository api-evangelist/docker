    TaskSpec:
      title: TaskSpec
      type: object
      properties:
        PluginSpec:
          allOf:
            - $ref: '#/components/schemas/PluginSpec'
            - description: >-
                Plugin spec for the service.  *(Experimental release only.)*


                <p><br /></p>


                > **Note**: ContainerSpec, NetworkAttachmentSpec, and PluginSpec
                are

                > mutually exclusive. PluginSpec is only used when the Runtime
                field

                > is set to `plugin`. NetworkAttachmentSpec is used when the
                Runtime

                > field is set to `attachment`.
        ContainerSpec:
          allOf:
            - $ref: '#/components/schemas/ContainerSpec'
            - description: >-
                Container spec for the service.


                <p><br /></p>


                > **Note**: ContainerSpec, NetworkAttachmentSpec, and PluginSpec
                are

                > mutually exclusive. PluginSpec is only used when the Runtime
                field

                > is set to `plugin`. NetworkAttachmentSpec is used when the
                Runtime

                > field is set to `attachment`.
        NetworkAttachmentSpec:
          allOf:
            - $ref: '#/components/schemas/NetworkAttachmentSpec'
            - description: >-
                Read-only spec type for non-swarm containers attached to swarm
                overlay

                networks.


                <p><br /></p>


                > **Note**: ContainerSpec, NetworkAttachmentSpec, and PluginSpec
                are

                > mutually exclusive. PluginSpec is only used when the Runtime
                field

                > is set to `plugin`. NetworkAttachmentSpec is used when the
                Runtime

                > field is set to `attachment`.
        Resources:
          allOf:
            - $ref: '#/components/schemas/Resources1'
            - description: >-
                Resource requirements which apply to each individual container
                created

                as part of the service.
        RestartPolicy:
          allOf:
            - $ref: '#/components/schemas/RestartPolicy1'
            - description: |-
                Specification for the restart policy which applies to containers
                created as part of this service.
        Placement:
          $ref: '#/components/schemas/Placement'
        ForceUpdate:
          type: integer
          description: >-
            A counter that triggers an update even if no relevant parameters
            have

            been changed.
          contentEncoding: int32
        Runtime:
          type: string
          description: Runtime is the type of runtime specified for the task executor.
        Networks:
          type: array
          items:
            $ref: '#/components/schemas/NetworkAttachmentConfig'
          description: Specifies which networks the service should attach to.
        LogDriver:
          allOf:
            - $ref: '#/components/schemas/LogDriver1'
            - description: >-
                Specifies the log driver to use for tasks created from this
                spec. If

                not present, the default one for the swarm will be used, finally

                falling back to the engine default if not specified.
      description: User modifiable task configuration.
    TaskState:
      title: TaskState
