    - name: images-create
      path: /images/create
      operations:
      - name: imagecreate
        method: POST
        description: Create an image
        inputParameters:
        - name: fromImage
          in: query
          type: string
          description: 'Name of the image to pull. If the name includes a tag or digest, specific behavior applies: - If only
