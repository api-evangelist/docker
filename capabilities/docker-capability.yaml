naftiko: 1.0.0-alpha2
info:
  label: Docker Engine API
  description: 'The Engine API is an HTTP API served by Docker Engine. It is the API the Docker client uses to communicate
    with the Engine, so everything the Docker client can do can be done with the API. Most of the client''s commands map directly
    to API endpoints (e.g. `docker ps` is `GET /containers/json`). The notable exception is running containers, which consists
    of several API calls. # Errors The API uses standard HTTP status codes to indicate the success or failure of the API call.
    The body of the response will be JSON in the following format: ``` { "message": "page not found" } ``` # Versioning The
    AP'
  tags:
  - Docker
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: docker
    baseUri: https://api.example.com
    description: Docker Engine API HTTP API.
    resources:
    - name: containers-json
      path: /containers/json
      operations:
      - name: containerlist
        method: GET
        description: List containers
        inputParameters:
        - name: all
          in: query
          type: string
          description: Return all containers. By default, only running containers are shown.
        - name: limit
          in: query
          type: string
          description: Return this number of most recently created containers, including non-running ones.
        - name: size
          in: query
          type: string
          description: Return the size of container as fields `SizeRw` and `SizeRootFs`.
        - name: filters
          in: query
          type: string
          description: 'Filters to process on the container list, encoded as JSON (a `map[string][]string`). For example,
            `{"status": ["paused"]}` will only return paused containers. A'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: containers-create
      path: /containers/create
      operations:
      - name: containercreate
        method: POST
        description: Create a container
        inputParameters:
        - name: name
          in: query
          type: string
          description: Assign the specified name to the container. Must match `/?[a-zA-Z0-9][a-zA-Z0-9_.-]+`.
        - name: platform
          in: query
          type: string
          description: Platform in the format `os[/arch[/variant]]` used for image lookup. When specified, the daemon checks
            if the requested image is present in the local image cache
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: containers-id-json
      path: /containers/{id}/json
      operations:
      - name: containerinspect
        method: GET
        description: Inspect a container
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
          description: ID or name of the container
        - name: size
          in: query
          type: string
          description: Return the size of container as fields `SizeRw` and `SizeRootFs`
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: containers-id-top
      path: /containers/{id}/top
      operations:
      - name: containertop
        method: GET
        description: List processes running inside a container
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
          description: ID or name of the container
        - name: ps_args
          in: query
          type: string
          description: The arguments to pass to `ps`. For example, `aux`
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: containers-id-logs
      path: /containers/{id}/logs
      operations:
      - name: containerlogs
        method: GET
        description: Get container logs
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
          description: ID or name of the container
        - name: follow
          in: query
          type: string
          description: Keep connection after returning logs.
        - name: stdout
          in: query
          type: string
          description: Return logs from `stdout`
        - name: stderr
          in: query
          type: string
          description: Return logs from `stderr`
        - name: since
          in: query
          type: string
          description: Only return logs since this time, as a UNIX timestamp
        - name: until
          in: query
          type: string
          description: Only return logs before this time, as a UNIX timestamp
        - name: timestamps
          in: query
          type: string
          description: Add timestamps to every log line
        - name: tail
          in: query
          type: string
          description: Only return this number of log lines from the end of the logs. Specify as an integer or `all` to output
            all log lines.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: containers-id-changes
      path: /containers/{id}/changes
      operations:
      - name: containerchanges
        method: GET
        description: Get changes on a container’s filesystem
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
          description: ID or name of the container
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: containers-id-export
      path: /containers/{id}/export
      operations:
      - name: containerexport
        method: GET
        description: Export a container
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
          description: ID or name of the container
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: containers-id-stats
      path: /containers/{id}/stats
      operations:
      - name: containerstats
        method: GET
        description: Get container stats based on resource usage
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
          description: ID or name of the container
        - name: stream
          in: query
          type: string
          description: Stream the output. If false, the stats will be output once and then it will disconnect.
        - name: one-shot
          in: query
          type: string
          description: Only get a single stat instead of waiting for 2 cycles. Must be used with `stream=false`.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: containers-id-resize
      path: /containers/{id}/resize
      operations:
      - name: containerresize
        method: POST
        description: Resize a container TTY
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
          description: ID or name of the container
        - name: h
          in: query
          type: string
          required: true
          description: Height of the TTY session in characters
        - name: w
          in: query
          type: string
          required: true
          description: Width of the TTY session in characters
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: containers-id-start
      path: /containers/{id}/start
      operations:
      - name: containerstart
        method: POST
        description: Start a container
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
          description: ID or name of the container
        - name: detachKeys
          in: query
          type: string
          description: 'Override the key sequence for detaching a container. Format is a single character `[a-Z]` or `ctrl-<value>`
            where `<value>` is one of: `a-z`, `@`, `^`, `[`, `,`'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: containers-id-stop
      path: /containers/{id}/stop
      operations:
      - name: containerstop
        method: POST
        description: Stop a container
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
          description: ID or name of the container
        - name: signal
          in: query
          type: string
          description: Signal to send to the container as an integer or string (e.g. `SIGINT`).
        - name: t
          in: query
          type: string
          description: Number of seconds to wait before killing the container
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: containers-id-restart
      path: /containers/{id}/restart
      operations:
      - name: containerrestart
        method: POST
        description: Restart a container
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
          description: ID or name of the container
        - name: signal
          in: query
          type: string
          description: Signal to send to the container as an integer or string (e.g. `SIGINT`).
        - name: t
          in: query
          type: string
          description: Number of seconds to wait before killing the container
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: containers-id-kill
      path: /containers/{id}/kill
      operations:
      - name: containerkill
        method: POST
        description: Kill a container
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
          description: ID or name of the container
        - name: signal
          in: query
          type: string
          description: Signal to send to the container as an integer or string (e.g. `SIGINT`).
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: containers-id-update
      path: /containers/{id}/update
      operations:
      - name: containerupdate
        method: POST
        description: Update a container
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
