naftiko: 1.0.0-alpha2
info:
  label: Docker Engine API — Session
  description: 'Docker Engine API — Session. 1 operations. Lead operation: Initialize interactive session. Self-contained
    Naftiko capability covering one Docker business surface.'
  tags:
  - Docker
  - Session
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DOCKER_API_KEY: DOCKER_API_KEY
capability:
  consumes:
  - type: http
    namespace: docker-session
    baseUri: ''
    description: Docker Engine API — Session business capability. Self-contained, no shared references.
    resources:
    - name: session
      path: /session
      operations:
      - name: session
        method: POST
        description: Initialize interactive session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: docker-session-rest
    port: 8080
    description: REST adapter for Docker Engine API — Session. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/session
      name: session
      description: REST surface for session.
      operations:
      - method: POST
        name: session
        description: Initialize interactive session
        call: docker-session.session
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: docker-session-mcp
    port: 9090
    transport: http
    description: MCP adapter for Docker Engine API — Session. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: initialize-interactive-session
      description: Initialize interactive session
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: docker-session.session
      outputParameters:
      - type: object
        mapping: $.
