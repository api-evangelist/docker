naftiko: 1.0.0-alpha2
info:
  label: Docker Engine API — Config
  description: 'Docker Engine API — Config. 5 operations. Lead operation: List configs. Self-contained Naftiko capability
    covering one Docker business surface.'
  tags:
  - Docker
  - Config
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DOCKER_API_KEY: DOCKER_API_KEY
capability:
  consumes:
  - type: http
    namespace: docker-config
    baseUri: ''
    description: Docker Engine API — Config business capability. Self-contained, no shared references.
    resources:
    - name: configs
      path: /configs
      operations:
      - name: configlist
        method: GET
        description: List configs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filters
          in: query
          type: string
          description: A JSON encoded value of the filters (a `map[string][]string`) to
    - name: configs-create
      path: /configs/create
      operations:
      - name: configcreate
        method: POST
        description: Create a config
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: string
    - name: configs-id
      path: /configs/{id}
      operations:
      - name: configinspect
        method: GET
        description: Inspect a config
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: ID of the config
          required: true
      - name: configdelete
        method: DELETE
        description: Delete a config
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: ID of the config
          required: true
    - name: configs-id-update
      path: /configs/{id}/update
      operations:
      - name: configupdate
        method: POST
        description: Update a Config
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The ID or name of the config
          required: true
        - name: body
          in: body
          type: string
          description: The spec of the config to update. Currently, only the Labels field
        - name: version
          in: query
          type: integer
          description: The version number of the config object being updated. This is
          required: true
  exposes:
  - type: rest
    namespace: docker-config-rest
    port: 8080
    description: REST adapter for Docker Engine API — Config. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/configs
      name: configs
      description: REST surface for configs.
      operations:
      - method: GET
        name: configlist
        description: List configs
        call: docker-config.configlist
        with:
          filters: rest.filters
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/configs/create
      name: configs-create
      description: REST surface for configs-create.
      operations:
      - method: POST
        name: configcreate
        description: Create a config
        call: docker-config.configcreate
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/configs/{id}
      name: configs-id
      description: REST surface for configs-id.
      operations:
      - method: GET
        name: configinspect
        description: Inspect a config
        call: docker-config.configinspect
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: configdelete
        description: Delete a config
        call: docker-config.configdelete
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/configs/{id}/update
      name: configs-id-update
      description: REST surface for configs-id-update.
      operations:
      - method: POST
        name: configupdate
        description: Update a Config
        call: docker-config.configupdate
        with:
          id: rest.id
          body: rest.body
          version: rest.version
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: docker-config-mcp
    port: 9090
    transport: http
    description: MCP adapter for Docker Engine API — Config. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-configs
      description: List configs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: docker-config.configlist
      with:
        filters: tools.filters
      outputParameters:
      - type: object
        mapping: $.
    - name: create-config
      description: Create a config
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: docker-config.configcreate
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: inspect-config
      description: Inspect a config
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: docker-config.configinspect
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-config
      description: Delete a config
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: docker-config.configdelete
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: update-config
      description: Update a Config
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: docker-config.configupdate
      with:
        id: tools.id
        body: tools.body
        version: tools.version
      outputParameters:
      - type: object
        mapping: $.
