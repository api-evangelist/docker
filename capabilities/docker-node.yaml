naftiko: 1.0.0-alpha2
info:
  label: Docker Engine API — Node
  description: 'Docker Engine API — Node. 4 operations. Lead operation: List nodes. Self-contained Naftiko capability covering
    one Docker business surface.'
  tags:
  - Docker
  - Node
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DOCKER_API_KEY: DOCKER_API_KEY
capability:
  consumes:
  - type: http
    namespace: docker-node
    baseUri: ''
    description: Docker Engine API — Node business capability. Self-contained, no shared references.
    resources:
    - name: nodes
      path: /nodes
      operations:
      - name: nodelist
        method: GET
        description: List nodes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filters
          in: query
          type: string
          description: Filters to process on the nodes list, encoded as JSON (a `map[string][]string`).
    - name: nodes-id
      path: /nodes/{id}
      operations:
      - name: nodeinspect
        method: GET
        description: Inspect a node
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The ID or name of the node
          required: true
      - name: nodedelete
        method: DELETE
        description: Delete a node
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The ID or name of the node
          required: true
        - name: force
          in: query
          type: boolean
          description: Force remove a node from the swarm
    - name: nodes-id-update
      path: /nodes/{id}/update
      operations:
      - name: nodeupdate
        method: POST
        description: Update a node
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The ID of the node
          required: true
        - name: body
          in: body
          type: string
        - name: version
          in: query
          type: integer
          description: The version number of the node object being updated. This is required
          required: true
  exposes:
  - type: rest
    namespace: docker-node-rest
    port: 8080
    description: REST adapter for Docker Engine API — Node. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/nodes
      name: nodes
      description: REST surface for nodes.
      operations:
      - method: GET
        name: nodelist
        description: List nodes
        call: docker-node.nodelist
        with:
          filters: rest.filters
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/nodes/{id}
      name: nodes-id
      description: REST surface for nodes-id.
      operations:
      - method: GET
        name: nodeinspect
        description: Inspect a node
        call: docker-node.nodeinspect
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: nodedelete
        description: Delete a node
        call: docker-node.nodedelete
        with:
          id: rest.id
          force: rest.force
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/nodes/{id}/update
      name: nodes-id-update
      description: REST surface for nodes-id-update.
      operations:
      - method: POST
        name: nodeupdate
        description: Update a node
        call: docker-node.nodeupdate
        with:
          id: rest.id
          body: rest.body
          version: rest.version
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: docker-node-mcp
    port: 9090
    transport: http
    description: MCP adapter for Docker Engine API — Node. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-nodes
      description: List nodes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: docker-node.nodelist
      with:
        filters: tools.filters
      outputParameters:
      - type: object
        mapping: $.
    - name: inspect-node
      description: Inspect a node
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: docker-node.nodeinspect
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-node
      description: Delete a node
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: docker-node.nodedelete
      with:
        id: tools.id
        force: tools.force
      outputParameters:
      - type: object
        mapping: $.
    - name: update-node
      description: Update a node
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: docker-node.nodeupdate
      with:
        id: tools.id
        body: tools.body
        version: tools.version
      outputParameters:
      - type: object
        mapping: $.
