naftiko: 1.0.0-alpha2
info:
  label: Docker Engine API — Exec
  description: 'Docker Engine API — Exec. 4 operations. Lead operation: Create an exec instance. Self-contained Naftiko capability
    covering one Docker business surface.'
  tags:
  - Docker
  - Exec
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DOCKER_API_KEY: DOCKER_API_KEY
capability:
  consumes:
  - type: http
    namespace: docker-exec
    baseUri: ''
    description: Docker Engine API — Exec business capability. Self-contained, no shared references.
    resources:
    - name: containers-id-exec
      path: /containers/{id}/exec
      operations:
      - name: containerexec
        method: POST
        description: Create an exec instance
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: execConfig
          in: body
          type: object
          description: Exec configuration
          required: true
        - name: id
          in: path
          type: string
          description: ID or name of container
          required: true
    - name: exec-id-json
      path: /exec/{id}/json
      operations:
      - name: execinspect
        method: GET
        description: Inspect an exec instance
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Exec instance ID
          required: true
    - name: exec-id-resize
      path: /exec/{id}/resize
      operations:
      - name: execresize
        method: POST
        description: Resize an exec instance
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Exec instance ID
          required: true
        - name: h
          in: query
          type: integer
          description: Height of the TTY session in characters
          required: true
        - name: w
          in: query
          type: integer
          description: Width of the TTY session in characters
          required: true
    - name: exec-id-start
      path: /exec/{id}/start
      operations:
      - name: execstart
        method: POST
        description: Start an exec instance
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: execStartConfig
          in: body
          type: object
        - name: id
          in: path
          type: string
          description: Exec instance ID
          required: true
  exposes:
  - type: rest
    namespace: docker-exec-rest
    port: 8080
    description: REST adapter for Docker Engine API — Exec. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/containers/{id}/exec
      name: containers-id-exec
      description: REST surface for containers-id-exec.
      operations:
      - method: POST
        name: containerexec
        description: Create an exec instance
        call: docker-exec.containerexec
        with:
          execConfig: rest.execConfig
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/exec/{id}/json
      name: exec-id-json
      description: REST surface for exec-id-json.
      operations:
      - method: GET
        name: execinspect
        description: Inspect an exec instance
        call: docker-exec.execinspect
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/exec/{id}/resize
      name: exec-id-resize
      description: REST surface for exec-id-resize.
      operations:
      - method: POST
        name: execresize
        description: Resize an exec instance
        call: docker-exec.execresize
        with:
          id: rest.id
          h: rest.h
          w: rest.w
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/exec/{id}/start
      name: exec-id-start
      description: REST surface for exec-id-start.
      operations:
      - method: POST
        name: execstart
        description: Start an exec instance
        call: docker-exec.execstart
        with:
          execStartConfig: rest.execStartConfig
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: docker-exec-mcp
    port: 9090
    transport: http
    description: MCP adapter for Docker Engine API — Exec. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: create-exec-instance
      description: Create an exec instance
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: docker-exec.containerexec
      with:
        execConfig: tools.execConfig
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: inspect-exec-instance
      description: Inspect an exec instance
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: docker-exec.execinspect
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: resize-exec-instance
      description: Resize an exec instance
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: docker-exec.execresize
      with:
        id: tools.id
        h: tools.h
        w: tools.w
      outputParameters:
      - type: object
        mapping: $.
    - name: start-exec-instance
      description: Start an exec instance
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: docker-exec.execstart
      with:
        execStartConfig: tools.execStartConfig
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
