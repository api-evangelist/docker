naftiko: 1.0.0-alpha2
info:
  label: Docker Engine API — System
  description: 'Docker Engine API — System. 7 operations. Lead operation: Ping. Self-contained Naftiko capability covering
    one Docker business surface.'
  tags:
  - Docker
  - System
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DOCKER_API_KEY: DOCKER_API_KEY
capability:
  consumes:
  - type: http
    namespace: docker-system
    baseUri: ''
    description: Docker Engine API — System business capability. Self-contained, no shared references.
    resources:
    - name: _ping
      path: /_ping
      operations:
      - name: systemping
        method: GET
        description: Ping
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: systempinghead
        method: HEAD
        description: Ping
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: auth
      path: /auth
      operations:
      - name: systemauth
        method: POST
        description: Check auth configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: authConfig
          in: body
          type: string
          description: Authentication to check
    - name: events
      path: /events
      operations:
      - name: systemevents
        method: GET
        description: Monitor events
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: since
          in: query
          type: string
          description: Show events created since this timestamp then stream new events.
        - name: until
          in: query
          type: string
          description: Show events created until this timestamp then stop streaming.
        - name: filters
          in: query
          type: string
          description: 'A JSON encoded value of filters (a `map[string][]string`) to process on the event list. Available
            filters:'
    - name: info
      path: /info
      operations:
      - name: systeminfo
        method: GET
        description: Get system information
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: system-df
      path: /system/df
      operations:
      - name: systemdatausage
        method: GET
        description: Get data usage information
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: type
          in: query
          type: array
          description: Object types, for which to compute and return data.
        - name: verbose
          in: query
          type: boolean
          description: Show detailed information on space usage.
    - name: version
      path: /version
      operations:
      - name: systemversion
        method: GET
        description: Get version
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: docker-system-rest
    port: 8080
    description: REST adapter for Docker Engine API — System. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/ping
      name: ping
      description: REST surface for _ping.
      operations:
      - method: GET
        name: systemping
        description: Ping
        call: docker-system.systemping
        outputParameters:
        - type: object
          mapping: $.
      - method: HEAD
        name: systempinghead
        description: Ping
        call: docker-system.systempinghead
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/auth
      name: auth
      description: REST surface for auth.
      operations:
      - method: POST
        name: systemauth
        description: Check auth configuration
        call: docker-system.systemauth
        with:
          authConfig: rest.authConfig
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/events
      name: events
      description: REST surface for events.
      operations:
      - method: GET
        name: systemevents
        description: Monitor events
        call: docker-system.systemevents
        with:
          since: rest.since
          until: rest.until
          filters: rest.filters
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/info
      name: info
      description: REST surface for info.
      operations:
      - method: GET
        name: systeminfo
        description: Get system information
        call: docker-system.systeminfo
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/system/df
      name: system-df
      description: REST surface for system-df.
      operations:
      - method: GET
        name: systemdatausage
        description: Get data usage information
        call: docker-system.systemdatausage
        with:
          type: rest.type
          verbose: rest.verbose
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/version
      name: version
      description: REST surface for version.
      operations:
      - method: GET
        name: systemversion
        description: Get version
        call: docker-system.systemversion
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: docker-system-mcp
    port: 9090
    transport: http
    description: MCP adapter for Docker Engine API — System. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: ping
      description: Ping
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: docker-system.systemping
      outputParameters:
      - type: object
        mapping: $.
    - name: ping-2
      description: Ping
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: docker-system.systempinghead
      outputParameters:
      - type: object
        mapping: $.
    - name: check-auth-configuration
      description: Check auth configuration
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: docker-system.systemauth
      with:
        authConfig: tools.authConfig
      outputParameters:
      - type: object
        mapping: $.
    - name: monitor-events
      description: Monitor events
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: docker-system.systemevents
      with:
        since: tools.since
        until: tools.until
        filters: tools.filters
      outputParameters:
      - type: object
        mapping: $.
    - name: get-system-information
      description: Get system information
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: docker-system.systeminfo
      outputParameters:
      - type: object
        mapping: $.
    - name: get-data-usage-information
      description: Get data usage information
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: docker-system.systemdatausage
      with:
        type: tools.type
        verbose: tools.verbose
      outputParameters:
      - type: object
        mapping: $.
    - name: get-version
      description: Get version
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: docker-system.systemversion
      outputParameters:
      - type: object
        mapping: $.
