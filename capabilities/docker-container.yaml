        description: Remove a container
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: ID or name of the container
          required: true
        - name: v
          in: query
          type: boolean
          description: Remove anonymous volumes associated with the container.
        - name: force
          in: query
